<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Exam Preparation | Cambridge Digital Catalogue</title><link rel="stylesheet" href="css/catalogue.css">
<style>
.page-hero{padding:46px 6% 34px;background:#fff}.hero-inner{max-width:1180px;margin:auto}.back-link{display:inline-block;margin-bottom:18px;color:var(--navy);text-decoration:none;font-size:12px;font-weight:700}.page-hero h1{margin:0;font-size:clamp(32px,5vw,48px);letter-spacing:-1.3px}.hero-description{max-width:680px;margin:10px 0 0;color:var(--muted);font-size:13px;line-height:1.6}.controls{margin-top:26px;display:flex;gap:10px;flex-wrap:wrap}.controls input,.controls select{box-sizing:border-box;padding:12px 13px;border:1px solid var(--border);border-radius:8px;background:#fff;font:inherit;font-size:12px}.controls input{flex:1 1 280px}.selection-bar{margin-top:13px;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--border);border-radius:8px;background:#fafbfc}.selection-bar[hidden]{display:none}.selection-status{margin:0;color:var(--muted);font-size:11px}.view-selection{padding:9px 12px;border-radius:6px;background:var(--navy);color:#fff;text-decoration:none;font-size:10px;font-weight:750}.results-summary{margin-bottom:18px;display:flex;justify-content:space-between;align-items:end;gap:16px}.results-summary h2{margin:0;font-size:25px}.results-count{margin:0;color:var(--muted);font-size:11px}.group-section+.group-section{margin-top:30px}.group-title{padding:0 2px 8px;display:flex;justify-content:space-between;align-items:end;gap:14px;border-bottom:2px solid var(--navy)}.group-title h3{margin:0;font-size:20px}.group-title span{color:var(--muted);font-size:10px}.book-list{overflow:hidden;border:1px solid var(--border);border-radius:var(--radius);background:#fff}.book-card{padding:20px 22px;display:grid;grid-template-columns:104px minmax(0,1fr) 160px;gap:22px;align-items:center;border-bottom:1px solid var(--border)}.book-card:last-child{border-bottom:0}.book-cover{width:104px;aspect-ratio:2/3;overflow:hidden;display:flex;align-items:center;justify-content:center;border-radius:7px;background:#eef1f5;color:#8b95a5;font-size:8px;font-weight:750;text-align:center}.book-cover img{width:100%;height:100%;object-fit:cover}.book-info{min-width:0}.book-info h4{margin:0 0 7px;font-size:15px;line-height:1.35}.book-meta{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--muted);font-size:10px}.book-actions{display:grid;gap:9px}.view-book,.add-book{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:7px;font-size:10px;font-weight:750;text-align:center;text-decoration:none;cursor:pointer}.view-book{border:1px solid var(--navy);background:var(--navy);color:#fff}.add-book{border:1px solid var(--navy);background:#fff;color:var(--navy)}.qty-control{display:grid;grid-template-columns:36px minmax(52px,1fr) 36px;border:1px solid #d9dee6;border-radius:7px;overflow:hidden}.qty-control button,.qty-control input{height:36px;border:0;background:#fff;color:var(--navy);font:inherit;font-weight:750;text-align:center}.qty-control button{cursor:pointer;font-size:16px}.qty-control input{width:100%;box-sizing:border-box;border-left:1px solid #e4e7ec;border-right:1px solid #e4e7ec;font-size:11px;-moz-appearance:textfield}.qty-control input::-webkit-outer-spin-button,.qty-control input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.qty-error{min-height:14px;margin-top:4px;color:#a33b3b;font-size:9px;font-weight:650;line-height:1.35}.qty-control.invalid{border-color:#b84646;background:#fff8f8}.message{padding:40px 22px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;text-align:center;color:var(--muted);font-size:12px}.subgroup{margin-top:12px}.subgroup-label{padding:13px 18px;background:#fafbfc;border:1px solid var(--border);border-bottom:0;border-radius:var(--radius) var(--radius) 0 0;font-size:13px;font-weight:750}.subgroup .book-list{border-radius:0 0 var(--radius) var(--radius)}
@media(max-width:720px){.page-hero{padding:36px 18px 28px}.selection-bar,.results-summary{align-items:flex-start;flex-direction:column}.book-card{padding:18px;grid-template-columns:86px minmax(0,1fr);gap:16px;align-items:start}.book-cover{width:86px}.book-actions{grid-column:2;width:100%;max-width:190px}.view-book,.add-book{padding:10px}.group-title{align-items:start}}
</style>
</head><body>
<header class="catalogue-header"><div class="brand"><div class="brand-name">CAMBRIDGE</div><div class="brand-company">PUBLISHING COMPANY PVT. LTD.</div></div><div class="catalogue-year">DIGITAL CATALOGUE · 2026–27</div></header>
<section class="page-hero"><div class="hero-inner"><a class="back-link" id="backLink" href="school-education.html">← Back</a><p class="eyebrow">EXAM PREPARATION</p><h1 id="pageHeading">Exam Preparation</h1><p class="hero-description" id="pageDescription">Browse Cambridge exam-preparation publications.</p><div class="controls" id="controls" hidden><input id="search" type="search" placeholder="Search books, subjects or series..." aria-label="Search exam books"><select id="family"><option value="">All Product Families</option></select><select id="subject"><option value="">All Subjects</option></select></div><div class="selection-bar" id="selectionBar" hidden><p class="selection-status" id="selectionStatus"></p><a class="view-selection" href="order.html">My Selection →</a></div></div></section>
<main><section class="catalogue-section"><div class="results-summary" id="summary" hidden><h2>Publications</h2><p class="results-count" id="resultsCount"></p></div><div id="list"></div></section></main>
<footer><div><strong>Cambridge Publishing Company Pvt. Ltd.</strong><p>Bengaluru, Karnataka</p></div><p class="footer-note">Digital Catalogue · 2026–27</p></footer>
<script src="js/catalogue-data.js"></script><script src="js/catalogue-selection.js?v=20260816-2"></script><script>
const Selection=window.CambridgeSelection;
if(!Selection){throw new Error("Cambridge selection module failed to load.");}

const FAMILY_ORDER=["Honest Success Series","LBA","Internal Assessment","Workbooks"],SUBJECT_ORDER=["English I Language","English II Language","English III Language","Kannada I Language","Kannada II Language","Hindi III Language","Mathematics","Science","Social Science","Combined"];
let selectedClass=null,books=[];
function op(v,a){const i=a.indexOf(v);return i<0?999:i}
function createCard(book){const row=document.createElement("article");row.className="book-card";row.appendChild(Selection.coverNode(book));const info=document.createElement("div");info.className="book-info";const h=document.createElement("h4");h.textContent=book.title||"Untitled Book";const m=document.createElement("div");m.className="book-meta";[book.displaySubject||book.subject,book.medium?book.medium+" Medium":"",book.sku?"SKU: "+book.sku:"",book.isbn?"ISBN: "+book.isbn:"",Number.isFinite(book.mrp)?"MRP ₹"+book.mrp:""].filter(Boolean).forEach(v=>{const s=document.createElement("span");s.textContent=v;m.appendChild(s)});info.append(h,m);row.append(info,Selection.actionNode(book));return row}
function filtered(){const q=document.getElementById("search").value.trim().toLowerCase(),f=document.getElementById("family").value,s=document.getElementById("subject").value;return books.filter(b=>(!f||b.family===f)&&(!s||b.subject===s)&&(!q||[b.title,b.series,b.family,b.subject,b.displaySubject,b.medium,b.sku,b.isbn].filter(Boolean).join(" ").toLowerCase().includes(q)))}
function render(){const a=filtered(),root=document.getElementById("list");root.innerHTML="";document.getElementById("resultsCount").textContent=a.length+(a.length===1?" book":" books");if(!a.length){root.innerHTML='<div class="message">No matching exam-preparation books.</div>';return}const fams=[...new Set(a.map(b=>b.family||"Other"))].sort((x,y)=>op(x,FAMILY_ORDER)-op(y,FAMILY_ORDER)||x.localeCompare(y));fams.forEach(f=>{const fs=document.createElement("section");fs.className="group-section";const fa=a.filter(b=>(b.family||"Other")===f);fs.innerHTML='<div class="group-title"><h3></h3><span></span></div>';fs.querySelector("h3").textContent=f;fs.querySelector("span").textContent=fa.length+(fa.length===1?" book":" books");const subjects=[...new Set(fa.map(b=>b.subject||"Other"))].sort((x,y)=>op(x,SUBJECT_ORDER)-op(y,SUBJECT_ORDER)||x.localeCompare(y));subjects.forEach(s=>{const sg=document.createElement("div");sg.className="subgroup";const label=document.createElement("div");label.className="subgroup-label";label.textContent=s;const list=document.createElement("div");list.className="book-list";fa.filter(b=>(b.subject||"Other")===s).forEach(b=>list.appendChild(createCard(b)));sg.append(label,list);fs.appendChild(sg)});root.appendChild(fs)})}
function refresh(){render();Selection.updateBar()}
function init(){const c=Number(new URLSearchParams(location.search).get("class"));if(!Number.isInteger(c)||c<5||c>10){document.getElementById("list").innerHTML='<div class="message">Choose Class 5–10 from School Education to browse exam preparation.</div>';return}selectedClass=c;window.SELECTION_EXTRA={};document.getElementById("pageHeading").textContent="Class "+c+" Exam Preparation";document.getElementById("backLink").href="school-education.html?class="+c;books=catalogue().filter(b=>b.category==="exam"&&Number(b.class)===c);document.getElementById("controls").hidden=false;document.getElementById("summary").hidden=false;[["family",FAMILY_ORDER],["subject",SUBJECT_ORDER]].forEach(([id,ord])=>{const el=document.getElementById(id),field=id;[...new Set(books.map(b=>b[field]).filter(Boolean))].sort((a,b)=>op(a,ord)-op(b,ord)||a.localeCompare(b)).forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;el.appendChild(o)});el.onchange=render});document.getElementById("search").oninput=render;refresh()}
window.addEventListener(Selection.CHANGE_EVENT,refresh);
document.addEventListener("DOMContentLoaded",init);
</script></body></html>
