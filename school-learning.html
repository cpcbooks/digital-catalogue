<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>School Learning | Cambridge Digital Catalogue</title><link rel="stylesheet" href="css/catalogue.css"><link rel="stylesheet" href="css/selection-pane.css"><style>.page-hero{padding:44px 6% 32px;background:#fff}.page-wrap{max-width:1180px;margin:auto}.back-link{display:inline-block;margin-bottom:22px;color:var(--navy);text-decoration:none;font-size:12px;font-weight:700}.page-hero h1{margin:0;font-size:clamp(34px,5vw,50px);letter-spacing:-1.3px}.intro{margin:11px 0 0;color:var(--muted);font-size:13px}.class-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:23px}.class-tabs a{padding:8px 13px;border:1px solid var(--border);border-radius:999px;background:#fff;color:#5d6876;text-decoration:none;font-size:10px;font-weight:700}.class-tabs a.active{background:var(--navy);border-color:var(--navy);color:#fff}.content{max-width:1180px;margin:auto;padding:34px 6% 90px}.category-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:900px}.category-grid.single{grid-template-columns:minmax(0,440px)}.category-card{min-height:260px;padding:28px;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius);background:#fff}.category-label{margin-bottom:28px;color:var(--navy);font-size:10px;font-weight:800;letter-spacing:1.2px}.category-card h2{margin:0 0 10px;font-size:22px}.category-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}.category-card a{margin-top:auto;padding:12px 15px;border:1px solid var(--navy);border-radius:7px;background:#fff;color:var(--navy);text-decoration:none;text-align:center;font-size:12px;font-weight:750}.exam-card{background:var(--navy);color:#fff;border-color:var(--navy)}.exam-card .category-label,.exam-card p{color:rgba(255,255,255,.72)}.exam-card a{background:#fff;color:var(--navy);border-color:#fff}@media(max-width:700px){.page-hero{padding:34p , assessment materials, workbooks and other exam-preparation publications available for this class.",cta:"Explore Exam Preparation →",href:"exam-preparation.html?class="+c}];const available=c>=5?defs:[defs[0]];const grid=document.getElementById("grid");if(available.length===1)grid.classList.add("single");available.forEach(d=>{const card=document.createElement("article");card.className="category-card "+(d.type==="exam"?"exam-card":"");card.innerHTML='<div class="category-label">'+d.label+'</div><h2>'+d.title+'</h2><p>'+d.description+'</p><a href="'+d.href+'">'+d.cta+'</a>';grid.appendChild(card)});</script></body></html>
