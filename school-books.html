<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    School Books | Cambridge Digital Catalogue
</title>

<link
    rel="stylesheet"
    href="css/catalogue.css"
>

<style>

.books-hero{
    padding:48px 6% 36px;
    background:#fff;
}

.books-hero-inner{
    max-width:1180px;
    margin:auto;
}

.back-link{
    display:inline-block;
    margin-bottom:20px;
    color:var(--navy);
    text-decoration:none;
    font-size:12px;
    font-weight:700;
}

.books-hero h1{
    margin:0;
    font-size:clamp(32px,5vw,48px);
    letter-spacing:-1.3px;
}

.hero-description{
    max-width:650px;
    margin:12px 0 0;
    color:var(--muted);
    font-size:13px;
    line-height:1.6;
}

.catalogue-controls{
    margin-top:28px;
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    gap:12px;
    align-items:center;
}

.search-box{
    position:relative;
}

.search-box input{
    width:100%;
    box-sizing:border-box;
    padding:13px 15px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#fff;
    color:var(--text);
    font:inherit;
    font-size:13px;
}

.search-box input:focus{
    outline:2px solid var(--navy);
    outline-offset:1px;
}

.subject-filter{
    padding:13px 38px 13px 14px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#fff;
    color:var(--text);
    font:inherit;
    font-size:13px;
}

.selection-bar{
    margin-top:14px;
    padding:12px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#fafbfc;
}

.selection-status{
    margin:0;
    color:var(--muted);
    font-size:11px;
    line-height:1.4;
}

.selection-status strong{
    color:var(--text);
}

.view-selection{
    flex:0 0 auto;
    padding:9px 13px;
    border:1px solid var(--navy);
    border-radius:6px;
    background:var(--navy);
    color:#fff;
    text-decoration:none;
    font-size:10px;
    font-weight:750;
    white-space:nowrap;
}

.results-summary{
    margin-bottom:18px;
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:20px;
}

.results-summary h2{
    margin:0;
    font-size:25px;
}

.results-count{
    margin:0;
    color:var(--muted);
    font-size:11px;
}

.subject-section{
    display:grid;
    gap:12px;
}

.subject-section + .subject-section{
    margin-top:30px;
}

.subject-heading{
    padding:0 2px 8px;
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:20px;
    border-bottom:2px solid var(--navy);
}

.subject-heading h3{
    margin:0;
    font-size:20px;
    line-height:1.2;
}

.subject-heading span{
    flex:0 0 auto;
    color:var(--muted);
    font-size:10px;
}

.series-group{
    overflow:hidden;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:#fff;
}

.series-header{
    padding:18px 23px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    border-bottom:1px solid var(--border);
    background:#fafbfc;
}

.series-heading{
    min-width:0;
}

.series-label{
    margin:0 0 5px;
    color:var(--navy);
    font-size:9px;
    font-weight:800;
    letter-spacing:1.2px;
    text-transform:uppercase;
}

.series-header h4{
    margin:0;
    font-size:17px;
}

.series-count{
    flex:0 0 auto;
    color:var(--muted);
    font-size:10px;
}

.book-list{
    display:grid;
}

.catalogue-book{
    padding:18px 23px;
    display:grid;
    grid-template-columns:64px minmax(0,1fr) auto;
    gap:18px;
    align-items:center;
    border-bottom:1px solid var(--border);
}

.catalogue-book:last-child{
    border-bottom:0;
}

.cover-placeholder{
    width:64px;
    height:84px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:5px;
    background:#eef1f5;
    color:#8b95a5;
    font-size:8px;
    font-weight:750;
    text-align:center;
}

.book-details{
    min-width:0;
}

.book-details h5{
    margin:0 0 6px;
    font-size:14px;
    line-height:1.35;
}

.book-meta{
    display:flex;
    flex-wrap:wrap;
    gap:6px 12px;
    color:var(--muted);
    font-size:10px;
}

.book-action{
    min-width:112px;
    padding:9px 12px;
    border:1px solid var(--navy);
    border-radius:6px;
    background:#fff;
    color:var(--navy);
    cursor:pointer;
    font-size:10px;
    font-weight:750;
    white-space:nowrap;
    touch-action:manipulation;
}

.book-action:hover{
    background:var(--navy);
    color:#fff;
}

.book-action:focus-visible{
    outline:2px solid var(--navy);
    outline-offset:2px;
}

.book-action.is-selected{
    border-color:#d9dee6;
    background:#f5f7fa;
    color:var(--navy);
    cursor:pointer;
}

.message-state{
    padding:40px 24px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:#fff;
    text-align:center;
}

.message-state h2{
    margin:0 0 8px;
    font-size:21px;
}

.message-state p{
    max-width:540px;
    margin:0 auto;
    color:var(--muted);
    font-size:12px;
    line-height:1.6;
}

.message-state a{
    display:inline-block;
    margin-top:18px;
    color:var(--navy);
    font-size:12px;
    font-weight:750;
    text-decoration:none;
}

@media(max-width:700px){

    .books-hero{
        padding:36px 18px 30px;
    }

    .catalogue-controls{
        grid-template-columns:1fr;
    }

    .subject-filter{
        width:100%;
    }

    .selection-bar{
        align-items:flex-start;
        flex-direction:column;
    }

    .results-summary{
        align-items:start;
        flex-direction:column;
        gap:5px;
    }

    .subject-section + .subject-section{
        margin-top:26px;
    }

    .subject-heading{
        align-items:start;
    }

    .series-header{
        padding:17px 18px;
    }

    .catalogue-book{
        padding:17px 18px;
        grid-template-columns:52px minmax(0,1fr);
        gap:14px;
    }

    .cover-placeholder{
        width:52px;
        height:70px;
    }

    .book-action{
        grid-column:2;
        justify-self:start;
    }

}

@media(hover:none){

    .book-action:hover{
        background:#fff;
        color:var(--navy);
    }

    .book-action.is-selected:hover{
        background:#f5f7fa;
        color:var(--navy);
    }

}

</style>

</head>

<body>

    <div class="brand">

        <div class="brand-name">
            CAMBRIDGE
        </div>

        <div class="brand-company">
            PUBLISHING COMPANY PVT. LTD.
        </div>

    </div>

    <div class="catalogue-year">
        DIGITAL CATALOGUE · 2026–27
    </div>

</header>

<section class="books-hero">

    <div class="books-hero-inner">

        <a
            href="school-education.html"
            class="back-link"
            id="backLink"
        >
            ← School Education
        </a>

        <p class="eyebrow">

        </p>

        </h1>

</main>

<footer>

    <div>

        <strong>
            Cambridge Publishing Company Pvt. Ltd.
        </strong>

        <p>
            Bengaluru, Karnataka
        </p>

    </div>

    <p class="footer-note">
        Digital Catalogue · 2026–27
    </p>

</footer>

<script src="js/catalogue-data.js"></script>

<script>

const ORDER_KEY =
    "cambridgeOrder";

const MAX_QUANTITY =
    10000;

const SUBJECT_ORDER = [

    "Semester Books",

    "English",
    "English Grammar",
    "English Writing",

    "Kannada",
    "Kannada Writing",

    "Hindi",
    "Hindi Writing",

    "Mathematics",

    "Environmental Studies",

    "Science",

    "Social Science",

    "Computer Science",

    "General Knowledge",

    "Moral Science",

    "Drawing",

    "Art & Craft"

];

const SUBJECT_GROUPS = [

    {
        name:"Semester Books",
        subjects:[
            "Semester Books"
        ]
    },

    {
        name:"English",
        subjects:[
            "English",
            "English Grammar",
            "English Writing"
        ]
    },

    {
        name:"Kannada",
        subjects:[
            "Kannada",
            "Kannada Writing"
        ]
    },

    {
        name:"Hindi",
        subjects:[
            "Hindi",
            "Hindi Writing"
        ]
    },

    {
        name:"Mathematics",
        subjects:[
            "Mathematics"
        ]
    },

    {
        name:"Environmental Studies",
        subjects:[
            "Environmental Studies"
        ]
    },

    {
        name:"Science",
        subjects:[
            "Science"
        ]
    },

    {
        name:"Social Science",
        subjects:[
            "Social Science"
        ]
    },

    {
        name:"Computer Science",
        subjects:[
            "Computer Science"
        ]
    },

    {
        name:"General Knowledge",
        subjects:[
            "General Knowledge"
        ]
    },

    {
        name:"Moral Science",
        subjects:[
            "Moral Science"
        ]
    },

    {
        name:"Drawing",
        subjects:[
            "Drawing"
        ]
    },

    {
        name:"Art & Craft",
        subjects:[
            "Art & Craft"
        ]
    }

];

let selectedClass =
    null;

let classBooks =
    [];


function isValidClass(value){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){
        return false;
    }

    const number =
        Number(value);

    return (
        Number.isInteger(number) &&
        number >= 1 &&
        number <= 10
    );

}


function getCatalogue(){

    if(
        !Array.isArray(
            window.CAMBRIDGE_CATALOGUE
        )
    ){
        return [];
    }

    return window
        .CAMBRIDGE_CATALOGUE
        .filter(function(book){

            return (
                book &&
                typeof book === "object" &&
                book.active !== false
            );

        });

}


function getStoredOrder(){

    let parsed = [];

    try{

        const raw =
            localStorage.getItem(
                ORDER_KEY
            );

        if(raw){

            const value =
                JSON.parse(raw);

            if(Array.isArray(value)){

                parsed =
                    value;

            }

        }

    }
    catch(error){

        parsed = [];

    }

    return parsed
        .filter(function(item){

            return (
                item &&
                typeof item === "object"
            );

        })
        .map(function(item){

            const quantity =
                Number(item.quantity);

            return {
                ...item,
                quantity:
                    Number.isInteger(quantity) &&
                    quantity >= 1 &&
                    quantity <= MAX_QUANTITY
                        ? quantity
                        : 1
            };

        });

}


function saveOrder(order){

    try{

        localStorage.setItem(
            ORDER_KEY,
            JSON.stringify(order)
        );

        return true;

    }
    catch(error){

        alert(
            "Your selection could not be saved on this device. Please try again."
        );

        return false;

    }

}


function getBookKey(book){

    if(book.id){

        return "id:" +
            String(book.id);

    }

    if(book.sku){

        return "sku:" +
            String(book.sku);

    }

    if(book.isbn){

        return "isbn:" +
            String(book.isbn);

    }

    return [
        "book",
        book.title || "",
        book.series || "",
        book.class || "",
        book.subject || "",
        book.medium || ""
    ].join(":");

}


function getItemKey(item){

    if(item.id){

        return "id:" +
            String(item.id);

    }

    if(item.sku){

        return "sku:" +
            String(item.sku);

    }

    if(item.isbn){

        return "isbn:" +
            String(item.isbn);

    }

    return [
        "book",
        item.title || "",
        item.series || "",
        item.class || "",
        item.subject || "",
        item.medium || ""
    ].join(":");

}


function getSelectedTitleCount(){

    return getStoredOrder()
        .filter(function(item){

            return (
                item.type !==
                "custom-kit"
            );

        })
        .length;

}


function updateSelectionBar(){

    const bar =
        document.getElementById(
            "selectionBar"
        );

    const status =
        document.getElementById(
            "selectionStatus"
        );

    if(
        !bar ||
        !status
    ){
        return;
    }

    const count =
        getSelectedTitleCount();

    bar.hidden =
        count === 0;

    status.innerHTML =
        "<strong>" +
        count +
        "</strong> " +
        (
            count === 1
                ? "title selected"
                : "titles selected"
        );

}


function isBookSelected(book){

    const key =
        getBookKey(book);

    return getStoredOrder()
        .some(function(item){

            return (
                getItemKey(item) ===
                key
            );

        });

}


function addBookToSelection(book){

    if(
        isBookSelected(book)
    ){
        return true;
    }

    const order =
        getStoredOrder();

    order.push({

        id:
            book.id || "",

        sku:
            book.sku || "",

        isbn:
            book.isbn || "",

        title:
            book.title ||
            "Untitled Book",

        series:
            book.series || "",

        class:
            book.class || "",

        subject:
            book.subject || "",

        medium:
            book.medium || "",

        mrp:
            Number.isFinite(
                book.mrp
            )
                ? book.mrp
                : null,

        cover:
            book.cover || "",

        quantity:1

    });

    return saveOrder(
        order
    );

}


function removeBookFromSelection(book){

    const key =
        getBookKey(book);

    const order =
        getStoredOrder();

    const index =
        order.findIndex(
            function(item){

                return (
                    item.type !==
                        "custom-kit" &&
                    getItemKey(item) ===
                        key
                );

            }
        );

    if(index === -1){
        return true;
    }

    order.splice(
        index,
        1
    );

    return saveOrder(
        order
    );

}


function refreshCatalogue(){

    renderBooks();
    updateSelectionBar();

}


function showMessage(
    heading,
    text
){

    const container =
        document.getElementById(
            "messageContainer"
        );

    container.innerHTML =
        "";

    const box =
        document.createElement(
            "div"
        );

    box.className =
        "message-state";

    const title =
        document.createElement(
            "h2"
        );

    title.textContent =
        heading;

    const paragraph =
        document.createElement(
            "p"
        );

    paragraph.textContent =
        text;

    const link =
        document.createElement(
            "a"
        );

    link.href =
        "school-education.html";

    link.textContent =
        "Choose a class →";

    box.appendChild(
        title
    );

    box.appendChild(
        paragraph
    );

    box.appendChild(
        link
    );

    container.appendChild(
        box
    );

    document.getElementById(
        "catalogueContent"
    ).hidden =
        true;

    document.getElementById(
        "catalogueControls"
    ).hidden =
        true;

    document.getElementById(
        "selectionBar"
    ).hidden =
        true;

}


function getSubjectPosition(subject){

    const index =
        SUBJECT_ORDER.indexOf(
            subject
        );

    if(index === -1){

        return Number.MAX_SAFE_INTEGER;

    }

    return index;

}


function populateSubjects(){

    const select =
        document.getElementById(
            "subjectFilter"
        );

    const subjects =
        Array.from(
            new Set(
                classBooks
                    .map(
                        function(book){

                            return book.subject;

                        }
                    )
                    .filter(Boolean)
            )
        );

    subjects.sort(
        function(a,b){

            const positionA =
                getSubjectPosition(a);

            const positionB =
                getSubjectPosition(b);

            if(
                positionA !==
                positionB
            ){

                return (
                    positionA -
                    positionB
                );

            }

            return a.localeCompare(b);

        }
    );

    select.innerHTML =
        '<option value="">All Subjects</option>';

    subjects.forEach(
        function(subject){

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                subject;

            option.textContent =
                subject;

            select.appendChild(
                option
            );

        }
    );

}


function getFilteredBooks(){

    const search =
        document
            .getElementById(
                "bookSearch"
            )
            .value
            .trim()
            .toLowerCase();

    const subject =
        document
            .getElementById(
                "subjectFilter"
            )
            .value;

    return classBooks.filter(
        function(book){

            if(
                subject &&
                book.subject !==
                    subject
            ){

                return false;

            }

            if(!search){

                return true;

            }

            const haystack = [

                book.title,
                book.series,
                book.subject,
                book.displaySubject,
                book.medium,
                book.sku,
                book.isbn

            ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();

            return haystack.includes(
                search
            );

        }
    );

}


function groupBooksBySeries(books){

    const groups =
        new Map();

    books.forEach(
        function(book){

            const series =
                book.series ||
                "Other Publications";

            if(
                !groups.has(
                    series
                )
            ){

                groups.set(
                    series,
                    []
                );

            }

            groups
                .get(series)
                .push(book);

        }
    );

    return Array.from(
        groups.entries()
    )
    .sort(
        function(a,b){

            const subjectA =
                a[1][0] &&
                a[1][0].subject
                    ? a[1][0].subject
                    : "";

            const subjectB =
                b[1][0] &&
                b[1][0].subject
                    ? b[1][0].subject
                    : "";

            const positionA =
                getSubjectPosition(
                    subjectA
                );

            const positionB =
                getSubjectPosition(
                    subjectB
                );

            if(
                positionA !==
                positionB
            ){

                return (
                    positionA -
                    positionB
                );

            }

            return a[0]
                .localeCompare(
                    b[0]
                );

        }
    );

}


function getDisplaySections(books){

    const sections =
        [];

    const usedSubjects =
        new Set();

    SUBJECT_GROUPS.forEach(
        function(group){

            const groupBooks =
                books.filter(
                    function(book){

                        return group
                            .subjects
                            .includes(
                                book.subject
                            );

                    }
                );

            if(
                groupBooks.length ===
                0
            ){
                return;
            }

            group.subjects.forEach(
                function(subject){

                    usedSubjects.add(
                        subject
                    );

                }
            );

            sections.push({

                name:
                    group.name,

                books:
                    groupBooks

            });

        }
    );

    const remainingSubjects =
        Array.from(
            new Set(
                books
                    .map(
                        function(book){

                            return book.subject;

                        }
                    )
                    .filter(
                        function(subject){

                            return (
                                subject &&
                                !usedSubjects.has(
                                    subject
                                )
                            );

                        }
                    )
            )
        )
        .sort(
            function(a,b){

                return a.localeCompare(b);

            }
        );

    remainingSubjects.forEach(
        function(subject){

            sections.push({

                name:
                    subject,

                books:
                    books.filter(
                        function(book){

                            return (
                                book.subject ===
                                subject
                            );

                        }
                    )

            });

        }
    );

    return sections;

}


function createBookRow(book){

    const row =
        document.createElement(
            "article"
        );

    row.className =
        "catalogue-book";

    const cover =
        document.createElement(
            "div"
        );

    cover.className =
        "cover-placeholder";

    cover.textContent =
        "BOOK COVER";

    const details =
        document.createElement(
            "div"
        );

    details.className =
        "book-details";

    const heading =
        document.createElement(
            "h5"
        );

    heading.textContent =
        book.title ||
        "Untitled Book";

    const meta =
        document.createElement(
            "div"
        );

    meta.className =
        "book-meta";

    [
        book.subject,
        book.medium,

        book.sku
            ? "SKU: " +
                book.sku
            : "",

        book.isbn
            ? "ISBN: " +
                book.isbn
            : "",

        Number.isFinite(
            book.mrp
        )
            ? "MRP ₹" +
                book.mrp
            : ""

    ]
    .filter(Boolean)
    .forEach(function(value){

        const span =
            document.createElement(
                "span"
            );

        span.textContent =
            value;

        meta.appendChild(
            span
        );

    });

    details.appendChild(
        heading
    );

    details.appendChild(
        meta
    );

    const button =
        document.createElement(
            "button"
        );

    button.type =
        "button";

    button.className =
        "book-action";

    if(
        isBookSelected(book)
    ){

        button.textContent =
            "✓ Selected";

        button.classList.add(
            "is-selected"
        );

        button.addEventListener(
            "click",
            function(){

                if(
                    removeBookFromSelection(
                        book
                    )
                ){

                    refreshCatalogue();

                }

            }
        );

    }
    else{

        button.textContent =
            "Add to Selection";

        button.addEventListener(
            "click",
            function(){

                if(
                    addBookToSelection(
                        book
                    )
                ){

                    refreshCatalogue();

                }

            }
        );

    }

    row.appendChild(
        cover
    );

    row.appendChild(
        details
    );

    row.appendChild(
        button
    );

    return row;

}


function createSeriesGroup(
    series,
    books
){

    const group =
        document.createElement(
            "section"
        );

    group.className =
        "series-group";

    const header =
        document.createElement(
            "div"
        );

    header.className =
        "series-header";

    const headingBox =
        document.createElement(
            "div"
        );

    headingBox.className =
        "series-heading";

    const label =
        document.createElement(
            "p"
        );

    label.className =
        "series-label";

    label.textContent =
        books[0] &&
        books[0].subject
            ? books[0].subject
            : "PUBLICATION";

    const heading =
        document.createElement(
            "h4"
        );

    heading.textContent =
        series;

    const seriesCount =
        document.createElement(
            "div"
        );

    seriesCount.className =
        "series-count";

    seriesCount.textContent =
        books.length +
        (
            books.length === 1
                ? " title"
                : " titles"
        );

    headingBox.appendChild(
        label
    );

    headingBox.appendChild(
        heading
    );

    header.appendChild(
        headingBox
    );

    header.appendChild(
        seriesCount
    );

    const bookList =
        document.createElement(
            "div"
        );

    bookList.className =
        "book-list";

    books.forEach(
        function(book){

            bookList.appendChild(
                createBookRow(
                    book
                )
            );

        }
    );

    group.appendChild(
        header
    );

    group.appendChild(
        bookList
    );

    return group;

}


function renderBooks(){

    const books =
        getFilteredBooks();

    const container =
        document.getElementById(
            "subjectList"
        );

    container.innerHTML =
        "";

    const count =
        document.getElementById(
            "resultsCount"
        );

    count.textContent =
        books.length +
        (
            books.length === 1
                ? " book"
                : " books"
        );

    if(
        books.length ===
        0
    ){

        const box =
            document.createElement(
                "div"
            );

        box.className =
            "message-state";

        const heading =
            document.createElement(
                "h2"
            );

        heading.textContent =
            "No matching books";

        const paragraph =
            document.createElement(
                "p"
            );

        paragraph.textContent =
            "Try a different search term or subject filter.";

        box.appendChild(
            heading
        );

        box.appendChild(
            paragraph
        );

        container.appendChild(
            box
        );

        return;

    }

    const sections =
        getDisplaySections(
            books
        );

    sections.forEach(
        function(section){

            const subjectSection =
                document.createElement(
                    "section"
                );

            subjectSection.className =
                "subject-section";

            const subjectHeading =
                document.createElement(
                    "div"
                );

            subjectHeading.className =
                "subject-heading";

            const heading =
                document.createElement(
                    "h3"
                );

            heading.textContent =
                section.name;

            const subjectCount =
                document.createElement(
                    "span"
                );

            subjectCount.textContent =
                section.books.length +
                (
                    section.books.length === 1
                        ? " book"
                        : " books"
                );

            subjectHeading.appendChild(
                heading
            );

            subjectHeading.appendChild(
                subjectCount
            );

            subjectSection.appendChild(
                subjectHeading
            );

            const seriesGroups =
                groupBooksBySeries(
                    section.books
                );

            seriesGroups.forEach(
                function(entry){

                    subjectSection
                        .appendChild(
                            createSeriesGroup(
                                entry[0],
                                entry[1]
                            )
                        );

                }
            );

            container.appendChild(
                subjectSection
            );

        }
    );

}


function initialise(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    const classValue =
        params.get(
            "class"
        );

    if(
        !isValidClass(
            classValue
        )
    ){

        showMessage(
            "Choose a class",
            "Select Class 1–10 before browsing School Books."
        );

        return;

    }

    selectedClass =
        Number(
            classValue
        );

    const catalogue =
        getCatalogue();

    classBooks =
        catalogue.filter(
            function(book){

                return (
                    Number(book.class) ===
                        selectedClass &&
                    book.category ===
                        "school"
                );

            }
        );

    document.title =
        "Class " +
        selectedClass +
        " School Books | Cambridge Digital Catalogue";

    document.getElementById(
        "pageHeading"
    ).textContent =
        "Class " +
        selectedClass +
        " School Books";

    document.getElementById(
        "pageDescription"
    ).textContent =
        "Browse Cambridge school publications available for Class " +
        selectedClass +
        ".";

    document.getElementById(
        "backLink"
    ).href =
        "school-education.html?class=" +
        selectedClass;

    if(
        classBooks.length ===
        0
    ){

        showMessage(
            "No School Books added yet",
            "The catalogue currently has no verified School Book records mapped to Class " +
            selectedClass +
            "."
        );

        return;

    }

    document.getElementById(
        "catalogueControls"
    ).hidden =
        false;

    document.getElementById(
        "catalogueContent"
    ).hidden =
        false;

    populateSubjects();

    renderBooks();

    updateSelectionBar();

    document
        .getElementById(
            "bookSearch"
        )
        .addEventListener(
            "input",
            renderBooks
        );

    document
        .getElementById(
            "subjectFilter"
        )
        .addEventListener(
            "change",
            renderBooks
        );

    window.addEventListener(
        "storage",
        function(event){

            if(
                event.key ===
                ORDER_KEY
            ){

                updateSelectionBar();

            }

        }
    );

}


document.addEventListener(
    "DOMContentLoaded",
    initialise
);

</script>
