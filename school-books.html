<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>School Books | Cambridge Digital Catalogue</title><link rel="stylesheet" href="css/catalogue.css"><link rel="stylesheet" href="css/publication-browser.css"><style>.page-hero{padding:46px 6% 34px;background:#fff}.hero-inner{max-width:1180px;margin:auto}.page-hero h1{margin:0;font-size:clamp(32px,5vw,48px);letter-spacing:-1.3px}.hero-description{max-width:680px;margin:10px 0 0;color:var(--muted);font-size:13px;line-height:1.6}.controls{margin-top:26px;display:flex;gap:10px;flex-wrap:wrap}.controls input,.controls select{box-sizing:border-box;padding:12px 13px;border:1px solid var(--border);border-radius:8px;background:#fff;font:inherit;font-size:12px}.controls input{flex:1 1 280px}.selection-bar{display:none!important}.results-summary{margin-bottom:18px;display:flex;justify-content:space-between;align-items:end;gap:16px}.results-summary h2{margin:0;font-size:25px}.results-count{margin:0;color:var(--muted);font-size:11px}.group-section+.group-section{margin-top:30px}.group-title{padding:0 2px 8px;display:flex;justify-content:space-between;align-items:end;gap:14px;border-bottom:2px solid var(--navy);margin-bottom:14px}.group-title h3{margin:0;font-size:20px}.group-title span{color:var(--muted);font-size:10px}.book-cover{overflow:hidden;display:flex;align-items:center;justify-content:center;background:#eef1f5;color:#8b95a5;font-size:8px;font-weight:750;text-align:center}.book-info{min-width:0}.book-meta{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--muted);font-size:10px}.book-actions{display:grid;gap:9px}.view-book,.add-book{box-sizing:border-box;cursor:pointer}.qty-control{display:grid;grid-template-columns:36px minmax(52px,1fr) 36px;border:1px solid #d9dee6;border-radius:7px;overflow:hidden}.qty-control button,.qty-control input{height:36px;border:0;background:#fff;color:var(--navy);font:inherit;font-weight:750;text-align:center}.qty-control button{cursor:pointer;font-size:16px}.qty-control input{width:100%;box-sizing:border-box;border-left:1px solid #e4e7ec;border-right:1px solid #e4e7ec;font-size:11px}.qty-error{min-height:14px;margin-top:4px;color:#a33b3b;font-size:9px;font-weight:650}.message{padding:40px 22px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;text-align:center;color:var(--muted);font-size:12px}@media(max-width:720px){.page-hero{padding:36px 18px 28px}.results-summary{align-items:flex-start;flex-direction:column}}</style></head><body><header class="catalogue-header"><div class="brand"><div class="brand-name">CAMBRIDGE</div><div class="brand-company">PUBLISHING COMPANY PVT. LTD.</div></div><div class="catalogue-year">DIGITAL CATALOGUE · 2026–27</div></header><section class="page-hero"><div class="hero-inner"><nav class="context-nav" aria-label="Catalogue navigation"><a href="index.html">⌂ Home</a><span class="nav-divider" aria-hidden="true"></span><a id="backLink" href="school-education.html">← Back</a></nav><p class="eyebrow">SCHOOL BOOKS</p><h1 id="pageHeading">School Books</h1><p class="hero-description">Browse Cambridge school publications.</p><div class="controls" id="controls" hidden><input id="search" type="search" placeholder="Search books, series or subjects..."><select id="subject"><option value="">All Subjects</option></select></div></div></section><main><section class="catalogue-section"><div class="results-summary" id="summary" hidden><h2>Publications</h2><p class="results-count" id="resultsCount"></p></div><div id="list"></div></section></main><footer><div><strong>Cambridge Publishing Company Pvt. Ltd.</strong><p>Bengaluru, Karnataka</p></div><p class="footer-note">Digital Catalogue · 2026–27</p></footer><script src="js/catalogue-data.js?v=20260816-3"></script><script src="js/catalogue-query.js?v=20260816-3"></script><script src="js/catalogue-selection.js?v=20260816-5"></script><script>const Selection=window.CambridgeSelection,Query=window.CambridgeCatalogueQuery;if(!Selection||!Query)throw new Error("Catalogue modules failed to load.");const SUBJECT_ORDER=["Semester Books","English","English Grammar","English Writing","Kannada","Kannada Writing","Hindi","Hindi Writing","Mathematics","Environmental Studies","Science","Social Science","Computer Science","General Knowledge","Moral Science","Drawing","Art & Craft"];let classBooks=[];const pos=v=>{const i=SUBJECT_ORDER.indexOf(v);return i<0?999:i};function card(b){const r=document.createElement("article");r.className="publication-card";r.appendChild(Selection.coverNode(b));const body=document.createElement("div");body.className="publication-card-body";const i=document.createElement("div");i.className="book-info";const h=document.createElement("h4");h.textContent=b.title||"Untitled Book";const m=document.createElement("div");m.className="book-meta";[b.series,b.medium?b.medium+" Medium":"",b.sku?"SKU: "+b.sku:"",b.isbn?"ISBN: "+b.isbn:"",Number.isFinite(b.mrp)?"MRP ₹"+b.mrp:""].filter(Boolean).forEach(v=>{const s=document.createElement("span");s.textContent=v;m.appendChild(s)});i.append(h,m);body.append(i,Selection.actionNode(b));r.append(body);return r}function filtered(){const q=search.value.trim().toLowerCase(),s=subject.value;return classBooks.filter(b=>(!s||b.subject===s)&&(!q||[b.title,b.series,b.subject,b.medium,b.sku,b.isbn].filter(Boolean).join(" ").toLowerCase().includes(q)))}function render(){const a=filtered();list.innerHTML="";resultsCount.textContent=a.length+(a.length===1?" book":" books");if(!a.length){list.innerHTML='<div class="message">No matching books. Try another search or subject.</div>';return}[...new Set(a.map(b=>b.subject||"Other"))].sort((x,y)=>pos(x)-pos(y)||x.localeCompare(y)).forEach(g=>{const sec=document.createElement("section");sec.className="group-section";const subset=a.filter(b=>(b.subject||"Other")===g);sec.innerHTML='<div class="group-title"><h3></h3><span></span></div>';sec.querySelector("h3").textContent=g;sec.querySelector("span").textContent=subset.length+(subset.length===1?" book":" books");const l=document.createElement("div");l.className="publication-grid";subset.forEach(b=>l.appendChild(card(b)));sec.appendChild(l);list.appendChild(sec)})}function refresh(){render();Selection.updateBar()}function init(){const c=new URLSearchParams(location.search).get("class"),normalized=Query.normalizeClass(c);if(!/^(?:[1-9]|10)$/.test(normalized)){list.innerHTML='<div class="message">Choose a class from School Learning to browse books.</div>';return}window.SELECTION_EXTRA={};pageHeading.textContent="Class "+normalized+" School Books";backLink.href="school-learning.html?class="+encodeURIComponent(normalized);backLink.textContent="← Class "+normalized;classBooks=Query.byCategoryAndClass("school",normalized);controls.hidden=false;summary.hidden=false;Query.uniqueValues(classBooks,"subject").sort((a,b)=>pos(a)-pos(b)||a.localeCompare(b)).forEach(v=>subject.add(new Option(v,v)));search.oninput=render;subject.onchange=render;refresh()}window.addEventListener(Selection.CHANGE_EVENT,refresh);document.addEventListener("DOMContentLoaded",init);</script></body></html>
