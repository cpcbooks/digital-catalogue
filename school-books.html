<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>School Books | Cambridge Digital Catalogue</title><link rel="stylesheet" href="css/catalogue.css">
<style>
.page-hero{padding:46px 6% 34px;background:#fff}.hero-inner{max-width:1180px;margin:auto}.back-link{display:inline-block;margin-bottom:18px;color:var(--navy);text-decoration:none;font-size:12px;font-weight:700}.page-hero h1{margin:0;font-size:clamp(32px,5vw,48px);letter-spacing:-1.3px}.hero-description{max-width:680px;margin:10px 0 0;color:var(--muted);font-size:13px;line-height:1.6}.controls{margin-top:26px;display:flex;gap:10px;flex-wrap:wrap}.controls input,.controls select{box-sizing:border-box;padding:12px 13px;border:1px solid var(--border);border-radius:8px;background:#fff;font:inherit;font-size:12px}.controls input{flex:1 1 280px}.selection-bar{margin-top:13px;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--border);border-radius:8px;background:#fafbfc}.selection-bar[hidden]{display:none}.selection-status{margin:0;color:var(--muted);font-size:11px}.view-selection{padding:9px 12px;border-radius:6px;background:var(--navy);color:#fff;text-decoration:none;font-size:10px;font-weight:750}.results-summary{margin-bottom:18px;display:flex;justify-content:space-between;align-items:end;gap:16px}.results-summary h2{margin:0;font-size:25px}.results-count{margin:0;color:var(--muted);font-size:11px}.group-section+.group-section{margin-top:30px}.group-title{padding:0 2px 8px;display:flex;justify-content:space-between;align-items:end;gap:14px;border-bottom:2px solid var(--navy)}.group-title h3{margin:0;font-size:20px}.group-title span{color:var(--muted);font-size:10px}.book-list{overflow:hidden;border:1px solid var(--border);border-radius:var(--radius);background:#fff}.book-card{padding:20px 22px;display:grid;grid-template-columns:104px minmax(0,1fr) 160px;gap:22px;align-items:center;border-bottom:1px solid var(--border)}.book-card:last-child{border-bottom:0}.book-cover{width:104px;aspect-ratio:2/3;overflow:hidden;display:flex;align-items:center;justify-content:center;border-radius:7px;background:#eef1f5;color:#8b95a5;font-size:8px;font-weight:750;text-align:center}.book-cover img{width:100%;height:100%;object-fit:cover}.book-info{min-width:0}.book-info h4{margin:0 0 7px;font-size:15px;line-height:1.35}.book-meta{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--muted);font-size:10px}.book-actions{display:grid;gap:9px}.view-book,.add-book{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:7px;font-size:10px;font-weight:750;text-align:center;text-decoration:none;cursor:pointer}.view-book{border:1px solid var(--navy);background:var(--navy);color:#fff}.add-book{border:1px solid var(--navy);background:#fff;color:var(--navy)}.qty-control{display:grid;grid-template-columns:36px minmax(52px,1fr) 36px;border:1px solid #d9dee6;border-radius:7px;overflow:hidden}.qty-control button,.qty-control input{height:36px;border:0;background:#fff;color:var(--navy);font:inherit;font-weight:750;text-align:center}.qty-control button{cursor:pointer;font-size:16px}.qty-control input{width:100%;box-sizing:border-box;border-left:1px solid #e4e7ec;border-right:1px solid #e4e7ec;font-size:11px;-moz-appearance:textfield}.qty-control input::-webkit-outer-spin-button,.qty-control input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.message{padding:40px 22px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;text-align:center;color:var(--muted);font-size:12px}.subgroup{margin-top:12px}.subgroup-label{padding:13px 18px;background:#fafbfc;border:1px solid var(--border);border-bottom:0;border-radius:var(--radius) var(--radius) 0 0;font-size:13px;font-weight:750}.subgroup .book-list{border-radius:0 0 var(--radius) var(--radius)}
@media(max-width:720px){.page-hero{padding:36px 18px 28px}.selection-bar,.results-summary{align-items:flex-start;flex-direction:column}.book-card{padding:18px;grid-template-columns:86px minmax(0,1fr);gap:16px;align-items:start}.book-cover{width:86px}.book-actions{grid-column:2;width:100%;max-width:190px}.view-book,.add-book{padding:10px}.group-title{align-items:start}}
</style>
</head><body>
<header class="catalogue-header"><div class="brand"><div class="brand-name">CAMBRIDGE</div><div class="brand-company">PUBLISHING COMPANY PVT. LTD.</div></div><div class="catalogue-year">DIGITAL CATALOGUE · 2026–27</div></header>
<section class="page-hero"><div class="hero-inner"><a class="back-link" id="backLink" href="school-education.html">← Back</a><p class="eyebrow">SCHOOL BOOKS</p><h1 id="pageHeading">School Books</h1><p class="hero-description" id="pageDescription">Browse Cambridge school publications.</p><div class="controls" id="controls" hidden><input id="search" type="search" placeholder="Search books, series or subjects..." aria-label="Search books"><select id="subject"><option value="">All Subjects</option></select></div><div class="selection-bar" id="selectionBar" hidden><p class="selection-status" id="selectionStatus"></p><a class="view-selection" href="order.html">My Selection →</a></div></div></section>
<main><section class="catalogue-section"><div class="results-summary" id="summary" hidden><h2>Publications</h2><p class="results-count" id="resultsCount"></p></div><div id="list"></div></section></main>
<footer><div><strong>Cambridge Publishing Company Pvt. Ltd.</strong><p>Bengaluru, Karnataka</p></div><p class="footer-note">Digital Catalogue · 2026–27</p></footer>
<script src="js/catalogue-data.js"></script><script>
const ORDER_KEY="cambridgeOrder",MAX_QUANTITY=10000;
function catalogue(){return Array.isArray(window.CAMBRIDGE_CATALOGUE)?window.CAMBRIDGE_CATALOGUE.filter(b=>b&&typeof b==="object"&&b.active!==false):[]}
function order(){let a=[];try{const v=JSON.parse(localStorage.getItem(ORDER_KEY)||"[]");if(Array.isArray(v))a=v}catch(e){}return a.filter(x=>x&&typeof x==="object").map(x=>({...x,quantity:validQty(x.quantity)?Number(x.quantity):1}))}
function validQty(v){const n=Number(v);return Number.isInteger(n)&&n>=1&&n<=MAX_QUANTITY}
function save(a){try{localStorage.setItem(ORDER_KEY,JSON.stringify(a));return true}catch(e){alert("Your selection could not be saved on this device. Please try again.");return false}}
function key(x){if(x.id)return"id:"+x.id;if(x.sku)return"sku:"+x.sku;if(x.isbn)return"isbn:"+x.isbn;return["book",x.title||"",x.series||"",x.class||"",x.level||"",x.subject||"",x.medium||""].join(":")}
function indexOfBook(book,a=order()){const k=key(book);return a.findIndex(x=>x.type!=="custom-kit"&&key(x)===k)}
function selectedItem(book){const a=order(),i=indexOfBook(book,a);return i<0?null:a[i]}
function selectedCount(){return order().filter(x=>x.type!=="custom-kit").length}
function updateBar(){const bar=document.getElementById("selectionBar"),s=document.getElementById("selectionStatus");if(!bar||!s)return;const n=selectedCount();bar.hidden=n===0;s.innerHTML="<strong>"+n+"</strong> "+(n===1?"title selected":"titles selected")}
function add(book,extra={}){const a=order();if(indexOfBook(book,a)>=0)return true;a.push({id:book.id||"",sku:book.sku||"",isbn:book.isbn||"",title:book.title||"Untitled Book",series:book.series||"",family:book.family||"",class:book.class||"",level:extra.level||book.level||"",levelName:extra.levelName||"",subject:book.subject||"",type:book.type||"",medium:book.medium||"",mrp:Number.isFinite(book.mrp)?book.mrp:null,cover:book.cover||"",quantity:1});return save(a)}
function setQty(book,value){let n=Number(value);if(!Number.isFinite(n))return false;n=Math.trunc(n);if(n<1)return remove(book);if(n>MAX_QUANTITY)n=MAX_QUANTITY;const a=order(),i=indexOfBook(book,a);if(i<0){if(!add(book,window.SELECTION_EXTRA||{}))return false;return setQty(book,n)}a[i].quantity=n;return save(a)}
function remove(book){const a=order(),i=indexOfBook(book,a);if(i<0)return true;a.splice(i,1);return save(a)}
function detailsUrl(book){return "book-details.html?id="+encodeURIComponent(book.id||"")}
function coverNode(book){const d=document.createElement("div");d.className="book-cover";if(book.cover){const img=document.createElement("img");img.src=book.cover;img.alt=(book.title||"Book")+" cover";img.loading="lazy";img.onerror=()=>{d.innerHTML="";d.textContent="BOOK COVER"};d.appendChild(img)}else d.textContent="BOOK COVER";return d}
function actionNode(book){const wrap=document.createElement("div");wrap.className="book-actions";const view=document.createElement("a");view.className="view-book";view.href=detailsUrl(book);view.textContent="View Book →";wrap.appendChild(view);const item=selectedItem(book);if(!item){const b=document.createElement("button");b.type="button";b.className="add-book";b.textContent="+ Add to Selection";b.onclick=()=>{if(add(book,window.SELECTION_EXTRA||{}))refresh()};wrap.appendChild(b);return wrap}const q=document.createElement("div");q.className="qty-control";const minus=document.createElement("button");minus.type="button";minus.setAttribute("aria-label","Decrease quantity");minus.textContent="−";const input=document.createElement("input");input.type="number";input.min="1";input.max=String(MAX_QUANTITY);input.inputMode="numeric";input.value=String(item.quantity);input.setAttribute("aria-label","Quantity");const plus=document.createElement("button");plus.type="button";plus.setAttribute("aria-label","Increase quantity");plus.textContent="+";minus.onclick=()=>{if(item.quantity<=1){if(remove(book))refresh()}else if(setQty(book,item.quantity-1))refresh()};plus.onclick=()=>{if(setQty(book,Math.min(MAX_QUANTITY,item.quantity+1)))refresh()};input.onchange=()=>{let n=Number(input.value);if(!Number.isInteger(n)||n<1)n=1;if(n>MAX_QUANTITY)n=MAX_QUANTITY;if(setQty(book,n))refresh()};q.append(minus,input,plus);wrap.appendChild(q);return wrap}
window.addEventListener("storage",e=>{if(e.key===ORDER_KEY&&typeof refresh==="function")refresh()});

const SUBJECT_ORDER=["Semester Books","English","English Grammar","English Writing","Kannada","Kannada Writing","Hindi","Hindi Writing","Mathematics","Environmental Studies","Science","Social Science","Computer Science","General Knowledge","Moral Science","Drawing","Art & Craft"];
let selectedClass=null,classBooks=[];
function pos(v){const i=SUBJECT_ORDER.indexOf(v);return i<0?999:i}
function createCard(book){const row=document.createElement("article");row.className="book-card";row.appendChild(coverNode(book));const info=document.createElement("div");info.className="book-info";const h=document.createElement("h4");h.textContent=book.title||"Untitled Book";const m=document.createElement("div");m.className="book-meta";[book.series,book.medium?book.medium+" Medium":"",book.sku?"SKU: "+book.sku:"",book.isbn?"ISBN: "+book.isbn:"",Number.isFinite(book.mrp)?"MRP ₹"+book.mrp:""].filter(Boolean).forEach(v=>{const s=document.createElement("span");s.textContent=v;m.appendChild(s)});info.append(h,m);row.append(info,actionNode(book));return row}
function filtered(){const q=document.getElementById("search").value.trim().toLowerCase(),s=document.getElementById("subject").value;return classBooks.filter(b=>(!s||b.subject===s)&&(!q||[b.title,b.series,b.subject,b.medium,b.sku,b.isbn].filter(Boolean).join(" ").toLowerCase().includes(q)))}
function render(){const books=filtered(),root=document.getElementById("list");root.innerHTML="";document.getElementById("resultsCount").textContent=books.length+(books.length===1?" book":" books");if(!books.length){root.innerHTML='<div class="message">No matching books. Try another search or subject.</div>';return}const groups=[...new Set(books.map(b=>b.subject||"Other"))].sort((a,b)=>pos(a)-pos(b)||a.localeCompare(b));groups.forEach(g=>{const sec=document.createElement("section");sec.className="group-section";const subset=books.filter(b=>(b.subject||"Other")===g);sec.innerHTML='<div class="group-title"><h3></h3><span></span></div>';sec.querySelector("h3").textContent=g;sec.querySelector("span").textContent=subset.length+(subset.length===1?" book":" books");const list=document.createElement("div");list.className="book-list";subset.forEach(b=>list.appendChild(createCard(b)));sec.appendChild(list);root.appendChild(sec)})}
function refresh(){render();updateBar()}
function init(){const c=Number(new URLSearchParams(location.search).get("class"));if(!Number.isInteger(c)||c<1||c>10){document.getElementById("list").innerHTML='<div class="message">Choose a class from School Education to browse books.</div>';return}selectedClass=c;window.SELECTION_EXTRA={};document.getElementById("pageHeading").textContent="Class "+c+" School Books";document.getElementById("backLink").href="school-education.html?class="+c;classBooks=catalogue().filter(b=>b.category==="school"&&Number(b.class)===c);document.getElementById("controls").hidden=false;document.getElementById("summary").hidden=false;const sel=document.getElementById("subject");[...new Set(classBooks.map(b=>b.subject).filter(Boolean))].sort((a,b)=>pos(a)-pos(b)||a.localeCompare(b)).forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;sel.appendChild(o)});document.getElementById("search").oninput=render;sel.onchange=render;refresh()}
document.addEventListener("DOMContentLoaded",init);
</script></body></html>
