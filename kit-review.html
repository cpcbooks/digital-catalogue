<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Review Custom Kit | Cambridge Digital Catalogue</title><link rel="stylesheet" href="css/catalogue.css"><style>.review-hero{padding:45px 6% 30px;background:#fff}.review-wrap,.review-content{max-width:900px;margin:auto}.review-hero h1{margin:0;font-size:clamp(34px,5vw,50px);letter-spacing:-1.5px}.review-intro{margin:10px 0 0;color:var(--muted);font-size:13px;line-height:1.5}.review-content{padding:30px 6% 60px}.review-card{padding:24px;background:#fff;border:1px solid var(--border);border-radius:12px}.review-card h2{margin:0 0 8px;font-size:20px}.review-status{margin:0;color:var(--muted);font-size:12px;line-height:1.55}.title-list{margin:20px 0;padding-left:22px}.title-list li{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:9px 0;color:#555f6b;font-size:13px}.remove-title{border:0;background:transparent;color:#8b3b3b;cursor:pointer;font:inherit;font-size:11px;font-weight:700}.kit-name-display{margin:0 0 14px;color:var(--muted);font-size:12px}.review-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.edit-button,.complete-button{padding:13px 18px;border-radius:8px;font-size:12px;font-weight:750;text-decoration:none;cursor:pointer}.edit-button{border:1px solid var(--border);background:#fff;color:var(--navy)}.complete-button{border:0;background:var(--navy);color:#fff}.empty-review{text-align:center}.empty-review p{margin-bottom:20px}@media(max-width:600px){.review-hero{padding:35px 18px 25px}.review-content{padding:25px 18px 45px}.review-card{padding:18px}.review-actions{display:grid;grid-template-columns:1fr}.edit-button,.complete-button{text-align:center}}</style></head>
<body><header class="catalogue-header"><div class="brand"><div class="brand-name">CAMBRIDGE</div><div class="brand-company">PUBLISHING COMPANY PVT. LTD.</div></div><div class="catalogue-year">DIGITAL CATALOGUE · 2026–27</div></header><section class="review-hero"><div class="review-wrap"><nav class="context-nav" aria-label="Catalogue navigation"><a href="index.html">⌂ Home</a><span class="nav-divider" aria-hidden="true"></span><a id="editNav" href="kit-builder.html">← Edit Kit</a></nav><p class="eyebrow">CUSTOM KIT</p><h1 id="pageTitle">Review Your Kit</h1><p class="review-intro">Review the titles in your working Kit. This does not send a requirement or place an order.</p></div></section><main class="review-content" id="review"></main>
<script src="js/catalogue-data.js?v=20260816-4"></script><script src="js/catalogue-query.js?v=20260816-4"></script><script src="js/catalogue-pilot-config.js"></script><script src="js/catalogue-supabase-adapter.js"></script><script src="js/catalogue-bootstrap.js"></script><script src="js/catalogue-source-links.js"></script><script src="js/custom-kit-state.js?v=20261005-1"></script><script src="js/early-learning-kit-config.js?v=20261005-1"></script><script>(async function(){"use strict";const Bootstrap=window.CambridgeCatalogueBootstrap;if(!Bootstrap)throw new Error("Catalogue source bootstrap failed to load.");try{await Bootstrap.ready()}catch(e){document.getElementById("review").innerHTML="<div class=\"review-card empty-review\"><h2>Catalogue unavailable</h2><p>The Supabase pilot catalogue could not be loaded. Please try again.</p></div>";return}const DRAFT_KEY="cambridgeCustomKitDraft",ORDER_KEY="cambridgeOrder",Query=window.CambridgeCatalogueQuery,KitState=window.CambridgeCustomKitState,KitConfig=window.CambridgeEarlyLearningKitConfig,review=document.getElementById("review"),params=new URLSearchParams(location.search);let level=(params.get("level")||"").toLowerCase(),draft=null;try{draft=JSON.parse(sessionStorage.getItem(DRAFT_KEY)||"null")}catch(e){}if(!draft||draft.level!==level||(draft.source||"static")!==Bootstrap.requestedSource||!KitConfig.getStageConfig(level)){review.innerHTML='<div class="review-card empty-review"><h2>No working Kit to review</h2><p>Choose titles in the Kit builder, then return here to review them.</p><a class="edit-button" href="early-learning.html">Browse Early Learning</a></div>';return}const config=KitConfig.getStageConfig(level),state=KitState.create({minimum:config.minimumDistinctTitles,completionEnabled:config.completionEnabled,isEligible:book=>KitConfig.isEligible(book,config.displayName)}),editUrl=Bootstrap.withSource("kit-builder.html?level="+encodeURIComponent(level));state.setName(draft.name);document.getElementById("editNav").href=editUrl;document.getElementById("pageTitle").textContent="Review Your "+config.displayName+" Kit";Query.byCategoryAndClass("early-learning",config.displayName).forEach(book=>{if(Array.isArray(draft.bookIds)&&draft.bookIds.map(String).includes(String(book.id)))state.add(book)});function saveDraft(){sessionStorage.setItem(DRAFT_KEY,JSON.stringify({level,source:Bootstrap.requestedSource,name:state.getName(),bookIds:state.selectedIds()}))}function render(){review.replaceChildren();if(!state.canReview()){const empty=document.createElement("div"),heading=document.createElement("h2"),text=document.createElement("p"),edit=document.createElement("a");empty.className="review-card empty-review";heading.textContent="No titles available to review";text.textContent="Your working Kit no longer contains eligible titles.";edit.className="edit-button";edit.href=editUrl;edit.textContent="Edit Kit";empty.append(heading,text,edit);review.appendChild(empty);return}const card=document.createElement("section"),heading=document.createElement("h2"),status=document.createElement("p"),list=document.createElement("ol"),actions=document.createElement("div"),edit=document.createElement("a");card.className="review-card";heading.textContent=state.count()+(state.count()===1?" selected title":" selected titles");if(state.getName()){const name=document.createElement("p");name.className="kit-name-display";name.textContent=state.getName();card.appendChild(name)}status.className="review-status";status.textContent=state.isComplete()?"This Kit meets the configured minimum and can be added to My Selection.":config.completionEnabled?"This is a working Kit. Select "+state.remaining()+" more "+(state.remaining()===1?"title":"titles")+" to complete it.":"This is a working Kit. Completion is not configured for this stage.";list.className="title-list";state.selectedItems().forEach(book=>{const item=document.createElement("li"),title=document.createElement("span"),remove=document.createElement("button");title.textContent=book.title||"Untitled Book";remove.type="button";remove.className="remove-title";remove.textContent="Remove";remove.addEventListener("click",()=>{state.remove(book);saveDraft();render()});item.append(title,remove);list.appendChild(item)});actions.className="review-actions";edit.className="edit-button";edit.href=editUrl;edit.textContent="← Return to Edit";actions.appendChild(edit);if(state.isComplete()){const complete=document.createElement("button");complete.type="button";complete.className="complete-button";complete.textContent="Add Complete Kit to My Selection →";complete.onclick=()=>{let order=[];try{const stored=JSON.parse(localStorage.getItem(ORDER_KEY)||"[]");if(Array.isArray(stored))order=stored}catch(e){}const selected=state.selectedItems(),name=state.getName(),kit={id:"KIT-"+Date.now(),type:"custom-kit",title:name||config.displayName+" Custom Kit",kitName:name||"",class:[config.displayName],level,levelName:config.displayName,quantity:1,books:selected,bookCount:selected.length};try{localStorage.setItem(ORDER_KEY,JSON.stringify(order.concat(kit)));sessionStorage.removeItem(DRAFT_KEY);location.href=Bootstrap.withSource("order.html")}catch(e){alert("Your selection could not be saved on this device. Please try again.")}};actions.appendChild(complete)}card.append(heading,status,list,actions);review.appendChild(card)}render()})();</script></body></html>
