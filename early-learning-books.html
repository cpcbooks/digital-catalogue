<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Early Learning Books | Cambridge Digital Catalogue</title><link rel="stylesheet" href="css/catalogue.css"><style>.page-hero{padding:46px 6% 34px;background:#fff}.hero-inner{max-width:1180px;margin:auto}.back-link{display:inline-block;margin-bottom:18px;color:var(--navy);text-decoration:none;font-size:12px;font-weight:700}.page-hero h1{margin:0;font-size:clamp(32px,5vw,48px);letter-spacing:-1.3px}.hero-description{max-width:680px;margin:10px 0 0;color:var(--muted);font-size:13px;line-height:1.6}.controls{margin-top:26px;display:flex;gap:10px;flex-wrap:wrap}.controls input,.controls select{box-sizing:border-box;padding:12px 13px;border:1px solid var(--border);border-radius:8px;background:#fff;font:inherit;font-size:12px}.controls input{flex:1 1 280px}.results-summary{margin-bottom:18px;display:flex;justify-content:space-between;align-items:end;gap:16px}.results-summary h2{margin:0;font-size:25px}.results-count{margin:0;color:var(--muted);font-size:11px}.group-section+.group-section{margin-top:30px}.group-title{padding:0 2px 8px;display:flex;justify-content:space-between;align-items:end;gap:14px;border-bottom:2px solid var(--navy)}.group-title h3{margin:0;font-size:20px}.group-title span{color:var(--muted);font-size:10px}.book-list{overflow:hidden;border:1px solid var(--border);border-radius:var(--radius);background:#fff}.book-card{padding:20px 22px;display:grid;grid-template-columns:104px minmax(0,1fr) 160px;gap:22px;align-items:center;border-bottom:1px solid var(--border)}.book-card:last-child{border-bottom:0}.book-cover{width:104px;aspect-ratio:2/3;overflow:hidden;display:flex;align-items:center;justify-content:center;border-radius:7px;background:#eef1f5;color:#8b95a5;font-size:8px;font-weight:750;text-align:center}.book-cover img{width:100%;height:100%;object-fit:cover}.book-info{min-width:0}.book-info h4{margin:0 0 7px;font-size:15px;line-height:1.35}.book-meta{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--muted);font-size:10px}.book-actions{display:grid;gap:9px}.view-book,.add-book{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:7px;font-size:10px;font-weight:750;text-align:center;text-decoration:none;cursor:pointer}.view-book{border:1px solid var(--navy);background:var(--navy);color:#fff}.add-book{border:1px solid var(--navy);background:#fff;color:var(--navy)}.qty-control{display:grid;grid-template-columns:36px minmax(52px,1fr) 36px;border:1px solid #d9dee6;border-radius:7px;overflow:hidden}.qty-control button,.qty-control input{height:36px;border:0;background:#fff;color:var(--navy);font:inherit;font-weight:750;text-align:center}.qty-control button{cursor:pointer;font-size:16px}.qty-control input{width:100%;box-sizing:border-box;border-left:1px solid #e4e7ec;border-right:1px solid #e4e7ec;font-size:11px}.message{padding:40px 22px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;text-align:center;color:var(--muted);font-size:12px}@media(max-width:720px){.page-hero{padding:36px 18px 28px}.results-summary{align-items:flex-start;flex-direction:column}.book-card{padding:18px;grid-template-columns:86px minmax(0,1fr);gap:16px;align-items:start}.book-cover{width:86px}.book-actions{grid-column:2;width:100%;max-width:190px}}</style></head><body><header class="catalogue-header"><div class="brand"><div class="brand-name">CAMBRIDGE</div><div class="brand-company">PUBLISHING COMPANY PVT. LTD.</div></div><div class="catalogue-year">DIGITAL CATALOGUE · 2026–27</div></header><section class="page-hero"><div class="hero-inner"><a class="back-link" id="backLink" href="early-learning.html">← Back</a><p class="eyebrow">INDIVIDUAL BOOKS</p><h1 id="pageHeading">Early Learning Books</h1><p class="hero-description">Browse individual Cambridge Early Learning titles.</p><div class="controls" id="controls" hidden><input id="search" type="search" placeholder="Search books, subjects or types..."><select id="subject"><option value="">All Subjects</option></select></div></div></section><main><section class="catalogue-section"><div class="results-summary" id="summary" hidden><h2>Publications</h2><p class="results-count" id="resultsCount"></p></div><div id="list"></div></section></main><footer><div><strong>Cambridge Publishing Company Pvt. Ltd.</strong><p>Bengaluru, Karnataka</p></div><p class="footer-note">Digital Catalogue · 2026–27</p></footer><script src="js/catalogue-data.js"></script><script src="js/catalogue-query.js?v=20260816-1"></script><script src="js/catalogue-selection.js?v=20260816-4"></script><script>const Selection=window.CambridgeSelection,Query=window.CambridgeCatalogueQuery;if(!Selection||!Query)throw new Error("Catalogue modules failed to load.");const LEVELS={nursery:"Nursery",lkg:"LKG",ukg:"UKG"},CODES={nursery:"NUR",lkg:"LKG",ukg:"UKG"},ORDER=["English","Mathematics","Kannada","Hindi","Creative Learning"];let books=[];const pos=v=>{const i=ORDER.indexOf(v);return i<0?999:i};function card(b){const r=document.createElement("article");r.className="book-card";r.appendChild(Selection.coverNode(b));const i=document.createElement("div");i.className="book-info";const h=document.createElement("h4");h.textContent=b.title||"Untitled Book";const m=document.createElement("div");m.className="book-meta";[b.type,b.series,b.sku?"SKU: "+b.sku:"",b.isbn?"ISBN: "+b.isbn:"",Number.isFinite(b.mrp)?"MRP ₹"+b.mrp:""].filter(Boolean).forEach(v=>{const s=document.createElement("span");s.textContent=v;m.appendChild(s)});i.append(h,m);r.append(i,Selection.actionNode(b));return r}function filtered(){const q=search.value.trim().toLowerCase(),s=subject.value;return books.filter(b=>(!s||b.subject===s)&&(!q||[b.title,b.series,b.subject,b.type,b.sku,b.isbn].filter(Boolean).join(" ").toLowerCase().includes(q)))}function render(){const a=filtered();list.innerHTML="";resultsCount.textContent=a.length+(a.length===1?" book":" books");if(!a.length){list.innerHTML='<div class="message">No matching books.</div>';return}Query.uniqueValues(a,"subject").sort((x,y)=>pos(x)-pos(y)||x.localeCompare(y)).forEach(s=>{const sec=document.createElement("section");sec.className="group-section";const sa=a.filter(b=>(b.subject||"Other")===s);sec.innerHTML='<div class="group-title"><h3>'+s+'</h3><span>'+sa.length+(sa.length===1?" book":" books")+'</span></div>';const l=document.createElement("div");l.className="book-list";sa.forEach(b=>l.appendChild(card(b)));sec.appendChild(l);list.appendChild(sec)})}function refresh(){render();Selection.updateBar()}function init(){const level=new URLSearchParams(location.search).get("level");if(!LEVELS[level]){list.innerHTML='<div class="message">Choose Nursery, LKG or UKG from Early Learning.</div>';return}window.SELECTION_EXTRA={level,levelName:LEVELS[level]};pageHeading.textContent=LEVELS[level]+" Individual Books";backLink.href="early-learning.html?level="+encodeURIComponent(level);books=Query.byCategoryAndClass("early-learning",CODES[level]);controls.hidden=false;summary.hidden=false;Query.uniqueValues(books,"subject").sort((a,b)=>pos(a)-pos(b)||a.localeCompare(b)).forEach(v=>subject.add(new Option(v,v)));search.oninput=render;subject.onchange=render;refresh()}window.addEventListener(Selection.CHANGE_EVENT,refresh);document.addEventListener("DOMContentLoaded",init);</script></body></html>
