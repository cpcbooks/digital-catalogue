<section class="page-hero"><div class="hero-inner"><a class="back-link" id="backLink" href="early-learning.html">← Back</a><p class="eyebrow">INDIVIDUAL BOOKS</p><h1 id="pageHeading">Early Learning Books</h1><p class="hero-description" id="pageDescription">Browse individual Cambridge Early Learning titles.</p><div class="controls" id="controls" hidden><input id="search" type="search" placeholder="Search books, subjects or types..." aria-label="Search Early Learning books"><select id="subject"><option value="">All Subjects</option></select></div><div class="selection-bar" id="selectionBar" hidden><p class="selection-status" id="selectionStatus"></p><a class="view-selection" href="order.html">My Selection →</a></div></div></section>

<script src="js/catalogue-data.js"></script><script src="js/catalogue-selection.js?v=20260816-2"></script><script>
const Selection=window.CambridgeSelection;
if(!Selection){throw new Error("Cambridge selection module failed to load.");}

const LEVELS={nursery:"Nursery",lkg:"LKG",ukg:"UKG"},SUBJECT_ORDER=["English","Mathematics","Kannada","Hindi","Creative Learning"];
let level=null,books=[];
function pos(v){const i=SUBJECT_ORDER.indexOf(v);return i<0?999:i}
function createCard(book){const row=document.createElement("article");row.className="book-card";row.appendChild(Selection.coverNode(book));const info=document.createElement("div");info.className="book-info";const h=document.createElement("h4");h.textContent=book.title||"Untitled Book";const m=document.createElement("div");m.className="book-meta";[book.type,book.series,book.sku?"SKU: "+book.sku:"",book.isbn?"ISBN: "+book.isbn:"",Number.isFinite(book.mrp)?"MRP ₹"+book.mrp:""].filter(Boolean).forEach(v=>{const s=document.createElement("span");s.textContent=v;m.appendChild(s)});info.append(h,m);row.append(info,Selection.actionNode(book));return row}
function filtered(){const q=document.getElementById("search").value.trim().toLowerCase(),s=document.getElementById("subject").value;return books.filter(b=>(!s||b.subject===s)&&(!q||[b.title,b.series,b.subject,b.type,b.sku,b.isbn].filter(Boolean).join(" ").toLowerCase().includes(q)))}
function render(){const a=filtered(),root=document.getElementById("list");root.innerHTML="";document.getElementById("resultsCount").textContent=a.length+(a.length===1?" book":" books");if(!a.length){root.innerHTML='<div class="message">No matching books.</div>';return}[...new Set(a.map(b=>b.subject||"Other"))].sort((x,y)=>pos(x)-pos(y)||x.localeCompare(y)).forEach(s=>{const sec=document.createElement("section");sec.className="group-section";const sa=a.filter(b=>(b.subject||"Other")===s);sec.innerHTML='<div class="group-title"><h3></h3><span></span></div>';sec.querySelector("h3").textContent=s;sec.querySelector("span").textContent=sa.length+(sa.length===1?" book":" books");const list=document.createElement("div");list.className="book-list";sa.forEach(b=>list.appendChild(createCard(b)));sec.appendChild(list);root.appendChild(sec)})}
function refresh(){render();Selection.updateBar()}
function init(){level=new URLSearchParams(location.search).get("level");if(!LEVELS[level]){document.getElementById("list").innerHTML='<div class="message">Choose Nursery, LKG or UKG from Early Learning.</div>';return}window.SELECTION_EXTRA={level:level,levelName:LEVELS[level]};document.getElementById("pageHeading").textContent=LEVELS[level]+" Individual Books";document.getElementById("backLink").href="early-learning.html?level="+encodeURIComponent(level);books=catalogue().filter(b=>b.category==="early-learning"&&(!Array.isArray(b.levels)||b.levels.length===0||b.levels.includes(level)));document.getElementById("controls").hidden=false;document.getElementById("summary").hidden=false;const sel=document.getElementById("subject");[...new Set(books.map(b=>b.subject).filter(Boolean))].sort((a,b)=>pos(a)-pos(b)||a.localeCompare(b)).forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;sel.appendChild(o)});document.getElementById("search").oninput=render;sel.onchange=render;refresh()}
window.addEventListener(Selection.CHANGE_EVENT,refresh);
document.addEventListener("DOMContentLoaded",init);
</script></body></html>
