<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Early Learning | Cambridge Digital Catalogue</title><link rel="stylesheet" href="css/catalogue.css"><link rel="stylesheet" href="css/selection-pane.css"><style>.page-hero{padding:44px 6% 32px;background:#fff}.page-wrap{max-width:1180px;margin:auto}.back-link{display:inline-block;margin-bottom:22px;color:var(--navy);text-decoration:none;font-size:12px;font-weight:700}.page-hero h1{margin:0;font-size:clamp(34px,5vw,50px);letter-spacing:-1.3px}.intro{margin:11px 0 0;color:var(--muted);font-size:13px}.level-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:23px}.level-tabs a{padding:8px 13px;border:1px solid var(--border);border-radius:999px;background:#fff;color:#5d6876;text-decoration:none;font-size:10px;font-weight:700}.level-tabs a.active{background:var(--navy);border-color:var(--navy);color:#fff}.content{max-width:1180px;margin:auto;padding:34px 6% 90px}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.choice-card{min-height:290px;padding:28px;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius);background:#fff}.choice-label{margin-bottom:28px;color:var(--navy);font-size:10px;font-weight:800;letter-spacing:1.3px}.choice-card h2{margin:0 0 10px;font-size:22px}.choice-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}.choice-card a,.choice-card button{margin-top:auto;padding:12px 16px;border:0;border-radius:7px;background:var(--navy);color:#fff;text-decoration:none;text-align:center;font:inherit;font-size:12px;font-weight:700;cursor:pointer}.custom-kit{background:var(--navy);color:#fff}.custom-kit .choice-label,.custom-kit p{color:rgba(255,255,255,.72)}.custom-kit a{background:#fff;color:var(--navy)}.kit-rule{margin-top:14px;font-size:11px;font-weight:700}@media(max-width:700px){.page-hero{padding:34px 18px 27px}.level-tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:5px;scrollbar-width:none}.level-tabs::-webkit-scrollbar{display:none}.level-tabs a{flex:0 0 auto}.content{padding:26px 18px 80px}.choice-grid{grid-template-columns:1fr}.choice-card{min-height:220px}}</style></head><body><header class="catalogue-header"><div class="brand"><div class="brand-name">CAMBRIDGE</div><div class="brand-company">PUBLISHING COMPANY PVT. LTD.</div></div><div class="catalogue-year">DIGITAL CATALOGUE · 2026–27</div></header><main><section class="page-hero"><div class="page-wrap"><a class="back-link" href="early-learning.html">← Early Learning</a><p class="eyebrow">EARLY LEARNING</p><h1 id="title">Early Learning Publications</h1><p class="intro" id="intro"></p><div class="level-tabs" id="tabs"></div></div></section><section class="content"><div class="choice-grid" id="grid"></div></section></main><footer><div><strong>Cambridge Publishing Company Pvt. Ltd.</strong><p>Bengaluru, Karnataka</p></div><p class="footer-note">Digital Catalogue · 2026–27</p></footer><script src="js/catalogue-selection.js?v=20260816-5"></script><script>const levels={playgroup:{name:"Playgroup",minimum:null},nursery:{name:"Nursery",minimum:8},lkg:{name:"LKG",minimum:8},ukg:{name:"UKG",minimum:8}};const params=new URLSearchParams(location.search);let level=params.get("level")||"nursery";if(!levels[level])level="nursery";const data=levels[level];document.getElementById("title").textContent=data.name+" Publications";document.getElementById("intro").textContent="Browse Cambridge publications available for "+data.name+".";const tabs=document.getElementById("tabs");Object.entries(levels).forEach(([key,v])=>{const a=document.createElement("a");a.href="?level="+key;a.textContent=v.name;if(key===level)a.className="active";tabs.appendChild(a)});const grid=document.getElementById("grid");const standard=document.createElement("article");standard.className="choice-card";standard.innerHTML='<div class="choice-label">READY-MADE</div><h2>Cambridge Standard Kit</h2><p>A carefully selected combination of Cambridge books for this level.</p><button type="button" id="standardButton">View Standard Kit →</button>';grid.appendChild(standard);document.getElementById("standardButton").onclick=()=>alert("We will build this experience in the next stage.");const custom=document.createElement("article");custom.className="choice-card custom-kit";custom.innerHTML='<div class="choice-label">PERSONALISE</div><h2>Build Your Own Kit</h2><p>Choose books from our range and create a combination that suits your requirement.</p><div class="kit-rule">'+(data.minimum?"Minimum "+data.minimum+" books required to create a kit":"Kit options will be configured for this level")+'</div>'+(level==="playgroup"?'<button type="button" id="kitUnavailable">Build My Kit →</button>':'<a href="kit-builder.html?level='+encodeURIComponent(level)+'">Build My Kit →</a>');grid.appendChild(custom);if(level==="playgroup")document.getElementById("kitUnavailable").onclick=()=>alert("Playgroup kit options will be added once the range is finalised.");const individual=document.createElement("article");individual.className="choice-card";individual.innerHTML='<div class="choice-label">EXPLORE</div><h2>Individual Books</h2><p>Browse the complete range and select individual books according to your requirement.</p>'+(level==="playgroup"?'<button type="button" id="booksUnavailable">Browse Books →</button>':'<a href="early-learning-books.html?level='+encodeURIComponent(level)+'">Browse Books →</a>');grid.appendChild(individual);if(level==="playgroup")document.getElementById("booksUnavailable").onclick=()=>alert("Playgroup individual books will be added once the range is finalised.");</script></body></html>
