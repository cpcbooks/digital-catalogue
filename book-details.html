<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Book Details | Cambridge Digital Catalogue</title><link rel="stylesheet" href="css/catalogue.css">
<style>
.page-hero{padding:46px 6% 34px;background:#fff}.hero-inner{max-width:1180px;margin:auto}.back-link{display:inline-block;margin-bottom:18px;color:var(--navy);text-decoration:none;font-size:12px;font-weight:700}.page-hero h1{margin:0;font-size:clamp(32px,5vw,48px);letter-spacing:-1.3px}.hero-description{max-width:680px;margin:10px 0 0;color:var(--muted);font-size:13px;line-height:1.6}.controls{margin-top:26px;display:flex;gap:10px;flex-wrap:wrap}.controls input,.controls select{box-sizing:border-box;padding:12px 13px;border:1px solid var(--border);border-radius:8px;background:#fff;font:inherit;font-size:12px}.controls input{flex:1 1 280px}.selection-bar{margin-top:13px;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--border);border-radius:8px;background:#fafbfc}.selection-bar[hidden]{display:none}.selection-status{margin:0;color:var(--muted);font-size:11px}.view-selection{padding:9px 12px;border-radius:6px;background:var(--navy);color:#fff;text-decoration:none;font-size:10px;font-weight:750}.results-summary{margin-bottom:18px;display:flex;justify-content:space-between;align-items:end;gap:16px}.results-summary h2{margin:0;font-size:25px}.results-count{margin:0;color:var(--muted);font-size:11px}.group-section+.group-section{margin-top:30px}.group-title{padding:0 2px 8px;display:flex;justify-content:space-between;align-items:end;gap:14px;border-bottom:2px solid var(--navy)}.group-title h3{margin:0;font-size:20px}.group-title span{color:var(--muted);font-size:10px}.book-list{overflow:hidden;border:1px solid var(--border);border-radius:var(--radius);background:#fff}.book-card{padding:20px 22px;display:grid;grid-template-columns:104px minmax(0,1fr) 160px;gap:22px;align-items:center;border-bottom:1px solid var(--border)}.book-card:last-child{border-bottom:0}.book-cover{width:104px;aspect-ratio:2/3;overflow:hidden;display:flex;align-items:center;justify-content:center;border-radius:7px;background:#eef1f5;color:#8b95a5;font-size:8px;font-weight:750;text-align:center}.book-cover img{width:100%;height:100%;object-fit:cover}.book-info{min-width:0}.book-info h4{margin:0 0 7px;font-size:15px;line-height:1.35}.book-meta{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--muted);font-size:10px}.book-actions{display:grid;gap:9px}.view-book,.add-book{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:7px;font-size:10px;font-weight:750;text-align:center;text-decoration:none;cursor:pointer}.view-book{border:1px solid var(--navy);background:var(--navy);color:#fff}.add-book{border:1px solid var(--navy);background:#fff;color:var(--navy)}.qty-control{display:grid;grid-template-columns:36px minmax(52px,1fr) 36px;border:1px solid #d9dee6;border-radius:7px;overflow:hidden}.qty-control button,.qty-control input{height:36px;border:0;background:#fff;color:var(--navy);font:inherit;font-weight:750;text-align:center}.qty-control button{cursor:pointer;font-size:16px}.qty-control input{width:100%;box-sizing:border-box;border-left:1px solid #e4e7ec;border-right:1px solid #e4e7ec;font-size:11px;-moz-appearance:textfield}.qty-control input::-webkit-outer-spin-button,.qty-control input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.qty-error{min-height:14px;margin-top:4px;color:#a33b3b;font-size:9px;font-weight:650;line-height:1.35}.qty-control.invalid{border-color:#b84646;background:#fff8f8}.message{padding:40px 22px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;text-align:center;color:var(--muted);font-size:12px}.subgroup{margin-top:12px}.subgroup-label{padding:13px 18px;background:#fafbfc;border:1px solid var(--border);border-bottom:0;border-radius:var(--radius) var(--radius) 0 0;font-size:13px;font-weight:750}.subgroup .book-list{border-radius:0 0 var(--radius) var(--radius)}
@media(max-width:720px){.page-hero{padding:36px 18px 28px}.selection-bar,.results-summary{align-items:flex-start;flex-direction:column}.book-card{padding:18px;grid-template-columns:86px minmax(0,1fr);gap:16px;align-items:start}.book-cover{width:86px}.book-actions{grid-column:2;width:100%;max-width:190px}.view-book,.add-book{padding:10px}.group-title{align-items:start}}
</style>

<style>.detail-wrap{max-width:1050px;margin:auto;display:grid;grid-template-columns:minmax(260px,380px) minmax(0,1fr);gap:52px;align-items:start}.gallery{position:relative}.gallery-frame{width:100%;aspect-ratio:2/3;overflow:hidden;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#eef1f5;color:#8b95a5;font-size:11px;font-weight:750;text-align:center}.gallery-frame img{width:100%;height:100%;object-fit:contain;background:#fff}.gallery-nav{margin-top:12px;display:flex;justify-content:center;align-items:center;gap:10px}.gallery-nav button{width:38px;height:34px;border:1px solid var(--border);border-radius:7px;background:#fff;cursor:pointer}.gallery-count{min-width:55px;text-align:center;color:var(--muted);font-size:10px}.detail-info h1{margin:0 0 10px;font-size:clamp(30px,5vw,46px);line-height:1.08}.detail-tags{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 24px}.detail-tags span{padding:6px 9px;border-radius:999px;background:#f1f3f6;color:var(--muted);font-size:10px}.detail-block{padding:18px 0;border-top:1px solid var(--border)}.detail-block h2{margin:0 0 8px;font-size:15px}.detail-block p{margin:0;color:var(--muted);font-size:12px;line-height:1.7}.detail-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.meta-item small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.7px}.meta-item strong{display:block;margin-top:3px;font-size:12px}.detail-action{max-width:220px;margin-top:22px}.detail-action .add-book{height:40px}@media(max-width:760px){.detail-wrap{grid-template-columns:1fr;gap:28px}.gallery{max-width:330px;margin:auto;width:100%}.detail-meta{grid-template-columns:1fr 1fr}}</style></head><body>
<header class="catalogue-header"><div class="brand"><div class="brand-name">CAMBRIDGE</div><div class="brand-company">PUBLISHING COMPANY PVT. LTD.</div></div><div class="catalogue-year">DIGITAL CATALOGUE · 2026–27</div></header>
<main><section class="catalogue-section"><a id="back" class="back-link" href="index.html">← Back to catalogue</a><div id="detail"></div></section></main>
<footer><div><strong>Cambridge Publishing Company Pvt. Ltd.</strong><p>Bengaluru, Karnataka</p></div><p class="footer-note">Digital Catalogue · 2026–27</p></footer>
<script src="js/catalogue-data.js"></script><script>
const ORDER_KEY="cambridgeOrder",MAX_QUANTITY=10000;
function catalogue(){return Array.isArray(window.CAMBRIDGE_CATALOGUE)?window.CAMBRIDGE_CATALOGUE.filter(b=>b&&typeof b==="object"&&b.active!==false):[]}
function order(){let a=[];try{const v=JSON.parse(localStorage.getItem(ORDER_KEY)||"[]");if(Array.isArray(v))a=v}catch(e){}return a.filter(x=>x&&typeof x==="object").map(x=>({...x,quantity:validQty(x.quantity)?Number(x.quantity):1}))}
function validQty(v){const n=Number(v);return Number.isInteger(n)&&n>=1&&n<=MAX_QUANTITY}
function save(a){try{localStorage.setItem(ORDER_KEY,JSON.stringify(a));return true}catch(e){alert("Your selection could not be saved on this device. Please try again.");return false}}
function key(x){if(x.id)return"id:"+x.id;if(x.sku)return"sku:"+x.sku;if(x.isbn)return"isbn:"+x.isbn;return["book",x.title||"",x.series||"",x.class||"",x.level||"",x.subject||"",x.medium||""].join(":")}
function indexOfBook(book,a=order()){const k=key(book);return a.findIndex(x=>x.type!=="custom-kit"&&key(x)===k)}
function selectedItem(book){const a=order(),i=indexOfBook(book,a);return i<0?null:a[i]}
function selectedCount(){return order().filter(x=>x.type!=="custom-kit").length}
function updateBar(){const bar=document.getElementById("selectionBar"),s=document.getElementById("selectionStatus");if(!bar||!s)return;const n=selectedCount();bar.hidden=n===0;s.innerHTML="<strong>"+n+"</strong> "+(n===1?"title selected":"titles selected")}
function add(book,extra={}){const a=order();if(indexOfBook(book,a)>=0)return true;a.push({id:book.id||"",sku:book.sku||"",isbn:book.isbn||"",title:book.title||"Untitled Book",series:book.series||"",family:book.family||"",class:book.class||"",level:extra.level||book.level||"",levelName:extra.levelName||"",subject:book.subject||"",type:book.type||"",medium:book.medium||"",mrp:Number.isFinite(book.mrp)?book.mrp:null,cover:book.cover||"",quantity:1});return save(a)}
function setQty(book,value){let n=Number(value);if(!Number.isFinite(n))return false;n=Math.trunc(n);if(n<1)return remove(book);if(n>MAX_QUANTITY)n=MAX_QUANTITY;const a=order(),i=indexOfBook(book,a);if(i<0){if(!add(book,window.SELECTION_EXTRA||{}))return false;return setQty(book,n)}a[i].quantity=n;return save(a)}
function remove(book){const a=order(),i=indexOfBook(book,a);if(i<0)return true;a.splice(i,1);return save(a)}
function detailsUrl(book){return "book-details.html?id="+encodeURIComponent(book.id||"")}
function coverNode(book){const d=document.createElement("div");d.className="book-cover";if(book.cover){const img=document.createElement("img");img.src=book.cover;img.alt=(book.title||"Book")+" cover";img.loading="lazy";img.onerror=()=>{d.innerHTML="";d.textContent="BOOK COVER"};d.appendChild(img)}else d.textContent="BOOK COVER";return d}
function actionNode(book){const wrap=document.createElement("div");wrap.className="book-actions";const view=document.createElement("a");view.className="view-book";view.href=detailsUrl(book);view.textContent="View Book →";wrap.appendChild(view);const item=selectedItem(book);if(!item){const b=document.createElement("button");b.type="button";b.className="add-book";b.textContent="+ Add to Selection";b.onclick=()=>{if(add(book,window.SELECTION_EXTRA||{}))refresh()};wrap.appendChild(b);return wrap}const q=document.createElement("div");q.className="qty-control";const minus=document.createElement("button");minus.type="button";minus.setAttribute("aria-label","Decrease quantity");minus.textContent="−";const input=document.createElement("input");input.type="text";input.inputMode="numeric";input.pattern="[0-9]*";input.autocomplete="off";input.enterKeyHint="done";input.maxLength=5;input.value=String(item.quantity);input.setAttribute("aria-label","Quantity");const plus=document.createElement("button");plus.type="button";plus.setAttribute("aria-label","Increase quantity");plus.textContent="+";const error=document.createElement("div");error.className="qty-error";error.setAttribute("aria-live","polite");const clearError=()=>{q.classList.remove("invalid");error.textContent=""};const showError=message=>{q.classList.add("invalid");error.textContent=message};minus.onclick=()=>{clearError();const current=selectedItem(book);if(!current){refresh();return}const qty=Number(current.quantity);if(qty<=1){if(remove(book))refresh()}else if(setQty(book,qty-1))refresh()};plus.onclick=()=>{clearError();const current=selectedItem(book);if(!current){if(add(book,window.SELECTION_EXTRA||{}))refresh();return}const qty=Number(current.quantity);if(qty>=MAX_QUANTITY){showError("Maximum quantity is 10,000.");return}if(setQty(book,qty+1))refresh()};input.oninput=()=>{let digits=input.value.replace(/\D/g,"");input.value=digits;if(digits===""){showError("Enter a quantity from 1 to 10,000.");return}const n=Number(digits);if(digits.length>5||!Number.isSafeInteger(n)||n>MAX_QUANTITY){input.value=String(selectedItem(book)?.quantity||item.quantity);showError("Maximum quantity is 10,000.");return}if(n===0){clearError();return}if(n<0){showError("Enter a quantity from 0 to 10,000.");return}clearError();setQty(book,n)};input.onblur=()=>{const digits=input.value.replace(/\D/g,"");if(digits===""){input.value=String(selectedItem(book)?.quantity||item.quantity);showError("Enter a quantity from 0 to 10,000.");return}const n=Number(digits);if(!Number.isSafeInteger(n)||n>MAX_QUANTITY){input.value=String(selectedItem(book)?.quantity||item.quantity);showError(n>MAX_QUANTITY?"Maximum quantity is 10,000.":"Enter a quantity from 0 to 10,000.");return}if(n===0){if(remove(book))refresh();return}if(n<0){input.value=String(selectedItem(book)?.quantity||item.quantity);showError("Enter a quantity from 0 to 10,000.");return}input.value=String(n);clearError()};input.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();input.blur()}};q.append(minus,input,plus);wrap.append(q,error);return wrap}
window.addEventListener("storage",e=>{if(e.key===ORDER_KEY&&typeof refresh==="function")refresh()});

let current=null,images=[],imageIndex=0;
function detailLevel(book){const requested=new URLSearchParams(location.search).get("level");if(["nursery","lkg","ukg"].includes(requested))return requested;if(Array.isArray(book.levels)&&book.levels.length===1&&["nursery","lkg","ukg"].includes(book.levels[0]))return book.levels[0];return ""}
function sourceBack(book){if(book.category==="exam")return "exam-preparation.html?class="+book.class;if(book.category==="school")return "school-books.html?class="+book.class;if(book.category==="early-learning"){const l=detailLevel(book);return l?"early-learning-books.html?level="+encodeURIComponent(l):"early-learning.html"}return "index.html"}
function imageList(book){const a=[];if(book.cover)a.push(book.cover);if(book.images&&typeof book.images==="object"){if(book.images.front&&!a.includes(book.images.front))a.push(book.images.front);if(book.images.back)a.push(book.images.back);if(Array.isArray(book.images.samples))book.images.samples.forEach(x=>{if(x)a.push(x)})}return a}
function gallery(){const frame=document.getElementById("frame"),count=document.getElementById("galleryCount");frame.innerHTML="";if(!images.length)frame.textContent="BOOK COVER";else{const img=document.createElement("img");img.src=images[imageIndex];img.alt=(current.title||"Book")+" image "+(imageIndex+1);img.onerror=()=>{frame.innerHTML="";frame.textContent="IMAGE UNAVAILABLE"};frame.appendChild(img)}count.textContent=images.length?(imageIndex+1)+" / "+images.length:"0 / 0";document.getElementById("prev").disabled=images.length<2;document.getElementById("next").disabled=images.length<2}
function setupSwipe(){const frame=document.getElementById("frame");let startX=null,startY=null;frame.addEventListener("touchstart",e=>{if(e.touches.length!==1)return;startX=e.touches[0].clientX;startY=e.touches[0].clientY},{passive:true});frame.addEventListener("touchend",e=>{if(startX===null||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;startX=startY=null;if(images.length<2||Math.abs(dx)<45||Math.abs(dx)<=Math.abs(dy))return;imageIndex=dx<0?(imageIndex+1)%images.length:(imageIndex-1+images.length)%images.length;gallery()},{passive:true})}
function refresh(){const a=document.getElementById("detailAction");if(a){a.innerHTML="";a.appendChild(actionNode(current));const v=a.querySelector(".view-book");if(v)v.remove()}updateBar()}
function init(){const id=new URLSearchParams(location.search).get("id");current=catalogue().find(b=>String(b.id)===String(id));const root=document.getElementById("detail");if(!current){root.innerHTML='<div class="message">This book could not be found in the current catalogue.</div>';return}document.title=(current.title||"Book")+" | Cambridge Digital Catalogue";document.getElementById("back").href=sourceBack(current);if(current.category==="early-learning"){const l=detailLevel(current);const names={nursery:"Nursery",lkg:"LKG",ukg:"UKG"};window.SELECTION_EXTRA=l?{level:l,levelName:names[l]}:{}}else window.SELECTION_EXTRA={};images=imageList(current);const tags=[current.series,current.family,current.class?"Class "+current.class:"",current.subject,current.medium?current.medium+" Medium":"",current.type].filter(Boolean);const meta=[["SKU",current.sku],["ISBN",current.isbn],["MRP",Number.isFinite(current.mrp)?"₹"+current.mrp:""]].filter(x=>x[1]);root.innerHTML='<div class="detail-wrap"><div class="gallery"><div class="gallery-frame" id="frame"></div><div class="gallery-nav"><button id="prev" type="button" aria-label="Previous image">←</button><span class="gallery-count" id="galleryCount"></span><button id="next" type="button" aria-label="Next image">→</button></div></div><div class="detail-info"><p class="eyebrow">BOOK DETAILS</p><h1></h1><div class="detail-tags"></div><div id="description"></div><div id="meta"></div><div class="detail-action" id="detailAction"></div></div></div>';root.querySelector("h1").textContent=current.title||"Untitled Book";const t=root.querySelector(".detail-tags");tags.forEach(x=>{const s=document.createElement("span");s.textContent=x;t.appendChild(s)});if(current.description){const b=document.createElement("div");b.className="detail-block";b.innerHTML="<h2>About this book</h2><p></p>";b.querySelector("p").textContent=current.description;document.getElementById("description").appendChild(b)}if(meta.length){const b=document.createElement("div");b.className="detail-block";const h=document.createElement("h2");h.textContent="Book information";const grid=document.createElement("div");grid.className="detail-meta";meta.forEach(([k,v])=>{const d=document.createElement("div");d.className="meta-item";const sm=document.createElement("small");sm.textContent=k;const st=document.createElement("strong");st.textContent=v;d.append(sm,st);grid.appendChild(d)});b.append(h,grid);document.getElementById("meta").appendChild(b)}document.getElementById("prev").onclick=()=>{if(images.length){imageIndex=(imageIndex-1+images.length)%images.length;gallery()}};document.getElementById("next").onclick=()=>{if(images.length){imageIndex=(imageIndex+1)%images.length;gallery()}};gallery();setupSwipe();refresh()}
document.addEventListener("DOMContentLoaded",init);
</script></body></html>
