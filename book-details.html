<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Book Details | Cambridge Digital Catalogue</title><link rel="stylesheet" href="css/catalogue.css"><style>
.back-link{display:inline-block;margin-bottom:18px;color:var(--navy);text-decoration:none;font-size:12px;font-weight:700}.detail-wrap{max-width:1080px;margin:auto;display:grid;grid-template-columns:minmax(260px,390px) minmax(0,1fr);gap:58px;align-items:start}.gallery{position:sticky;top:22px}.gallery-frame{width:100%;aspect-ratio:2/3;overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:14px;background:#f5f6f8;color:#8b95a5;font-size:11px;font-weight:750;text-align:center}.gallery-frame img{width:100%;height:100%;object-fit:contain;background:#fff}.gallery-caption{margin-top:11px;text-align:center}.gallery-label{display:block;color:var(--navy);font-size:11px;font-weight:750}.gallery-help{display:block;margin-top:3px;color:var(--muted);font-size:9px}.gallery-nav{margin-top:10px;display:flex;justify-content:center;align-items:center;gap:10px}.gallery-nav button{width:40px;height:36px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--navy);cursor:pointer;font-size:15px}.gallery-nav button:disabled{opacity:.35;cursor:default}.gallery-count{min-width:58px;text-align:center;color:var(--muted);font-size:10px}.detail-eyebrow{margin:0 0 9px}.detail-info h1{margin:0;font-size:clamp(30px,5vw,46px);line-height:1.08;letter-spacing:-1px}.detail-series{margin:9px 0 0;color:var(--navy);font-size:13px;font-weight:750}.detail-tags{display:flex;flex-wrap:wrap;gap:7px;margin:18px 0 0}.detail-tags span{padding:6px 9px;border:1px solid #e7e9ed;border-radius:999px;background:#f7f8fa;color:#5e6875;font-size:10px}.detail-action-wrap{margin-top:24px;padding:18px;border:1px solid var(--border);border-radius:11px;background:#fafbfc}.detail-action-label{margin:0 0 10px;color:var(--muted);font-size:9px;font-weight:750;letter-spacing:.7px;text-transform:uppercase}.detail-action{max-width:240px}.detail-action .book-actions{display:grid;gap:9px}.detail-action .view-book{display:none}.detail-action .add-book{width:100%;box-sizing:border-box;height:40px;padding:10px 12px;border:1px solid var(--navy);border-radius:7px;background:var(--navy);color:#fff;font-size:10px;font-weight:750;text-align:center;cursor:pointer}.detail-action .qty-control{display:grid;grid-template-columns:36px minmax(52px,1fr) 36px;border:1px solid #d9dee6;border-radius:7px;overflow:hidden;background:#fff}.detail-action .qty-control button,.detail-action .qty-control input{height:36px;border:0;background:#fff;color:var(--navy);font:inherit;font-weight:750;text-align:center}.detail-action .qty-control button{cursor:pointer;font-size:16px}.detail-action .qty-control input{width:100%;box-sizing:border-box;border-left:1px solid #e4e7ec;border-right:1px solid #e4e7ec;font-size:11px}.detail-action .qty-error{min-height:14px;margin-top:4px;color:#a33b3b;font-size:9px;font-weight:650;line-height:1.35}.detail-action .qty-control.invalid{border-color:#b84646;background:#fff8f8}.detail-block{padding:21px 0;border-top:1px solid var(--border)}.detail-action-wrap+.detail-block{margin-top:25px}.detail-block h2{margin:0 0 9px;font-size:15px}.detail-block p{margin:0;color:var(--muted);font-size:12px;line-height:1.75}.feature-list{margin:0;padding:0;list-style:none;display:grid;gap:9px}.feature-list li{position:relative;padding-left:18px;color:#596371;font-size:12px;line-height:1.55}.feature-list li:before{content:"✓";position:absolute;left:0;color:var(--navy);font-weight:800}.detail-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.meta-item{padding:12px 13px;border:1px solid #eceef1;border-radius:8px;background:#fafbfc}.meta-item small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.7px}.meta-item strong{display:block;margin-top:4px;font-size:12px;line-height:1.4}.message{padding:40px 22px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;text-align:center;color:var(--muted);font-size:12px}@media(max-width:760px){.detail-wrap{grid-template-columns:1fr;gap:30px}.gallery{position:static;max-width:330px;margin:auto;width:100%}.detail-info h1{font-size:32px}.detail-meta{grid-template-columns:1fr 1fr}.detail-action{max-width:none}}@media(max-width:420px){.detail-meta{grid-template-columns:1fr}}
</style></head><body><header class="catalogue-header"><div class="brand"><div class="brand-name">CAMBRIDGE</div><div class="brand-company">PUBLISHING COMPANY PVT. LTD.</div></div><div class="catalogue-year">DIGITAL CATALOGUE · 2026–27</div></header><main><section class="catalogue-section"><a id="back" class="back-link" href="index.html">← Back to catalogue</a><div id="detail"></div></section></main><footer><div><strong>Cambridge Publishing Company Pvt. Ltd.</strong><p>Bengaluru, Karnataka</p></div><p class="footer-note">Digital Catalogue · 2026–27</p></footer>
<script src="js/catalogue-data.js?v=20260816-3"></script><script src="js/catalogue-query.js?v=20260816-3"></script><script src="js/catalogue-selection.js?v=20260816-5"></script><script>
const Selection=window.CambridgeSelection,Query=window.CambridgeCatalogueQuery;if(!Selection||!Query)throw new Error("Catalogue modules failed to load.");let current=null,images=[],imageIndex=0;
const earlyKey=v=>({Nursery:"nursery",LKG:"lkg",UKG:"ukg"})[v]||"";
function requestedEarlyClass(){const p=new URLSearchParams(location.search),legacy=p.get("level"),ctx=p.get("classContext");if(ctx)return Query.normalizeClass(ctx);if(["nursery","lkg","ukg"].includes(legacy))return Query.normalizeClass(legacy);return""}
function detailEarlyClass(book){const requested=requestedEarlyClass();if(requested&&Query.classValues(book).includes(requested))return requested;const values=Query.classValues(book);return values.length===1&&["Nursery","LKG","UKG"].includes(values[0])?values[0]:""}
function sourceBack(book){const classes=Query.classValues(book);if(book.category==="exam")return "exam-preparation.html?class="+encodeURIComponent(classes[0]||"");if(book.category==="school")return "school-books.html?class="+encodeURIComponent(classes[0]||"");if(book.category==="early-learning"){const c=detailEarlyClass(book),k=earlyKey(c);return k?"early-learning-books.html?level="+encodeURIComponent(k):"early-learning.html"}return"index.html"}
function classTag(book){const values=Query.classValues(book);if(book.category==="early-learning"){const c=detailEarlyClass(book);return c||values.join(" · ")}if(!values.length)return"";return values.length===1?"Class "+values[0]:"Classes "+values.join(", ")}
function imageList(book){const a=[],push=(src,label)=>{if(src&&!a.some(x=>x.src===src))a.push({src,label})};push(book.cover,"Front Cover");if(book.images&&typeof book.images==="object"){push(book.images.front,"Front Cover");push(book.images.back,"Back Cover");if(Array.isArray(book.images.samples))book.images.samples.forEach((x,i)=>push(x,"Sample Page "+(i+1)))}return a}
function gallery(){const frame=document.getElementById("frame"),count=document.getElementById("galleryCount"),label=document.getElementById("galleryLabel"),help=document.getElementById("galleryHelp");frame.innerHTML="";if(!images.length){frame.textContent="BOOK COVER";label.textContent="Cover image coming soon";help.textContent=""}else{const item=images[imageIndex],img=document.createElement("img");img.src=item.src;img.alt=(current.title||"Book")+" — "+item.label;img.onerror=()=>{frame.innerHTML="";frame.textContent="IMAGE UNAVAILABLE"};frame.appendChild(img);label.textContent=item.label;help.textContent=images.length>1?"Swipe or use arrows to view more":""}count.textContent=images.length?(imageIndex+1)+" / "+images.length:"0 / 0";prev.disabled=images.length<2;next.disabled=images.length<2}
function setupSwipe(){const frame=document.getElementById("frame");let x=null,y=null;frame.addEventListener("touchstart",e=>{if(e.touches.length!==1)return;x=e.touches[0].clientX;y=e.touches[0].clientY},{passive:true});frame.addEventListener("touchend",e=>{if(x===null||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;x=y=null;if(images.length<2||Math.abs(dx)<45||Math.abs(dx)<=Math.abs(dy))return;imageIndex=dx<0?(imageIndex+1)%images.length:(imageIndex-1+images.length)%images.length;gallery()},{passive:true})}
function refresh(){const a=document.getElementById("detailAction");if(a){a.innerHTML="";a.appendChild(Selection.actionNode(current));const v=a.querySelector(".view-book");if(v)v.remove()}Selection.updateBar()}
function block(title){const b=document.createElement("div");b.className="detail-block";const h=document.createElement("h2");h.textContent=title;b.appendChild(h);return b}
function init(){const id=new URLSearchParams(location.search).get("id");current=Query.byId(id);if(!current){detail.innerHTML='<div class="message">This book could not be found in the current catalogue.</div>';return}document.title=(current.title||"Book")+" | Cambridge Digital Catalogue";back.href=sourceBack(current);if(current.category==="early-learning"){const c=detailEarlyClass(current),k=earlyKey(c);window.SELECTION_EXTRA=k?{level:k,levelName:c}:{}}else window.SELECTION_EXTRA={};images=imageList(current);const series=current.series||current.family||"",tags=[classTag(current),current.displaySubject||current.subject,current.medium?current.medium+" Medium":"",current.type].filter(Boolean),meta=[["SKU",current.sku],["ISBN",current.isbn],["MRP",Number.isFinite(current.mrp)?"₹"+current.mrp:""]].filter(x=>x[1]);detail.innerHTML='<div class="detail-wrap"><div class="gallery"><div class="gallery-frame" id="frame"></div><div class="gallery-caption"><span class="gallery-label" id="galleryLabel"></span><span class="gallery-help" id="galleryHelp"></span></div><div class="gallery-nav"><button id="prev" type="button">←</button><span class="gallery-count" id="galleryCount"></span><button id="next" type="button">→</button></div></div><div class="detail-info"><p class="eyebrow detail-eyebrow">BOOK DETAILS</p><h1></h1><p class="detail-series" id="detailSeries" hidden></p><div class="detail-tags"></div><div class="detail-action-wrap"><p class="detail-action-label">Add this title to your selection</p><div class="detail-action" id="detailAction"></div></div><div id="description"></div><div id="features"></div><div id="meta"></div></div></div>';detail.querySelector("h1").textContent=current.title||"Untitled Book";if(series){detailSeries.textContent=series;detailSeries.hidden=false}const t=detail.querySelector(".detail-tags");tags.forEach(x=>{const s=document.createElement("span");s.textContent=x;t.appendChild(s)});if(current.description){const b=block("About this book"),p=document.createElement("p");p.textContent=current.description;b.appendChild(p);description.appendChild(b)}const fs=Array.isArray(current.features)?current.features.filter(Boolean):[];if(fs.length){const b=block("Key features"),ul=document.createElement("ul");ul.className="feature-list";fs.forEach(x=>{const li=document.createElement("li");li.textContent=x;ul.appendChild(li)});b.appendChild(ul);features.appendChild(b)}if(meta.length){const b=block("Book information"),grid=document.createElement("div");grid.className="detail-meta";meta.forEach(([k,v])=>{const x=document.createElement("div");x.className="meta-item";const small=document.createElement("small");small.textContent=k;const strong=document.createElement("strong");strong.textContent=v;x.append(small,strong);grid.appendChild(x)});b.appendChild(grid);document.getElementById("meta").appendChild(b)}prev.onclick=()=>{imageIndex=(imageIndex-1+images.length)%images.length;gallery()};next.onclick=()=>{imageIndex=(imageIndex+1)%images.length;gallery()};gallery();setupSwipe();refresh()}
window.addEventListener(Selection.CHANGE_EVENT,refresh);document.addEventListener("DOMContentLoaded",init);
</script></body></html>
