<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Book Details | Cambridge Digital Catalogue</title><link rel="stylesheet" href="css/catalogue.css">
<style>
.page-hero{padding:46px 6% 34px;background:#fff}.hero-inner{max-width:1180px;margin:auto}.back-link{display:inline-block;margin-bottom:18px;color:var(--navy);text-decoration:none;font-size:12px;font-weight:700}.page-hero h1{margin:0;font-size:clamp(32px,5vw,48px);letter-spacing:-1.3px}.hero-description{max-width:680px;margin:10px 0 0;color:var(--muted);font-size:13px;line-height:1.6}.controls{margin-top:26px;display:flex;gap:10px;flex-wrap:wrap}.controls input,.controls select{box-sizing:border-box;padding:12px 13px;border:1px solid var(--border);border-radius:8px;background:#fff;font:inherit;font-size:12px}.controls input{flex:1 1 280px}.selection-bar{margin-top:13px;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--border);border-radius:8px;background:#fafbfc}.selection-bar[hidden]{display:none}.selection-status{margin:0;color:var(--muted);font-size:11px}.view-selection{padding:9px 12px;border-radius:6px;background:var(--navy);color:#fff;text-decoration:none;font-size:10px;font-weight:750}.results-summary{margin-bottom:18px;display:flex;justify-content:space-between;align-items:end;gap:16px}.results-summary h2{margin:0;font-size:25px}.results-count{margin:0;color:var(--muted);font-size:11px}.group-section+.group-section{margin-top:30px}.group-title{padding:0 2px 8px;display:flex;justify-content:space-between;align-items:end;gap:14px;border-bottom:2px solid var(--navy)}.group-title h3{margin:0;font-size:20px}.group-title span{color:var(--muted);font-size:10px}.book-list{overflow:hidden;border:1px solid var(--border);border-radius:var(--radius);background:#fff}.book-card{padding:20px 22px;display:grid;grid-template-columns:104px minmax(0,1fr) 160px;gap:22px;align-items:center;border-bottom:1px solid var(--border)}.book-card:last-child{border-bottom:0}.book-cover{width:104px;aspect-ratio:2/3;overflow:hidden;display:flex;align-items:center;justify-content:center;border-radius:7px;background:#eef1f5;color:#8 @media(max-width:720px){.page-hero{padding:36px 18px 28px}.selection-bar,.results-summary{align-items:flex-start;flex-direction:column}.book-card{padding:18px;grid-template-columns:86px minmax(0,1fr);gap:16px;align-items:start}.book-cover{width:86px}.book-actions{grid-column:2;width:100%;max-width:190px}.view-book,.add-book{padding:10px}.group-title{align-items:start}}
</style>

<style>
.detail-wrap{max-width:1080px;margin:auto;display:grid;grid-template-columns:minmax(260px,390px) minmax(0,1fr);gap:58px;align-items:start}.gallery{position:sticky;top:22px}.gallery-frame{width:100%;aspect-ratio:2/3;overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:14px;background:#f5f6f8;color:#8b95a5;font-size:11px;font-weight:750;text-align:center}.gallery-frame img{width:100%;height:100%;object-fit:contain;background:#fff}.gallery-caption{margin-top:11px;text-align:center}.gallery-label{display:block;color:var(--navy);font-size:11px;font-weight:750}.gallery-help{display:block;margin-top:3px;color:var(--muted);font-size:9px}.gallery-nav{margin-top:10px;display:flex;justify-content:center;align-items:center;gap:10px}.gallery-nav button{width:40px;height:36px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--navy);cursor:pointer;font-size:15px}.gallery-nav button:disabled{opacity:.35;cursor:default}.gallery-count{min-width:58px;text-align:center;color:var(--muted);font-size:10px}.detail-eyebrow{margin:0 0 9px}.detail-info h1{margin:0;font-size:clamp(30px,5vw,46px);line-height:1.08;letter-spacing:-1px}.detail-series{margin:9px 0 0;color:var(--navy);font-size:13px;font-weight:750}.detail-tags{display:flex;flex-wrap:wrap;gap:7px;margin:18px 0 0}.detail-tags span{padding:6px 9px;border:1px solid #e7e9ed;border-radius:999px;background:#f7f8fa;color:#5e6875;font-size:10px}.detail-action-wrap{margin-top:24px;padding:18px;border:1px solid var(--border);border-radius:11px;background:#fafbfc}.detail-action-label{margin:0 0 10px;color:var(--muted);font-size:9px;font-weight:750;letter-spacing:.7px;text-transform:uppercase}.detail-action{max-width:240px;margin:0}.detail-action .add-book{height:40px;background:var(--navy);color:#fff}.detail-block{padding:21px 0;border-top:1px solid var(--border)}.detail-action-wrap+.detail-block{margin-top:25px}.detail-block h2{margin:0 0 9px;font-size:15px}.detail-block p{margin:0;color:var(--muted);font-size:12px;line-height:1.75}.feature-list{margin:0;padding:0;list-style:none;display:grid;gap:9px}.feature-list li{position:relative;padding-left:18px;color:#596371;font-size:12px;line-height:1.55}.feature-list li:before{content:"✓";position:absolute;left:0;color:var(--navy);font-weight:800}.detail-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.meta-item{padding:12px 13px;border:1px solid #eceef1;border-radius:8px;background:#fafbfc}.meta-item small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.7px}.meta-item strong{display:block;margin-top:4px;font-size:12px;line-height:1.4}@media(max-width:760px){.detail-wrap{grid-template-columns:1fr;gap:30px}.gallery{position:static;max-width:330px;margin:auto;width:100%}.detail-info h1{font-size:32px}.detail-meta{grid-template-columns:1fr 1fr}.detail-action{max-width:none}}@media(max-width:420px){.detail-meta{grid-template-columns:1fr}}
</style></head><body>
<header class="catalogue-header"><div class="brand"><div class="brand-name">CAMBRIDGE</div><div class="brand-company">PUBLISHING COMPANY PVT. LTD.</div></div><div class="catalogue-year">DIGITAL CATALOGUE · 2026–27</div></header>
<main><section class="catalogue-section"><a id="back" class="back-link" href="index.html">← Back to catalogue</a><div id="detail"></div></section></main>
<footer><div><strong>Cambridge Publishing Company Pvt. Ltd.</strong><p>Bengaluru, Karnataka</p></div><p class="footer-note">Digital Catalogue · 2026–27</p></footer>
<script src="js/catalogue-data.js"></script><script src="js/catalogue-selection.js?v=20260816-4"></script><script>
const Selection=window.CambridgeSelection;
if(!Selection){throw new Error("Cambridge selection module failed to load.");}

let current=null,images=[],imageIndex=0;
function detailLevel(book){const requested=new URLSearchParams(location.search).get("level");if(["nursery","lkg","ukg"].includes(requested))return requested;if(Array.isArray(book.levels)&&book.levels.length===1&&["nursery","lkg","ukg"].includes(book.levels[0]))return book.levels[0];return ""}
function sourceBack(book){if(book.category==="exam")return "exam-preparation.html?class="+book.class;if(book.category==="school")return "school-books.html?class="+book.class;if(book.category==="early-learning"){const l=detailLevel(book);return l?"early-learning-books.html?level="+encodeURIComponent(l):"early-learning.html"}return "index.html"}
function imageList(book){const a=[],push=(src,label)=>{if(src&&!a.some(x=>x.src===src))a.push({src,label})};push(book.cover,"Front Cover");if(book.images&&typeof book.images==="object"){push(book.images.front,"Front Cover");push(book.images.back,"Back Cover");if(Array.isArray(book.images.samples))book.images.samples.forEach((x,i)=>push(x,"Sample Page "+(i+1)))}return a}
function gallery(){const frame=document.getElementById("frame"),count=document.getElementById("galleryCount"),label=document.getElementById("galleryLabel"),help=document.getElementById("galleryHelp");frame.innerHTML="";if(!images.length){frame.textContent="BOOK COVER";label.textContent="Cover image coming soon";help.textContent=""}else{const item=images[imageIndex],img=document.createElement("img");img.src=item.src;img.alt=(current.title||"Book")+" — "+item.label;img.onerror=()=>{frame.innerHTML="";frame.textContent="IMAGE UNAVAILABLE"};frame.appendChild(img);label.textContent=item.label;help.textContent=images.length>1?"Swipe or use arrows to view more":""}count.textContent=images.length?(imageIndex+1)+" / "+images.length:"0 / 0";document.getElementById("prev").disabled=images.length<2;document.getElementById("next").disabled=images.length<2}
function setupSwipe(){const frame=document.getElementById("frame");let startX=null,startY=null;frame.addEventListener("touchstart",e=>{if(e.touches.length!==1)return;startX=e.touches[0].clientX;startY=e.touches[0].clientY},{passive:true});frame.addEventListener("touchend",e=>{if(startX===null||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;startX=startY=null;if(images.length<2||Math.abs(dx)<45||Math.abs(dx)<=Math.abs(dy))return;imageIndex=dx<0?(imageIndex+1)%images.length:(imageIndex-1+images.length)%images.length;gallery()},{passive:true})}
function refresh(){const a=document.getElementById("detailAction");if(a){a.innerHTML="";a.appendChild(Selection.actionNode(current));const v=a.querySelector(".view-book");if(v)v.remove()}Selection.updateBar()}
function init(){const id=new URLSearchParams(location.search).get("id");current=catalogue().find(b=>String(b.id)===String(id));const root=document.getElementById("detail");if(!current){root.innerHTML='<div class="message">This book could not be found in the current catalogue.</div>';return}document.title=(current.title||"Book")+" | Cambridge Digital Catalogue";document.getElementById("back").href=sourceBack(current);if(current.category==="early-learning"){const l=detailLevel(current);const names={nursery:"Nursery",lkg:"LKG",ukg:"UKG"};window.SELECTION_EXTRA=l?{level:l,levelName:names[l]}:{}}else window.SELECTION_EXTRA={};images=imageList(current);const series=current.series||current.family||"";const tags=[current.class?"Class "+current.class:"",current.category==="early-learning"&&detailLevel(current)?({nursery:"Nursery",lkg:"LKG",ukg:"UKG"}[detailLevel(current)]):"",current.displaySubject||current.subject,current.medium?current.medium+" Medium":"",current.type].filter(Boolean);const meta=[["SKU",current.sku],["ISBN",current.isbn],["MRP",Number.isFinite(current.mrp)?"₹"+current.mrp:""]].filter(x=>x[1]);root.innerHTML='<div class="detail-wrap"><div class="gallery"><div class="gallery-frame" id="frame"></div><div class="gallery-caption"><span class="gallery-label" id="galleryLabel"></span><span class="gallery-help" id="galleryHelp"></span></div><div class="gallery-nav"><button id="prev" type="button" aria-label="Previous image">←</button><span class="gallery-count" id="galleryCount"></span><button id="next" type="button" aria-label="Next image">→</button></div></div><div class="detail-info"><p class="eyebrow detail-eyebrow">BOOK DETAILS</p><h1></h1><p class="detail-series" id="detailSeries" hidden></p><div class="detail-tags"></div><div class="detail-action-wrap"><p class="detail-action-label">Add this title to your selection</p><div class="detail-action" id="detailAction"></div></div><div id="description"></div><div id="features"></div><div id="meta"></div></div></div>';root.querySelector("h1").textContent=current.title||"Untitled Book";if(series){const s=document.getElementById("detailSeries");s.textContent=series;s.hidden=false}const t=root.querySelector(".detail-tags");tags.forEach(x=>{const s=document.createElement("span");s.textContent=x;t.appendChild(s)});if(current.description){const b=document.createElement("div");b.className="detail-block";b.innerHTML="<h2>About this book</h2><p></p>";b.querySelector("p").textContent=current.description;document.getElementById("description").appendChild(b)}const features=Array.isArray(current.features)?current.features.filter(Boolean):[];if(features.length){const b=document.createElement("div");b.className="detail-block";const h=document.createElement("h2");h.textContent="Key features";const ul=document.createElement("ul");ul.className="feature-list";features.forEach(x=>{const li=document.createElement("li");li.textContent=x;ul.appendChild(li)});b.append(h,ul);document.getElementById("features").appendChild(b)}if(meta.length){const b=document.createElement("div");b.className="detail-block";const h=document.createElement("h2");h.textContent="Book information";const grid=document.createElement("div");grid.className="detail-meta";meta.forEach(([k,v])=>{const d=document.createElement("div");d.className="meta-item";const sm=document.createElement("small");sm.textContent=k;const st=document.createElement("strong");st.textContent=v;d.append(sm,st);grid.appendChild(d)});b.append(h,grid);document.getElementById("meta").appendChild(b)}document.getElementById("prev").onclick=()=>{if(images.length){imageIndex=(imageIndex-1+images.length)%images.length;gallery()}};document.getElementById("next").onclick=()=>{if(images.length){imageIndex=(imageIndex+1)%images.length;gallery()}};gallery();setupSwipe();refresh()}
window.addEventListener(Selection.CHANGE_EVENT,refresh);
document.addEventListener("DOMContentLoaded",init);
</script></body></html>
