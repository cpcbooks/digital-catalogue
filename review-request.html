<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Review Request | Cambridge Digital Catalogue</title><link rel="stylesheet" href="css/catalogue.css">
<style>
.review-hero{padding:45px 6% 28px;background:#fff}.review-wrap,.review-section{max-width:950px;margin:auto}.back-link{display:inline-block;margin-bottom:20px;color:var(--navy);text-decoration:none;font-size:12px;font-weight:700}.review-hero h1{margin:0;font-size:clamp(34px,5vw,50px);letter-spacing:-1.5px}.review-intro{margin:10px 0 0;color:var(--muted);font-size:13px;line-height:1.6}.review-section{padding:26px 6% 60px}.review-card{margin-bottom:18px;padding:24px;background:#fff;border:1px solid var(--border);border-radius:12px}.card-heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px}.card-heading h2{margin:0;font-size:18px}.edit-link{display:inline-flex;align-items:center;padding:7px 10px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--navy);text-decoration:none;font-size:11px;font-weight:750;white-space:nowrap}.edit-link:hover{border-color:var(--navy);background:#f7f8fa}.details-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 28px}.detail-item.full{grid-column:1/-1}.detail-label{margin-bottom:5px;color:var(--muted);font-size:10px;font-weight:750;letter-spacing:.6px;text-transform:uppercase}.detail-value{color:#252b33;font-size:13px;font-weight:650;line-height:1.5;overflow-wrap:anywhere}.detail-value.notes{font-weight:500;white-space:pre-wrap}.selection-item{padding:18px 0;border-top:1px solid var(--border)}.selection-item:first-of-type{padding-top:0;border-top:0}.selection-main{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}.selection-type{margin-bottom:4px;color:var(--muted);font-size:9px;font-weight:750;letter-spacing:.7px;text-transform:uppercase}.selection-title{margin:0;font-size:14px;line-height:1.4}.selection-meta{margin-top:5px;color:var(--muted);font-size:10px}.selection-quantity{min-width:75px;text-align:right}.selection-quantity span{display:block;margin-bottom:3px;color:var(--muted);font-size:9px;font-weight:750;text-transform:uppercase}.selection-quantity strong{font-size:15px}.view-books{margin-top:12px;padding:0;border:0;background:transparent;color:var(--navy);cursor:pointer;font-size:10px;font-weight:750}.kit-books{display:none;margin-top:12px;padding:14px 17px;background:#f7f8fa;border-radius:8px}.kit-books.visible{display:block}.kit-books ol{margin:0;padding-left:20px}.kit-books li{margin:6px 0;color:#555f6b;font-size:10px}.request-summary{padding:22px;background:var(--navy);color:#fff;border-radius:12px}.summary-top{display:flex;justify-content:space-between;align-items:flex-start;gap:25px}.summary-title{font-size:13px;font-weight:750}.summary-count{text-align:right}.summary-count strong{display:block;font-size:21px}.summary-count span{color:rgba(255,255,255,.65);font-size:10px}.summary-note{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.7);font-size:10px;line-height:1.6}.request-notice{margin-top:18px;padding:16px 18px;background:#f7f8fa;border:1px solid var(--border);border-radius:10px;color:#555f6b;font-size:11px;line-height:1.6}.request-notice strong{color:#252b33}.review-actions{display:flex;justify-content:flex-end;margin-top:20px}.primary-button,.secondary-button{padding:13px 19px;border-radius:8px;font-size:12px;font-weight:750;text-decoration:none;text-align:center}.primary-button{border:0;background:var(--navy);color:#fff;cursor:pointer}.secondary-button{border:1px solid var(--border);background:#fff;color:var(--navy)}.review-error{padding:45px 22px;text-align:center;background:#fff;border:1px solid var(--border);border-radius:12px}.review-error h2{margin:0 0 8px}.review-error p{margin:0 0 22px;color:var(--muted);font-size:12px}@media(max-width:650px){.review-hero{padding:35px 18px 24px}.review-section{padding:22px 18px 45px}.review-card{padding:18px}.details-grid{grid-template-columns:1fr}.detail-item.full{grid-column:auto}.selection-main{gap:12px}.primary-button{width:100%}.card-heading{align-items:flex-start}}
</style></head>
<body><header class="catalogue-header"><div class="brand"><div class="brand-name">CAMBRIDGE</div><div class="brand-company">PUBLISHING COMPANY PVT. LTD.</div></div><div class="catalogue-year">DIGITAL CATALOGUE · 2026–27</div></header>
<section class="review-hero"><div class="review-wrap"><a href="request.html" class="back-link">← Back to Request Details</a><p class="eyebrow">ORDER REQUEST</p><h1>Review Request</h1><p class="review-intro">Check your details and selected books before sending your request to Cambridge.</p></div></section><main class="review-section" id="reviewPage"></main>
<script>
const ORDER_KEY="cambridgeOrder",REQUEST_KEY="cambridgeRequestDetails",MIN_QUANTITY=1,MAX_QUANTITY=10000;let order=[],requestDetails={};
function loadData(){try{const x=JSON.parse(localStorage.getItem(ORDER_KEY)||"[]");order=Array.isArray(x)?x.filter(i=>i&&typeof i==="object"):[]}catch(e){order=[]}try{const x=JSON.parse(localStorage.getItem(REQUEST_KEY)||"{}");requestDetails=x&&typeof x==="object"&&!Array.isArray(x)?x:{}}catch(e){requestDetails={}}}
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function typeLabel(v){return({school:"School / Institution",dealer:"Bookshop / Dealer / Distributor",individual:"Individual / Parent / Student",other:"Other"})[v]||"—"}function contactLabel(v){return({whatsapp:"WhatsApp",call:"Phone Call",email:"Email"})[v]||"—"}function validPhone(v){return/^[6-9]\d{9}$/.test(String(v||""))}function validOrder(){return order.length>0&&order.every(i=>Number.isSafeInteger(Number(i.quantity))&&Number(i.quantity)>=1&&Number(i.quantity)<=10000)}function validDetails(){const d=requestDetails;if(!d.customerType||!d.contactName||!d.city||!validPhone(d.mobile))return false;if(["school","dealer","other"].includes(d.customerType)&&!d.organisationName)return false;if(!d.whatsappSameAsMobile&&!validPhone(d.whatsapp))return false;if(d.preferredContact==="email"&&!d.email)return false;return true}function total(){return order.reduce((s,i)=>s+(Number(i.quantity)||0),0)}
function detail(label,value,full=false,notes=false){if(value===undefined||value===null||String(value).trim()==="")return"";return`<div class="detail-item ${full?"full":""}"><div class="detail-label">${esc(label)}</div><div class="detail-value ${notes?"notes":""}">${esc(value)}</div></div>`}
function renderDetails(){const d=requestDetails,w=d.whatsappSameAsMobile?d.mobile:d.whatsapp;return`<section class="review-card"><div class="card-heading"><h2>Your Details</h2><a href="request.html" class="edit-link">Edit Details →</a></div><div class="details-grid">${detail("Requesting As",typeLabel(d.customerType))}${detail("Contact Name",d.contactName)}${detail("Organisation / Institution",d.organisationName)}${detail("Mobile Number",d.mobile)}${detail("WhatsApp Number",w)}${detail("City / Place",d.city)}${detail("District",d.district)}${detail("State",d.state)}${detail("PIN Code",d.pincode)}${detail("Email",d.email)}${detail("Existing Cambridge Customer",d.existingCustomer)}${detail("Preferred Contact",contactLabel(d.preferredContact))}${detail("Notes / Requirements",d.notes,true,true)}</div></section>`}
function renderSelection(){let html="";order.forEach((item,i)=>{const title=item.title||(item.levelName?item.levelName+" Custom Kit":"Selected Item"),isKit=item.type==="custom-kit",count=isKit?(Array.isArray(item.books)?item.books.length:Number(item.bookCount)||0):0,meta=isKit?`${count} ${count===1?"book":"books"} in this kit`:(item.levelName||"");let books="";if(isKit&&Array.isArray(item.books)&&item.books.length)books=`<button type="button" class="view-books" data-kit="${i}">View books ↓</button><div class="kit-books" id="kit${i}"><ol>${item.books.map(b=>`<li>${esc(b.title||"Untitled Book")}</li>`).join("")}</ol></div>`;html+=`<div class="selection-item"><div class="selection-main"><div><div class="selection-type">${isKit?"Custom Kit":"Book"}</div><h3 class="selection-title">${esc(title)}</h3>${meta?`<div class="selection-meta">${esc(meta)}</div>`:""}</div><div class="selection-quantity"><span>Quantity</span><strong>${Number(item.quantity)}</strong></div></div>${books}</div>`});return`<section class="review-card"><div class="card-heading"><h2>Your Selection</h2><a href="order.html" class="edit-link">Edit Selection →</a></div>${html}</section>`}
function renderSummary(){const q=total(),n=order.length;return`<div class="request-summary"><div class="summary-top"><div class="summary-title">Request Summary</div><div class="summary-count"><strong>${q}</strong><span>${q===1?"total item":"total items"} · ${n} ${n===1?"selection":"selections"}</span></div></div><div class="summary-note">This is an order request, not a confirmed order. Cambridge will confirm pricing, availability and the next steps after reviewing your request.</div></div>`}
function renderActions(){return`<div class="request-notice"><strong>Please review before sending.</strong> Check the contact details, selected books and quantities above. You can edit either section using the relevant Edit action above without losing your saved information.</div><div class="review-actions"><button type="button" class="primary-button" id="sendRequestButton">Send Request →</button></div>`}
function render(){const p=document.getElementById("reviewPage");if(!validOrder()){p.innerHTML=`<div class="review-error"><h2>Your selection needs attention.</h2><p>Return to Your Selection and check the selected books and quantities.</p><a href="order.html" class="secondary-button">Return to Selection</a></div>`;return}if(!validDetails()){p.innerHTML=`<div class="review-error"><h2>Your request details need attention.</h2><p>Return to Request Details and complete the required information.</p><a href="request.html" class="secondary-button">Return to Request Details</a></div>`;return}p.innerHTML=renderDetails()+renderSelection()+renderSummary()+renderActions()}
document.getElementById("reviewPage").addEventListener("click",e=>{const b=e.target.closest(".view-books");if(b){const box=document.getElementById("kit"+b.dataset.kit),open=box.classList.toggle("visible");b.textContent=open?"Hide books ↑":"View books ↓";return}if(e.target.closest("#sendRequestButton"))alert("Your request is ready to send.\n\nThe final submission method will be connected next.")});loadData();render();
</script></body></html>
