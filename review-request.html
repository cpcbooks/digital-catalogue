<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Review Requirement | Cambridge Digital Catalogue</title><link rel="stylesheet" href="css/catalogue.css">
<style>
.review-hero{padding:32px 6% 20px;background:#fff}.review-wrap,.review-section{max-width:950px;margin:auto}.back-link{display:inline-flex;align-items:center;min-height:32px;margin-bottom:14px;color:var(--navy);text-decoration:none;font-size:12px;font-weight:700}.review-hero h1{margin:0;color:var(--navy);font-size:clamp(30px,3.2vw,38px);line-height:1.16;letter-spacing:-.8px}.review-intro{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.5}.review-section{padding:20px 6% 52px}.review-card{margin-bottom:14px;padding:20px;background:#fff;border:1px solid var(--border);border-radius:12px}.card-heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:16px}.card-heading h2{margin:0;font-size:18px}.edit-link{display:inline-flex;align-items:center;padding:7px 10px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--navy);text-decoration:none;font-size:11px;font-weight:750;white-space:nowrap}.edit-link:hover{border-color:var(--navy);background:#f7f8fa}.details-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px}.detail-item.full{grid-column:1/-1}.detail-label{margin-bottom:4px;color:var(--muted);font-size:10px;font-weight:750;letter-spacing:.6px;text-transform:uppercase}.detail-value{color:#252b33;font-size:13px;font-weight:650;line-height:1.5;overflow-wrap:anywhere}.detail-value.notes{font-weight:500;white-space:pre-wrap}.selection-item{padding:14px 0;border-top:1px solid var(--border)}.selection-item:first-of-type{padding-top:0;border-top:0}.selection-main{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}.selection-type{margin-bottom:3px;color:var(--muted);font-size:9px;font-weight:750;letter-spacing:.7px;text-transform:uppercase}.selection-title{margin:0;font-size:14px;line-height:1.4}.selection-meta{margin-top:4px;color:var(--muted);font-size:10px}.selection-quantity{min-width:70px;text-align:right}.selection-quantity span{display:block;margin-bottom:3px;color:var(--muted);font-size:9px;font-weight:750;text-transform:uppercase}.selection-quantity strong{font-size:15px}.view-books{margin-top:10px;padding:0;border:0;background:transparent;color:var(--navy);cursor:pointer;font-size:10px;font-weight:750}.kit-books{display:none;margin-top:10px;padding:12px 15px;background:#f7f8fa;border-radius:8px}.kit-books.visible{display:block}.kit-books ol{margin:0;padding-left:20px}.kit-books li{margin:5px 0;color:#555f6b;font-size:10px}.request-summary{padding:18px;background:var(--navy);color:#fff;border-radius:12px}.summary-top{display:flex;justify-content:space-between;align-items:flex-start;gap:25px}.summary-title{font-size:13px;font-weight:750}.summary-count{text-align:right}.summary-count strong{display:block;font-size:16px}.summary-count span{color:rgba(255,255,255,.65);font-size:10px}.summary-note{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.7);font-size:10px;line-height:1.6}.request-notice{margin-top:14px;padding:14px 16px;background:#f7f8fa;border:1px solid var(--border);border-radius:10px;color:#555f6b;font-size:11px;line-height:1.6}.request-notice strong{color:#252b33}.review-actions{display:flex;justify-content:flex-end;margin-top:16px}.primary-button,.secondary-button{padding:13px 19px;border-radius:8px;font-size:12px;font-weight:750;text-decoration:none;text-align:center}.primary-button{border:0;background:var(--navy);color:#fff;cursor:pointer}.primary-button:disabled{opacity:.6;cursor:wait}.secondary-button{border:1px solid var(--border);background:#fff;color:var(--navy)}.submission-status{margin-top:10px;text-align:right;color:#a33b3b;font-size:11px;font-weight:650}.review-error{padding:38px 22px;text-align:center;background:#fff;border:1px solid var(--border);border-radius:12px}.review-error h2{margin:0 0 8px}.review-error p{margin:0 0 22px;color:var(--muted);font-size:12px}.requirement-submitted .review-hero{display:none}.requirement-submitted .review-section{min-height:calc(100vh - 78px);max-width:950px;display:grid;place-items:center;padding:48px 6%}.success-card{width:min(100%,820px);padding:34px 48px;text-align:center;background:#fff;border:1px solid var(--border);border-radius:12px}.success-icon{width:56px;height:56px;margin:0 auto 18px;display:grid;place-items:center;border-radius:50%;background:#78be20;color:#fff}.success-icon svg{width:34px;height:34px}.success-card h2{margin:0;color:var(--navy);font-size:clamp(26px,3vw,30px);line-height:1.18;letter-spacing:-.5px}.success-message{margin:16px auto 24px;max-width:660px;color:var(--text);font-size:16px;line-height:1.55}.success-reference-panel{margin:0 auto 20px;padding:22px 26px;display:flex;align-items:center;justify-content:center;gap:24px;background:#f1f6fc;border-radius:12px}.success-reference-copy{min-width:0;flex:1;text-align:left}.success-reference-label{margin:0 0 6px;color:var(--muted);font-size:13px;font-weight:750;letter-spacing:.7px}.success-reference{margin:0;color:var(--navy);font-size:clamp(19px,2.2vw,22px);font-weight:800;letter-spacing:.25px;overflow-wrap:anywhere}.copy-reference{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border:1px solid var(--navy);border-radius:8px;background:#fff;color:var(--navy);cursor:pointer;font-size:14px;font-weight:750;white-space:nowrap}.copy-reference:hover{background:#f7f8fa}.copy-reference svg{width:18px;height:18px}.copy-reference-status{min-height:20px;margin:-12px 0 16px;color:var(--muted);font-size:13px}.success-reminder{margin:0 auto 24px;max-width:560px;color:var(--muted);font-size:14px;line-height:1.5}.success-back{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:220px}.requirement-submitted .success-back{width:auto}@media(max-width:650px){.review-hero{padding:24px 18px 18px}.review-hero h1{font-size:30px;line-height:36px}.review-section{padding:18px 18px 40px}.review-card{padding:16px}.details-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.detail-item.full{grid-column:1/-1}.selection-main{gap:12px}.view-books{display:inline-flex;align-items:center;min-height:44px}.primary-button{width:100%}.card-heading{align-items:flex-start}.submission-status{text-align:left}.requirement-submitted .review-section{min-height:calc(100vh - 67px);padding:32px 18px}.success-card{padding:24px 20px}.success-icon{width:52px;height:52px;margin-bottom:16px}.success-card h2{font-size:clamp(22px,6.2vw,26px)}.success-message{margin:14px auto 22px;font-size:15px}.success-reference-panel{padding:20px 16px;display:block}.success-reference-copy{text-align:center}.success-reference-label{font-size:12px}.success-reference{font-size:clamp(17px,5.1vw,20px)}.copy-reference{width:100%;margin-top:16px}.copy-reference-status{margin-top:-10px}.success-reminder{font-size:13px}.success-back{width:100%}.requirement-submitted .success-back{width:100%}}@media(max-width:359px){.details-grid{grid-template-columns:1fr}.detail-item.full{grid-column:auto}.success-card{padding:22px 16px}.success-reference-panel{padding:18px 12px}}
</style></head>
<body><header class="catalogue-header"><div class="brand"><div class="brand-name">CAMBRIDGE</div><div class="brand-company">PUBLISHING COMPANY PVT. LTD.</div></div><div class="catalogue-year">DIGITAL CATALOGUE · 2026–27</div></header>
<section class="review-hero"><div class="review-wrap"><div class="workflow-breadcrumb"><a class="home" href="index.html">Home</a></div><a href="request.html" class="back-link">← Back to Requirement Details</a><h1>Review Requirement</h1><p class="review-intro">Check your details and selected books before sending your requirement to Cambridge.</p></div></section><main class="review-section" id="reviewPage"></main>
<script src="js/catalogue-pilot-config.js"></script><script src="js/catalogue-bootstrap.js"></script><script src="js/catalogue-source-links.js"></script><script src="js/request-submission.js"></script>
<script>
const source=window.CambridgeCatalogueBootstrap,withSource=href=>source?source.withSource(href):href,ORDER_KEY="cambridgeOrder",REQUEST_KEY="cambridgeRequestDetails",MIN_QUANTITY=1,MAX_QUANTITY=10000;let order=[],requestDetails={},submitting=false;
function loadData(){try{const x=JSON.parse(localStorage.getItem(ORDER_KEY)||"[]");order=Array.isArray(x)?x.filter(i=>i&&typeof i==="object"):[]}catch(e){order=[]}try{const x=JSON.parse(sessionStorage.getItem(REQUEST_KEY)||"{}");requestDetails=x&&typeof x==="object"&&!Array.isArray(x)?x:{}}catch(e){requestDetails={}}}
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function typeLabel(v){return({school:"School / Institution",dealer:"Bookshop / Dealer / Distributor",individual:"Individual / Parent / Student",other:"Other"})[v]||"—"}function contactLabel(v){return({whatsapp:"WhatsApp",call:"Phone Call",email:"Email"})[v]||"—"}function validPhone(v){return/^[6-9]\d{9}$/.test(String(v||""))}function validEmail(v){return/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v||""))}function validOrder(){return order.length>0&&order.every(i=>Number.isSafeInteger(Number(i.quantity))&&Number(i.quantity)>=1&&Number(i.quantity)<=10000)}function validDetails(){const d=requestDetails;if(!d.customerType||!d.contactName||!d.city||!validPhone(d.mobile))return false;if(["school","dealer","other"].includes(d.customerType)&&!d.organisationName)return false;if(!d.whatsappSameAsMobile&&!validPhone(d.whatsapp))return false;if(d.email&&!validEmail(d.email))return false;if(d.preferredContact==="email"&&!validEmail(d.email))return false;return true}function selectionCounts(){return order.reduce((counts,item)=>{const quantity=Number(item.quantity)||0;if(item.type==="custom-kit"||item.type==="standard-kit")counts.kitSets+=quantity;else counts.copies+=quantity;return counts},{copies:0,kitSets:0})}
function detail(label,value,full=false,notes=false){if(value===undefined||value===null||String(value).trim()==="")return"";return`<div class="detail-item ${full?"full":""}"><div class="detail-label">${esc(label)}</div><div class="detail-value ${notes?"notes":""}">${esc(value)}</div></div>`}
function renderDetails(){const d=requestDetails,w=d.whatsappSameAsMobile?d.mobile:d.whatsapp;return`<section class="review-card"><div class="card-heading"><h2>Your Details</h2><a href="${withSource("request.html")}" class="edit-link">Edit Details →</a></div><div class="details-grid">${detail("Requesting As",typeLabel(d.customerType))}${detail("Contact Name",d.contactName)}${detail("Organisation / Institution",d.organisationName)}${detail("Mobile Number",d.mobile)}${detail("WhatsApp Number",w)}${detail("City / Place",d.city)}${detail("District",d.district)}${detail("State",d.state)}${detail("PIN Code",d.pincode)}${detail("Email",d.email)}${detail("Existing Cambridge Customer",d.existingCustomer)}${detail("Preferred Contact",contactLabel(d.preferredContact))}${detail("Notes / Requirements",d.notes,true,true)}</div></section>`}
function renderSelection(){let html="";order.forEach((item,i)=>{const title=item.title||(item.levelName?item.levelName+" Custom Kit":"Selected Item"),isKit=item.type==="custom-kit"||item.type==="standard-kit",count=isKit?(Array.isArray(item.books)?item.books.length:Number(item.bookCount)||0):0,meta=isKit?`${count} ${count===1?"book":"books"} in this kit`:(item.levelName||"");let books="";if(isKit&&Array.isArray(item.books)&&item.books.length)books=`<button type="button" class="view-books" data-kit="${i}">View books ↓</button><div class="kit-books" id="kit${i}"><ol>${item.books.map(b=>`<li>${esc(b.title||"Untitled Book")}</li>`).join("")}</ol></div>`;html+=`<div class="selection-item"><div class="selection-main"><div><div class="selection-type">${item.type==="standard-kit"?"Standard Kit":isKit?"Custom Kit":"Book"}</div><h3 class="selection-title">${esc(title)}</h3>${meta?`<div class="selection-meta">${esc(meta)}</div>`:""}</div><div class="selection-quantity"><span>Quantity</span><strong>${Number(item.quantity)}</strong></div></div>${books}</div>`});return`<section class="review-card"><div class="card-heading"><h2>Your Selection</h2><a href="${withSource("order.html")}" class="edit-link">Edit Selection →</a></div>${html}</section>`}
function renderSummary(){const n=order.length,counts=selectionCounts(),parts=[];if(counts.copies)parts.push(`${counts.copies} individual ${counts.copies===1?"copy":"copies"}`);if(counts.kitSets)parts.push(`${counts.kitSets} kit ${counts.kitSets===1?"set":"sets"}`);return`<div class="request-summary"><div class="summary-top"><div class="summary-title">Requirement Summary</div><div class="summary-count"><strong>${n} ${n===1?"selection":"selections"}</strong><span>${parts.join(" · ")}</span></div></div><div class="summary-note">This is a requirement, not an order. Cambridge will review your selection, pricing and availability and contact you with the next steps.</div></div>`}
function renderActions(){return`<div class="request-notice"><strong>Please review before sending.</strong> Check the contact details, selected books and quantities above. You can edit either section using the relevant Edit action above without losing your saved information.</div><div class="review-actions"><button type="button" class="primary-button" id="sendRequestButton">Send Requirement →</button></div><div class="submission-status" id="submissionStatus" role="status" aria-live="polite"></div>`}
function render(){document.body.classList.remove("requirement-submitted");const p=document.getElementById("reviewPage");if(!validOrder()){p.innerHTML=`<div class="review-error"><h2>Your selection needs attention.</h2><p>Return to Your Selection and check the selected books and quantities.</p><a href="${withSource("order.html")}" class="secondary-button">Return to Selection</a></div>`;return}if(!validDetails()){p.innerHTML=`<div class="review-error"><h2>Your requirement details need attention.</h2><p>Return to Requirement Details and complete the required information.</p><a href="${withSource("request.html")}" class="secondary-button">Return to Requirement Details</a></div>`;return}p.innerHTML=renderDetails()+renderSelection()+renderSummary()+renderActions()}
function renderSuccess(reference){document.body.classList.add("requirement-submitted");document.getElementById("reviewPage").innerHTML=`<section class="success-card" aria-labelledby="successHeading"><div class="success-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="m5 12 4.2 4.2L19 6.8" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h2 id="successHeading">Requirement Submitted Successfully</h2><p class="success-message">Your requirement has been recorded with Cambridge Publishing Company Pvt. Ltd.<br>Our team will review the details and get in touch with you for further coordination.</p><div class="success-reference-panel"><div class="success-reference-copy"><p class="success-reference-label">YOUR REQUIREMENT REFERENCE</p><p class="success-reference">${esc(reference)}</p></div><button type="button" class="copy-reference" id="copyReferenceButton"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M5 15V5a2 2 0 0 1 2-2h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Copy Reference</button></div><p class="copy-reference-status" id="copyReferenceStatus" role="status" aria-live="polite"></p><p class="success-reminder">Please retain this reference number for future communication.</p><a href="${withSource("index.html")}" class="primary-button success-back">Back to Catalogue</a></section>`}
async function copyReference(reference){const status=document.getElementById("copyReferenceStatus");if(!navigator.clipboard||typeof navigator.clipboard.writeText!=="function"){if(status)status.textContent="Unable to copy automatically. Please select and copy the reference manually.";return}try{await navigator.clipboard.writeText(reference);if(status)status.textContent="Reference copied."}catch(error){if(status)status.textContent="Unable to copy automatically. Please select and copy the reference manually."}}
async function sendRequest(){if(submitting)return;const button=document.getElementById("sendRequestButton"),status=document.getElementById("submissionStatus");if(!button||!status)return;submitting=true;button.disabled=true;button.textContent="Sending requirement…";status.textContent="";try{if(!window.CambridgeRequestSubmission||typeof window.CambridgeRequestSubmission.submitLive!=="function")throw new Error("Submission service is unavailable. Please try again.");const result=await window.CambridgeRequestSubmission.submitLive();window.CambridgeRequestSubmission.clearSubmittedDraft();renderSuccess(result.reference)}catch(error){status.textContent=error&&error.message?error.message:"We could not submit your requirement. Please try again.";button.textContent="Send Requirement →";button.disabled=false;submitting=false}}
document.getElementById("reviewPage").addEventListener("click",e=>{const b=e.target.closest(".view-books");if(b){const box=document.getElementById("kit"+b.dataset.kit),open=box.classList.toggle("visible");b.textContent=open?"Hide books ↑":"View books ↓";return}if(e.target.closest("#copyReferenceButton")){const reference=document.querySelector(".success-reference")?.textContent||"";copyReference(reference);return}if(e.target.closest("#sendRequestButton"))sendRequest()});loadData();render();
</script></body></html>
