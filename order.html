<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Your Selection | Cambridge Digital Catalogue
</title>

<link
    rel="stylesheet"
    href="css/catalogue.css"
>


<style>

.order-hero{
    padding:45px 6% 30px;
    background:#fff;
}

.order-wrap,
.order-section{
    max-width:1050px;
    margin:auto;
}

.back-link{
    display:inline-block;
    margin-bottom:20px;
    color:var(--navy);
    text-decoration:none;
    font-size:12px;
    font-weight:700;
}

.order-hero h1{
    margin:0;
    font-size:clamp(34px,5vw,50px);
    letter-spacing:-1.5px;
}

.order-intro{
    margin:10px 0 0;
    color:var(--muted);
    font-size:13px;
}


/* SELECTION */

.order-section{
    padding:30px 6% 60px;
}

.order-card{
    margin-bottom:14px;
    padding:22px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:12px;
}

.order-main{
    display:grid;
    grid-template-columns:1fr auto auto;
    gap:25px;
    align-items:center;
}

.item-label{
    margin-bottom:5px;
    color:var(--muted);
    font-size:10px;
    font-weight:750;
    letter-spacing:.8px;
    text-transform:uppercase;
}

.item-title{
    margin:0;
    font-size:17px;
}

.item-meta{
    margin-top:6px;
    color:var(--muted);
    font-size:11px;
}


/* QUANTITY */

.quantity-area{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.quantity{
    display:flex;
    align-items:center;
    gap:8px;
}

.quantity button{
    width:36px;
    height:36px;
    padding:0;

    border:1px solid var(--border);
    border-radius:7px;

    background:#fff;

    cursor:pointer;

    font-size:17px;

    touch-action:manipulation;
}

.quantity button:hover{
    background:#f7f8fa;
}

.quantity-input{
    width:78px;
    height:36px;

    box-sizing:border-box;

    border:1px solid var(--border);
    border-radius:7px;

    background:#fff;

    text-align:center;

    font-size:14px;
    font-weight:750;

    outline:none;
}

.quantity-input:focus{
    border-color:var(--navy);
}

.quantity-input.invalid{
    border-color:#b84646;
    background:#fff8f8;
}

.quantity-error{
    min-height:15px;
    margin-top:5px;

    color:#a33b3b;

    font-size:10px;
    font-weight:650;

    text-align:center;
}


/* ACTIONS */

.remove-button{
    padding:8px 10px;

    border:0;

    background:transparent;

    color:#8b3b3b;

    cursor:pointer;

    font-size:11px;
    font-weight:700;

    touch-action:manipulation;
}

.clear-order-button{
    padding:13px 18px;

    border:1px solid #d8bcbc;
    border-radius:8px;

    background:#fff;

    color:#8b3b3b;

    cursor:pointer;

    font-size:12px;
    font-weight:750;

    touch-action:manipulation;
}

.clear-order-button:hover{
    background:#fff7f7;
}


/* KIT */

.view-books{
    margin-top:15px;
    padding:0;

    border:0;

    background:transparent;

    color:var(--navy);

    cursor:pointer;

    font-size:11px;
    font-weight:750;
}

.kit-books{
    display:none;

    margin-top:16px;
    padding:16px 18px;

    background:#f7f8fa;

    border-radius:8px;
}

.kit-books.visible{
    display:block;
}

.kit-books ol{
    margin:0;
    padding-left:20px;
}

.kit-books li{
    margin:6px 0;

    color:#555f6b;

    font-size:11px;
}


/* EMPTY */

.empty-order{
    padding:60px 20px;

    text-align:center;

    background:#fff;

    border:1px solid var(--border);
    border-radius:12px;
}

.empty-order h2{
    margin:0 0 8px;
}

.empty-order p{
    margin:0 0 25px;

    color:var(--muted);

    font-size:13px;
}


/* SUMMARY */

.order-summary{
    margin-top:25px;
    padding:22px;

    background:var(--navy);
    color:#fff;

    border-radius:12px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    gap:20px;
}

.summary-row strong{
    font-size:18px;
}

.summary-note{
    margin-top:7px;

    color:rgba(255,255,255,.65);

    font-size:11px;
    line-height:1.5;
}


/* FOOT ACTIONS */

.order-actions{
    margin-top:18px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:12px;
}

.order-actions-left{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.continue-button,
.checkout-button{
    padding:13px 20px;

    border-radius:8px;

    text-decoration:none;

    font-size:12px;
    font-weight:750;

    text-align:center;
}

.continue-button{
    border:1px solid var(--border);

    background:#fff;

    color:var(--navy);
}

.checkout-button{
    border:0;

    background:var(--navy);

    color:#fff;

    cursor:pointer;

    touch-action:manipulation;
}


/* MOBILE */

@media(max-width:650px){

    .order-hero{
        padding:35px 18px 25px;
    }

    .order-section{
        padding:25px 18px 45px;
    }

    .order-card{
        padding:17px;
    }

    .order-main{
        grid-template-columns:1fr;
        gap:15px;
    }

    .quantity-area{
        align-items:flex-start;
    }

    .quantity-error{
        text-align:left;
    }

    .remove-button{
        padding-left:0;
        text-align:left;
    }

    .order-actions{
        flex-direction:column;
        align-items:stretch;
    }

    .order-actions-left{
        display:grid;
        grid-template-columns:1fr 1fr;
    }

    .continue-button,
    .clear-order-button,
    .checkout-button{
        width:100%;
        box-sizing:border-box;
    }

}

</style>

</head>


<body>


<header class="catalogue-header">

    <div class="brand">

        <div class="brand-name">
            CAMBRIDGE
        </div>

        <div class="brand-company">
            PUBLISHING COMPANY PVT. LTD.
        </div>

    </div>

    <div class="catalogue-year">
        DIGITAL CATALOGUE · 2026–27
    </div>

</header>


<section class="order-hero">

    <div class="order-wrap">

        <a
            href="index.html"
            class="back-link"
        >
            ← Continue browsing catalogue
        </a>


        <p class="eyebrow">
            YOUR SELECTION
        </p>


        <h1>
            Your Selection
        </h1>


        <p class="order-intro">
            Review the books and kits you have selected
            before sending an order request.
        </p>

    </div>

</section>


<main class="order-section">

    <div id="orderItems"></div>

    <div id="orderSummary"></div>

</main>


<script>

/* ========================================
   SETTINGS
======================================== */

const ORDER_KEY =
    "cambridgeOrder";

const ORDER_UPDATED_KEY =
    "cambridgeOrderUpdatedAt";

const MIN_ORDER_QUANTITY = 1;
const MAX_ORDER_QUANTITY = 10000;


/* ========================================
   LOAD SELECTION
======================================== */

let order = [];


try{

    const stored =
        JSON.parse(
            localStorage.getItem(
                ORDER_KEY
            ) || "[]"
        );


    if(Array.isArray(stored)){
        order = stored;
    }

}catch(error){

    console.error(
        "Unable to read selection.",
        error
    );

}


/* ========================================
   NORMALISE STORED DATA
======================================== */

order = order.filter(
    item =>
        item &&
        typeof item === "object"
);


order.forEach(item => {

    const quantity =
        Number(item.quantity);


    if(
        !Number.isInteger(quantity) ||
        quantity < MIN_ORDER_QUANTITY ||
        quantity > MAX_ORDER_QUANTITY
    ){

        item.quantity = 1;

    }

});


/* ========================================
   SAVE SELECTION
======================================== */

function saveOrder(){

    /*
       Defensive rule:

       Normal edits never silently write an
       accidental empty selection.

       Explicit Clear Selection and removing
       the final item handle empty state
       themselves.
    */

    if(!Array.isArray(order)){
        return false;
    }


    try{

        localStorage.setItem(
            ORDER_KEY,
            JSON.stringify(order)
        );


        localStorage.setItem(
            ORDER_UPDATED_KEY,
            String(Date.now())
        );


        return true;

    }catch(error){

        console.error(
            "Unable to save selection.",
            error
        );


        return false;

    }

}


/* ========================================
   ESCAPE HTML
======================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* ========================================
   RENDER
======================================== */

function renderOrder(){

    const itemsContainer =
        document.getElementById(
            "orderItems"
        );


    const summaryContainer =
        document.getElementById(
            "orderSummary"
        );


    itemsContainer.innerHTML = "";

    summaryContainer.innerHTML = "";


    if(order.length === 0){

        itemsContainer.innerHTML = `

            <div class="empty-order">

                <h2>
                    Your selection is empty.
                </h2>

                <p>
                    Browse the catalogue and add books
                    or kits to start your selection.
                </p>

                <a
                    href="index.html"
                    class="continue-button"
                >
                    Browse Catalogue →
                </a>

            </div>

        `;


        return;

    }


    order.forEach(
        (item,index) => {

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "order-card";


            const title =
                item.title ||
                (
                    item.levelName
                    ? item.levelName +
                      " Custom Kit"
                    : "Selected Item"
                );


            let meta = "";


            if(item.type === "custom-kit"){

                const count =
                    Array.isArray(item.books)
                    ? item.books.length
                    : Number(item.bookCount) || 0;


                meta =
                    count +
                    (
                        count === 1
                        ? " book in this kit"
                        : " books in this kit"
                    );

            }else if(item.levelName){

                meta =
                    item.levelName;

            }


            card.innerHTML = `

                <div class="order-main">

                    <div>

                        <div class="item-label">

                            ${
                                item.type ===
                                "custom-kit"
                                ? "Custom Kit"
                                : "Book"
                            }

                        </div>


                        <h2 class="item-title">
                            ${escapeHTML(title)}
                        </h2>


                        <div class="item-meta">
                            ${escapeHTML(meta)}
                        </div>

                    </div>


                    <div class="quantity-area">

                        <div class="quantity">

                            <button
                                type="button"
                                data-action="decrease"
                                data-index="${index}"
                                aria-label="Decrease quantity"
                            >
                                −
                            </button>


                            <input
                                type="text"
                                class="quantity-input"
                                data-index="${index}"
                                value="${item.quantity}"
                                inputmode="numeric"
                                pattern="[0-9]*"
                                autocomplete="off"
                                enterkeyhint="done"
                                aria-label="Quantity"
                            >


                            <button
                                type="button"
                                data-action="increase"
                                data-index="${index}"
                                aria-label="Increase quantity"
                            >
                                +
                            </button>

                        </div>


                        <div
                            class="quantity-error"
                            id="quantity-error-${index}"
                            aria-live="polite"
                        ></div>

                    </div>


                    <button
                        type="button"
                        class="remove-button"
                        data-action="remove"
                        data-index="${index}"
                    >
                        Remove
                    </button>

                </div>

            `;


            /* KIT CONTENTS */

            if(
                item.type === "custom-kit" &&
                Array.isArray(item.books) &&
                item.books.length > 0
            ){

                const viewButton =
                    document.createElement(
                        "button"
                    );


                viewButton.type =
                    "button";


                viewButton.className =
                    "view-books";


                viewButton.textContent =
                    "View books ↓";


                const booksBox =
                    document.createElement(
                        "div"
                    );


                booksBox.className =
                    "kit-books";


                const list =
                    document.createElement(
                        "ol"
                    );


                item.books.forEach(
                    book => {

                        const li =
                            document.createElement(
                                "li"
                            );


                        li.textContent =
                            book.title ||
                            "Untitled Book";


                        list.appendChild(li);

                    }
                );


                booksBox.appendChild(list);


                viewButton.addEventListener(
                    "click",
                    () => {

                        const open =
                            booksBox
                            .classList
                            .toggle(
                                "visible"
                            );


                        viewButton.textContent =
                            open
                            ? "Hide books ↑"
                            : "View books ↓";

                    }
                );


                card.appendChild(
                    viewButton
                );


                card.appendChild(
                    booksBox
                );

            }


            itemsContainer.appendChild(
                card
            );

        }
    );


    renderSummary();

}


/* ========================================
   QUANTITY UI
======================================== */

function getQuantityInput(index){

    return document.querySelector(
        `.quantity-input[data-index="${index}"]`
    );

}


function getQuantityError(index){

    return document.getElementById(
        `quantity-error-${index}`
    );

}


function showQuantityError(
    index,
    message
){

    const input =
        getQuantityInput(index);


    const error =
        getQuantityError(index);


    if(input){

        input.classList.add(
            "invalid"
        );

    }


    if(error){

        error.textContent =
            message;

    }

}


function clearQuantityError(index){

    const input =
        getQuantityInput(index);


    const error =
        getQuantityError(index);


    if(input){

        input.classList.remove(
            "invalid"
        );

    }


    if(error){

        error.textContent = "";

    }

}


/* ========================================
   QUANTITY INPUT SANITISING
======================================== */

function cleanQuantityText(value){

    return String(value || "")
        .replace(/\D/g,"");

}


/* ========================================
   COMMIT MANUAL QUANTITY
======================================== */

function processQuantityTyping(input){

    const index =
        Number(
            input.dataset.index
        );


    if(
        !Number.isInteger(index) ||
        !order[index]
    ){

        return;

    }


    let cleaned =
        cleanQuantityText(
            input.value
        );


    /*
       Protect pasted/typed giant values.

       We allow only enough characters to
       represent 10,000.
    */

    if(cleaned.length > 5){

        input.value =
            String(
                order[index].quantity
            );


        showQuantityError(
            index,
            "Maximum quantity is 10,000."
        );


        return;

    }


    input.value =
        cleaned;


    /*
       Empty input is only a temporary
       editing state.

       IMPORTANT:
       We do NOT modify order[].
    */

    if(cleaned === ""){

        showQuantityError(
            index,
            "Enter a quantity from 1 to 10,000."
        );


        return;

    }


    const quantity =
        Number(cleaned);


    if(
        !Number.isInteger(quantity) ||
        quantity < MIN_ORDER_QUANTITY
    ){

        showQuantityError(
            index,
            "Minimum quantity is 1."
        );


        return;

    }


    if(
        quantity >
        MAX_ORDER_QUANTITY
    ){

        /*
           Restore last valid quantity.

           Nothing invalid is ever written
           to the stored selection.
        */

        input.value =
            String(
                order[index].quantity
            );


        showQuantityError(
            index,
            "Maximum quantity is 10,000."
        );


        return;

    }


    /*
       VALID VALUE

       Only now do we update the actual
       saved selection.
    */

    order[index].quantity =
        quantity;


    clearQuantityError(
        index
    );


    saveOrder();


    updateSummary();

}


/* ========================================
   FINALISE QUANTITY

   Used only by Enter/Done where supported.

   No blur/click-away handler exists.
======================================== */

function finaliseQuantity(input){

    const index =
        Number(
            input.dataset.index
        );


    if(
        !Number.isInteger(index) ||
        !order[index]
    ){

        return;

    }


    const cleaned =
        cleanQuantityText(
            input.value
        );


    const quantity =
        Number(cleaned);


    if(
        cleaned === "" ||
        !Number.isInteger(quantity) ||
        quantity < MIN_ORDER_QUANTITY ||
        quantity > MAX_ORDER_QUANTITY
    ){

        input.value =
            String(
                order[index].quantity
            );


        showQuantityError(
            index,
            "Enter a quantity from 1 to 10,000."
        );


        return;

    }


    input.value =
        String(quantity);


    order[index].quantity =
        quantity;


    clearQuantityError(
        index
    );


    saveOrder();


    updateSummary();

}


/* ========================================
   PLUS / MINUS
======================================== */

function changeQuantity(
    index,
    change
){

    const item =
        order[index];


    if(!item){
        return;
    }


    const current =
        Number(item.quantity) || 1;


    const next =
        current + change;


    if(
        next >
        MAX_ORDER_QUANTITY
    ){

        const input =
            getQuantityInput(index);


        if(input){

            input.value =
                String(current);

        }


        showQuantityError(
            index,
            "Maximum quantity is 10,000."
        );


        return;

    }


    if(
        next <
        MIN_ORDER_QUANTITY
    ){

        const input =
            getQuantityInput(index);


        if(input){

            input.value =
                String(current);

        }


        showQuantityError(
            index,
            "Minimum quantity is 1."
        );


        return;

    }


    item.quantity =
        next;


    const input =
        getQuantityInput(index);


    if(input){

        input.value =
            String(next);

    }


    clearQuantityError(
        index
    );


    saveOrder();


    updateSummary();

}


/* ========================================
   REMOVE
======================================== */

function removeItem(index){

    if(
        !Number.isInteger(index) ||
        !order[index]
    ){

        return;

    }


    order.splice(
        index,
        1
    );


    saveOrder();


    renderOrder();

}


/* ========================================
   EVENT DELEGATION

   One event system is more reliable than
   repeatedly attaching handlers to every
   element after rendering.
======================================== */

document
    .getElementById(
        "orderItems"
    )
    .addEventListener(
        "input",
        event => {

            const input =
                event.target.closest(
                    ".quantity-input"
                );


            if(!input){
                return;
            }


            processQuantityTyping(
                input
            );

        }
    );


document
    .getElementById(
        "orderItems"
    )
    .addEventListener(
        "keydown",
        event => {

            const input =
                event.target.closest(
                    ".quantity-input"
                );


            if(!input){
                return;
            }


            if(
                event.key === "-" ||
                event.key === "+" ||
                event.key === "." ||
                event.key === "e" ||
                event.key === "E"
            ){

                event.preventDefault();

                return;

            }


            if(event.key === "Enter"){

                event.preventDefault();


                finaliseQuantity(
                    input
                );


                input.blur();

            }

        }
    );


document
    .getElementById(
        "orderItems"
    )
    .addEventListener(
        "click",
        event => {

            const button =
                event.target.closest(
                    "[data-action]"
                );


            if(!button){
                return;
            }


            event.preventDefault();


            const index =
                Number(
                    button.dataset.index
                );


            const action =
                button.dataset.action;


/* ========================================
   EVENT DELEGATION

   Cross-platform protection for:
   Android
   iOS / iPadOS
   Desktop browsers
======================================== */


/*
   REMOVE BUTTON SAFETY

   A normal click/tap on Remove must first
   begin on the Remove button itself.

   This prevents a mobile keyboard closing,
   viewport movement or a "ghost click"
   from accidentally deleting an item.
*/

let armedRemoveIndex = null;
let armedRemoveTime = 0;

const REMOVE_ARM_TIMEOUT = 1500;


const orderItemsContainer =
    document.getElementById(
        "orderItems"
    );


/* ========================================
   POINTER DOWN

   Remember whether an actual physical
   tap/click started on a Remove button.
======================================== */

orderItemsContainer.addEventListener(
    "pointerdown",
    event => {

        const removeButton =
            event.target.closest(
                '[data-action="remove"]'
            );


        if(!removeButton){

            armedRemoveIndex = null;
            armedRemoveTime = 0;

            return;

        }


        const index =
            Number(
                removeButton.dataset.index
            );


        if(
            !Number.isInteger(index) ||
            !order[index]
        ){

            armedRemoveIndex = null;
            armedRemoveTime = 0;

            return;

        }


        armedRemoveIndex =
            index;


        armedRemoveTime =
            Date.now();

    }
);


/* ========================================
   POINTER CANCEL

   Cancel any pending Remove action.
======================================== */

orderItemsContainer.addEventListener(
    "pointercancel",
    () => {

        armedRemoveIndex = null;
        armedRemoveTime = 0;

    }
);


/* ========================================
   QUANTITY INPUT
======================================== */

orderItemsContainer.addEventListener(
    "input",
    event => {

        const input =
            event.target.closest(
                ".quantity-input"
            );


        if(!input){
            return;
        }


        processQuantityTyping(
            input
        );

    }
);


/* ========================================
   QUANTITY KEYBOARD

   Desktop Enter and mobile browsers
   that expose Enter / Done.
======================================== */

orderItemsContainer.addEventListener(
    "keydown",
    event => {

        const input =
            event.target.closest(
                ".quantity-input"
            );


        if(!input){
            return;
        }


        /*
           Prevent unsupported quantity
           characters on physical keyboards.
        */

        if(
            event.key === "-" ||
            event.key === "+" ||
            event.key === "." ||
            event.key === "e" ||
            event.key === "E"
        ){

            event.preventDefault();

            return;

        }


        if(event.key === "Enter"){

            event.preventDefault();


            finaliseQuantity(
                input
            );


            input.blur();

        }

    }
);


/* ========================================
   CLICK ACTIONS
======================================== */

orderItemsContainer.addEventListener(
    "click",
    event => {

        const button =
            event.target.closest(
                "[data-action]"
            );


        if(!button){
            return;
        }


        const index =
            Number(
                button.dataset.index
            );


        if(
            !Number.isInteger(index) ||
            !order[index]
        ){

            return;

        }


        const action =
            button.dataset.action;


        /* -------------------------------
           PLUS
        -------------------------------- */

        if(action === "increase"){

            event.preventDefault();


            changeQuantity(
                index,
                1
            );


            return;

        }


        /* -------------------------------
           MINUS
        -------------------------------- */

        if(action === "decrease"){

            event.preventDefault();


            changeQuantity(
                index,
                -1
            );


            return;

        }


        /* -------------------------------
           REMOVE

           This is deliberately stricter
           because it is destructive.
        -------------------------------- */

        if(action === "remove"){

            event.preventDefault();


            /*
               Desktop keyboard accessibility:

               A keyboard-triggered button click
               normally has detail === 0.

               We allow that without requiring
               pointerdown.
            */

            const keyboardActivation =
                event.detail === 0;


            /*
               Mouse / touch / pen:

               Removal is permitted only if the
               physical pointer originally went
               down on this exact Remove button.
            */

            const pointerActivation =
                armedRemoveIndex === index &&
                (
                    Date.now() -
                    armedRemoveTime
                ) <= REMOVE_ARM_TIMEOUT;


            /*
               Clear the armed state immediately
               whether accepted or rejected.
            */

            armedRemoveIndex = null;
            armedRemoveTime = 0;


            if(
                !keyboardActivation &&
                !pointerActivation
            ){

                /*
                   Ignore ghost / shifted click.

                   Most importantly:
                   DO NOT modify order[]
                   DO NOT save localStorage
                   DO NOT renderOrder()
                */

                return;

            }


            removeItem(
                index
            );

        }

    }
);


/* ========================================
   IMPORTANT

   We deliberately DO NOT attach any
   destructive action to:

   blur
   focusout
   document click
   body click
   touchend
   pointerup
   keyboard closing
   viewport resize

   Therefore tapping/clicking the grey
   background can never remove a selection.
======================================== */


/* ========================================
   TOTAL QUANTITY
======================================== */

function getTotalQuantity(){

    return order.reduce(
        (total,item) => {

            const quantity =
                Number(
                    item.quantity
                );


            if(
                Number.isInteger(quantity) &&
                quantity >=
                MIN_ORDER_QUANTITY &&
                quantity <=
                MAX_ORDER_QUANTITY
            ){

                return (
                    total +
                    quantity
                );

            }


            return total;

        },
        0
    );

}


/* ========================================
   SUMMARY
======================================== */

function renderSummary(){

    const container =
        document.getElementById(
            "orderSummary"
        );


    if(order.length === 0){

        container.innerHTML = "";

        return;

    }


    const lines =
        order.length;


    const quantity =
        getTotalQuantity();


    container.innerHTML = `

        <div class="order-summary">

            <div class="summary-row">

                <span>
                    Selection Summary
                </span>

                <strong
                    id="totalQuantity"
                >
                    ${quantity}
                    ${
                        quantity === 1
                        ? "item"
                        : "items"
                    }
                </strong>

            </div>


            <div class="summary-note">

                ${lines}
                ${
                    lines === 1
                    ? "selection"
                    : "selections"
                }
                in your request.

                This is an order request,
                not a confirmed order.

                Pricing and availability
                will be confirmed by Cambridge.

            </div>

        </div>


        <div class="order-actions">

            <div class="order-actions-left">

                <a
                    href="index.html"
                    class="continue-button"
                >
                    ← Continue Browsing
                </a>


                <button
                    type="button"
                    class="clear-order-button"
                    id="clearOrderButton"
                >
                    Clear Selection
                </button>

            </div>


            <button
                type="button"
                class="checkout-button"
                id="proceedButton"
            >
                Continue to Request →
            </button>

        </div>

    `;

}


/* ========================================
   SUMMARY EVENTS
======================================== */

document
    .getElementById(
        "orderSummary"
    )
    .addEventListener(
        "click",
        event => {

            if(
                event.target.closest(
                    "#clearOrderButton"
                )
            ){

                clearOrder();

                return;

            }


            if(
                event.target.closest(
                    "#proceedButton"
                )
            ){

                proceedToRequest();

            }

        }
    );


/* ========================================
   UPDATE SUMMARY ONLY
======================================== */

function updateSummary(){

    const total =
        document.getElementById(
            "totalQuantity"
        );


    if(!total){
        return;
    }


    const quantity =
        getTotalQuantity();


    total.textContent =
        quantity +
        (
            quantity === 1
            ? " item"
            : " items"
        );

}


/* ========================================
   CLEAR SELECTION
======================================== */

function clearOrder(){

    const confirmed =
        confirm(
            "Clear all items from this selection?\n\n" +
            "This cannot be undone."
        );


    if(!confirmed){
        return;
    }


    order = [];


    try{

        localStorage.removeItem(
            ORDER_KEY
        );


        localStorage.removeItem(
            ORDER_UPDATED_KEY
        );

    }catch(error){

        console.error(
            "Unable to clear selection.",
            error
        );

    }


    renderOrder();

}


/* ========================================
   CONTINUE
======================================== */

function proceedToRequest(){

    if(order.length === 0){
        return;
    }


    /*
       Before continuing, guarantee that
       each stored quantity is valid.
    */

    const valid =
        order.every(
            item => {

                const quantity =
                    Number(
                        item.quantity
                    );


                return (
                    Number.isInteger(
                        quantity
                    ) &&
                    quantity >=
                    MIN_ORDER_QUANTITY &&
                    quantity <=
                    MAX_ORDER_QUANTITY
                );

            }
        );


    if(!valid){
        return;
    }


    saveOrder();


    window.location.href =
        "request-details.html";

}


/* ========================================
   START
======================================== */

renderOrder();

</script>
