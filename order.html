<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Your Selection | Cambridge Digital Catalogue
</title>

<link
    rel="stylesheet"
    href="css/catalogue.css"
>


<style>

.order-hero{
    padding:45px 6% 30px;
    background:#fff;
}

.order-wrap,
.order-section{
    max-width:1050px;
    margin:auto;
}

.back-link{
    display:inline-block;
    margin-bottom:20px;

    color:var(--navy);

    text-decoration:none;

    font-size:12px;
    font-weight:700;
}

.order-hero h1{
    margin:0;

    font-size:clamp(34px,5vw,50px);

    letter-spacing:-1.5px;
}

.order-intro{
    margin:10px 0 0;

    color:var(--muted);

    font-size:13px;
    line-height:1.5;
}


/* ========================================
   SELECTION
======================================== */

.order-section{
    padding:30px 6% 60px;
}

.order-card{
    margin-bottom:14px;
    padding:22px;

    background:#fff;

    border:1px solid var(--border);
    border-radius:12px;
}

.order-main{
    display:grid;

    grid-template-columns:
        1fr auto auto;

    gap:25px;

    align-items:center;
}

.item-label{
    margin-bottom:5px;

    color:var(--muted);

    font-size:10px;
    font-weight:750;

    letter-spacing:.8px;

    text-transform:uppercase;
}

.item-title{
    margin:0;

    font-size:17px;
}

.item-meta{
    margin-top:6px;

    color:var(--muted);

    font-size:11px;
}


/* ========================================
   QUANTITY
======================================== */

.quantity-area{
    display:flex;

    flex-direction:column;

    align-items:center;
}

.quantity{
    display:flex;

    align-items:center;

    gap:8px;
}

.quantity button{
    width:36px;
    height:36px;

    padding:0;

    border:1px solid var(--border);
    border-radius:7px;

    background:#fff;

    cursor:pointer;

    font-size:17px;

    touch-action:manipulation;
}

.quantity button:hover{
    background:#f7f8fa;
}

.quantity-input{
    width:80px;
    height:36px;

    box-sizing:border-box;

    border:1px solid var(--border);
    border-radius:7px;

    background:#fff;

    text-align:center;

    font-size:14px;
    font-weight:750;

    outline:none;
}

.quantity-input:focus{
    border-color:var(--navy);
}

.quantity-input.invalid{
    border-color:#b84646;
    background:#fff8f8;
}

.quantity-error{
    min-height:15px;

    margin-top:5px;

    color:#a33b3b;

    font-size:10px;
    font-weight:650;

    text-align:center;

    white-space:nowrap;
}


/* ========================================
   REMOVE
======================================== */

.remove-button{
    padding:8px 10px;

    border:0;

    background:transparent;

    color:#8b3b3b;

    cursor:pointer;

    font-size:11px;
    font-weight:700;

    touch-action:manipulation;
}


/* ========================================
   KIT BOOKS
======================================== */

.view-books{
    margin-top:15px;

    padding:0;

    border:0;

    background:transparent;

    color:var(--navy);

    cursor:pointer;

    font-size:11px;
    font-weight:750;

    touch-action:manipulation;
}

.kit-books{
    display:none;

    margin-top:16px;

    padding:16px 18px;

    background:#f7f8fa;

    border-radius:8px;
}

.kit-books.visible{
    display:block;
}

.kit-books ol{
    margin:0;

    padding-left:20px;
}

.kit-books li{
    margin:6px 0;

    color:#555f6b;

    font-size:11px;
}


/* ========================================
   EMPTY SELECTION
======================================== */

.empty-order{
    padding:60px 20px;

    text-align:center;

    background:#fff;

    border:1px solid var(--border);
    border-radius:12px;
}

.empty-order h2{
    margin:0 0 8px;
}

.empty-order p{
    margin:0 0 25px;

    color:var(--muted);

    font-size:13px;
}


/* ========================================
   SUMMARY
======================================== */

.order-summary{
    margin-top:25px;

    padding:22px;

    background:var(--navy);

    color:#fff;

    border-radius:12px;
}

.summary-row{
    display:flex;

    justify-content:space-between;

    gap:20px;
}

.summary-row strong{
    font-size:18px;
}

.summary-note{
    margin-top:7px;

    color:rgba(255,255,255,.65);

    font-size:11px;
    line-height:1.5;
}


/* ========================================
   BOTTOM ACTIONS
======================================== */

.order-actions{
    margin-top:18px;

    display:flex;

    justify-content:space-between;
    align-items:center;

    gap:12px;
}

.order-actions-left{
    display:flex;

    gap:10px;

    flex-wrap:wrap;
}

.continue-button,
.clear-order-button,
.checkout-button{
    padding:13px 20px;

    border-radius:8px;

    font-size:12px;
    font-weight:750;

    text-align:center;

    touch-action:manipulation;
}

.continue-button{
    border:1px solid var(--border);

    background:#fff;

    color:var(--navy);

    text-decoration:none;
}

.clear-order-button{
    border:1px solid #d8bcbc;

    background:#fff;

    color:#8b3b3b;

    cursor:pointer;
}

.checkout-button{
    border:0;

    background:var(--navy);

    color:#fff;

    cursor:pointer;
}


/* ========================================
   MOBILE
======================================== */

@media(max-width:650px){

    .order-hero{
        padding:35px 18px 25px;
    }

    .order-section{
        padding:25px 18px 45px;
    }

    .order-card{
        padding:17px;
    }

    .order-main{
        grid-template-columns:1fr;

        gap:15px;
    }

    .quantity-area{
        align-items:flex-start;
    }

    .quantity-error{
        text-align:left;
    }

    .remove-button{
        padding-left:0;

        text-align:left;
    }

    .order-actions{
        flex-direction:column;

        align-items:stretch;
    }

    .order-actions-left{
        display:grid;

        grid-template-columns:1fr 1fr;
    }

    .continue-button,
    .clear-order-button,
    .checkout-button{
        width:100%;

        box-sizing:border-box;
    }

}

</style>

</head>


<body>


<header class="catalogue-header">

    <div class="brand">

        <div class="brand-name">
            CAMBRIDGE
        </div>

        <div class="brand-company">
            PUBLISHING COMPANY PVT. LTD.
        </div>

    </div>


    <div class="catalogue-year">
        DIGITAL CATALOGUE · 2026–27
    </div>

</header>


<section class="order-hero">

    <div class="order-wrap">

        <a
            href="index.html"
            class="back-link"
        >
            ← Continue browsing catalogue
        </a>


        <p class="eyebrow">
            YOUR SELECTION
        </p>


        <h1>
            Your Selection
        </h1>


        <p class="order-intro">
            Review the books and kits you have selected
            before sending an order request.
        </p>

    </div>

</section>


<main class="order-section">

    <div id="orderItems"></div>

    <div id="orderSummary"></div>

</main>


<script>

/* ========================================
   CONSTANTS
======================================== */

const ORDER_KEY =
    "cambridgeOrder";

const ORDER_UPDATED_KEY =
    "cambridgeOrderUpdatedAt";

const MIN_QUANTITY = 1;

const MAX_QUANTITY = 10000;


/* ========================================
   LOAD ORDER
======================================== */

let order = [];


function loadOrder(){

    try{

        const stored =
            JSON.parse(
                localStorage.getItem(
                    ORDER_KEY
                ) || "[]"
            );


        if(Array.isArray(stored)){

            order =
                stored.filter(
                    item =>
                        item &&
                        typeof item === "object"
                );

        }else{

            order = [];

        }

    }catch(error){

        console.error(
            "Unable to load selection.",
            error
        );


        order = [];

    }


    /*
       Repair only invalid quantities.

       Never delete an item simply because
       its quantity data is malformed.
    */

    order.forEach(
        item => {

            const quantity =
                Number(
                    item.quantity
                );


            if(
                !Number.isInteger(quantity) ||
                quantity < MIN_QUANTITY ||
                quantity > MAX_QUANTITY
            ){

                item.quantity = 1;

            }

        }
    );

}


/* ========================================
   SAVE ORDER
======================================== */

function saveOrder(){

    try{

        localStorage.setItem(
            ORDER_KEY,
            JSON.stringify(order)
        );


        localStorage.setItem(
            ORDER_UPDATED_KEY,
            String(Date.now())
        );


        return true;

    }catch(error){

        console.error(
            "Unable to save selection.",
            error
        );


        return false;

    }

}


/* ========================================
   SAFE DISPLAY TEXT
======================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* ========================================
   QUANTITY TOTAL
======================================== */

function getTotalQuantity(){

    return order.reduce(
        (total,item) => {

            const quantity =
                Number(
                    item.quantity
                );


            if(
                Number.isInteger(quantity) &&
                quantity >= MIN_QUANTITY &&
                quantity <= MAX_QUANTITY
            ){

                return total + quantity;

            }


            return total;

        },
        0
    );

}


/* ========================================
   RENDER ORDER
======================================== */

function renderOrder(){

    const itemsContainer =
        document.getElementById(
            "orderItems"
        );


    const summaryContainer =
        document.getElementById(
            "orderSummary"
        );


    itemsContainer.innerHTML = "";

    summaryContainer.innerHTML = "";


    /* EMPTY */

    if(order.length === 0){

        itemsContainer.innerHTML = `

            <div class="empty-order">

                <h2>
                    Your selection is empty.
                </h2>

                <p>
                    Browse the catalogue and add books
                    or kits to start your selection.
                </p>

                <a
                    href="index.html"
                    class="continue-button"
                >
                    Browse Catalogue →
                </a>

            </div>

        `;


        return;

    }


    /* ITEMS */

    order.forEach(
        (item,index) => {

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "order-card";


            const title =
                item.title ||
                (
                    item.levelName
                    ? item.levelName +
                      " Custom Kit"
                    : "Selected Item"
                );


            let meta = "";


            if(
                item.type ===
                "custom-kit"
            ){

                const count =
                    Array.isArray(
                        item.books
                    )
                    ? item.books.length
                    : Number(
                        item.bookCount
                      ) || 0;


                meta =
                    count +
                    (
                        count === 1
                        ? " book in this kit"
                        : " books in this kit"
                    );

            }else if(item.levelName){

                meta =
                    item.levelName;

            }


            card.innerHTML = `

                <div class="order-main">

                    <div>

                        <div class="item-label">

                            ${
                                item.type ===
                                "custom-kit"
                                ? "Custom Kit"
                                : "Book"
                            }

                        </div>


                        <h2 class="item-title">
                            ${escapeHTML(title)}
                        </h2>


                        <div class="item-meta">
                            ${escapeHTML(meta)}
                        </div>

                    </div>


                    <div class="quantity-area">

                        <div class="quantity">

                            <button
                                type="button"
                                class="quantity-minus"
                                data-index="${index}"
                                aria-label="Decrease quantity"
                            >
                                −
                            </button>


                            <input
                                type="text"
                                class="quantity-input"
                                data-index="${index}"
                                value="${item.quantity}"
                                inputmode="numeric"
                                pattern="[0-9]*"
                                autocomplete="off"
                                enterkeyhint="done"
                                aria-label="Quantity"
                            >


                            <button
                                type="button"
                                class="quantity-plus"
                                data-index="${index}"
                                aria-label="Increase quantity"
                            >
                                +
                            </button>

                        </div>


                        <div
                            class="quantity-error"
                            id="quantityError${index}"
                            aria-live="polite"
                        ></div>

                    </div>


                    <button
                        type="button"
                        class="remove-button"
                        data-index="${index}"
                    >
                        Remove
                    </button>

                </div>

            `;


            /*
               CUSTOM KIT BOOK LIST
            */

            if(
                item.type ===
                "custom-kit" &&
                Array.isArray(
                    item.books
                ) &&
                item.books.length > 0
            ){

                const viewButton =
                    document.createElement(
                        "button"
                    );


                viewButton.type =
                    "button";


                viewButton.className =
                    "view-books";


                viewButton.textContent =
                    "View books ↓";


                const booksBox =
                    document.createElement(
                        "div"
                    );


                booksBox.className =
                    "kit-books";


                const list =
                    document.createElement(
                        "ol"
                    );


                item.books.forEach(
                    book => {

                        const li =
                            document.createElement(
                                "li"
                            );


                        li.textContent =
                            book.title ||
                            "Untitled Book";


                        list.appendChild(
                            li
                        );

                    }
                );


                booksBox.appendChild(
                    list
                );


                viewButton.addEventListener(
                    "click",
                    () => {

                        const open =
                            booksBox.classList.toggle(
                                "visible"
                            );


                        viewButton.textContent =
                            open
                            ? "Hide books ↑"
                            : "View books ↓";

                    }
                );


                card.appendChild(
                    viewButton
                );


                card.appendChild(
                    booksBox
                );

            }


            itemsContainer.appendChild(
                card
            );

        }
    );


    renderSummary();

}


/* ========================================
   QUANTITY ERROR
======================================== */

function showQuantityError(
    index,
    message
){

    const input =
        document.querySelector(
            `.quantity-input[data-index="${index}"]`
        );


    const error =
        document.getElementById(
            "quantityError" +
            index
        );


    if(input){

        input.classList.add(
            "invalid"
        );

    }


    if(error){

        error.textContent =
            message;

    }

}


function clearQuantityError(index){

    const input =
        document.querySelector(
            `.quantity-input[data-index="${index}"]`
        );


    const error =
        document.getElementById(
            "quantityError" +
            index
        );


    if(input){

        input.classList.remove(
            "invalid"
        );

    }


    if(error){

        error.textContent = "";

    }

}


/* ========================================
   MANUAL QUANTITY INPUT
======================================== */

function handleQuantityInput(input){

    const index =
        Number(
            input.dataset.index
        );


    if(
        !Number.isInteger(index) ||
        !order[index]
    ){

        return;

    }


    /*
       Keep numbers only.
    */

    let value =
        String(input.value)
        .replace(/\D/g,"");


    input.value =
        value;


    /*
       Empty is allowed temporarily
       while the customer edits.

       DO NOT alter order[].
    */

    if(value === ""){

        showQuantityError(
            index,
            "Enter a quantity from 1 to 10,000."
        );


        return;

    }


    /*
       Huge pasted value.

       Do NOT save it.
       Do NOT alter the selection.
    */

    if(value.length > 5){

        showQuantityError(
            index,
            "Maximum quantity is 10,000."
        );


        return;

    }


    const quantity =
        Number(value);


    if(
        !Number.isInteger(quantity) ||
        quantity < MIN_QUANTITY
    ){

        showQuantityError(
            index,
            "Minimum quantity is 1."
        );


        return;

    }


    if(
        quantity >
        MAX_QUANTITY
    ){

        showQuantityError(
            index,
            "Maximum quantity is 10,000."
        );


        return;

    }


    /*
       VALID QUANTITY

function handleQuantityInput(input){

    const index =
        Number(input.dataset.index);


    if(
        !Number.isInteger(index) ||
        !order[index]
    ){
        return;
    }


    /*
       Remove anything except digits.
    */

    let value =
        String(input.value)
        .replace(/\D/g,"");


    /*
       Empty is allowed temporarily while
       the customer edits the quantity.

       The saved quantity is NOT changed.
    */

    if(value === ""){

        input.value = "";

        showQuantityError(
            index,
            "Enter a quantity from 1 to 10,000."
        );

        return;
    }


    const quantity =
        Number(value);


    /*
       Anything above 10,000 is rejected
       immediately.

       Restore the last VALID saved value.
       Never write the invalid value to order[].
    */

    if(
        value.length > 5 ||
        !Number.isSafeInteger(quantity) ||
        quantity > MAX_QUANTITY
    ){

        input.value =
            String(order[index].quantity);


        showQuantityError(
            index,
            "Maximum quantity allowed is 10,000."
        );

        return;
    }


    /*
       Quantity below 1 is invalid.

       Do not change the saved quantity.
    */

    if(quantity < MIN_QUANTITY){

        input.value = value;


        showQuantityError(
            index,
            "Minimum quantity is 1."
        );

        return;
    }


    /*
       VALID QUANTITY: 1–10,000

       Only valid values reach localStorage.
    */

    input.value =
        String(quantity);


    order[index].quantity =
        quantity;


    clearQuantityError(index);

    saveOrder();

    updateSummary();

}

/* ========================================
   FINALISE QUANTITY

   Safe on:
   Android
   iOS
   Desktop

   Blur never deletes/re-renders anything.
======================================== */

function finaliseQuantity(input){

    const index =
        Number(
            input.dataset.index
        );


    if(
        !Number.isInteger(index) ||
        !order[index]
    ){

        return;

    }


    const value =
        String(input.value)
        .replace(/\D/g,"");


    const quantity =
        Number(value);


    if(
        value === "" ||
        value.length > 5 ||
        !Number.isInteger(quantity) ||
        quantity < MIN_QUANTITY ||
        quantity > MAX_QUANTITY
    ){

        /*
           Restore the last valid saved
           quantity only in this input.

           NO renderOrder()
           NO splice()
           NO item deletion.
        */

        input.value =
            String(
                order[index].quantity
            );


        if(
            value !== "" &&
            Number(value) >
            MAX_QUANTITY
        ){

            showQuantityError(
                index,
                "Maximum quantity is 10,000."
            );

        }else{

            showQuantityError(
                index,
                "Enter a quantity from 1 to 10,000."
            );

        }


        return;

    }


    order[index].quantity =
        quantity;


    input.value =
        String(quantity);


    clearQuantityError(
        index
    );


    saveOrder();


    updateSummary();

}


/* ========================================
   PLUS / MINUS
======================================== */

function changeQuantity(
    index,
    difference
){

    if(
        !order[index]
    ){

        return;

    }


    const current =
        Number(
            order[index].quantity
        ) || 1;


    const next =
        current +
        difference;


    if(
        next >
        MAX_QUANTITY
    ){

        showQuantityError(
            index,
            "Maximum quantity is 10,000."
        );


        return;

    }


    if(
        next <
        MIN_QUANTITY
    ){

        showQuantityError(
            index,
            "Minimum quantity is 1."
        );


        return;

    }


    order[index].quantity =
        next;


    const input =
        document.querySelector(
            `.quantity-input[data-index="${index}"]`
        );


    if(input){

        input.value =
            String(next);

    }


    clearQuantityError(
        index
    );


    saveOrder();


    updateSummary();

}


/* ========================================
   REMOVE ITEM
======================================== */

function removeItem(index){

    if(
        !order[index]
    ){

        return;

    }


    /*
       Destructive actions should require
       confirmation.

       This also protects against any
       accidental mobile shifted/ghost tap.
    */

    const confirmed =
        confirm(
            "Remove this item from your selection?"
        );


    if(!confirmed){

        return;

    }


    order.splice(
        index,
        1
    );


    saveOrder();


    renderOrder();

}


/* ========================================
   ORDER ITEM EVENTS
======================================== */

const orderItemsContainer =
    document.getElementById(
        "orderItems"
    );


/*
   INPUT
*/

orderItemsContainer.addEventListener(
    "input",
    event => {

        if(
            !event.target.classList.contains(
                "quantity-input"
            )
        ){

            return;

        }


        handleQuantityInput(
            event.target
        );

    }
);


/*
   BLUR

   Capturing is required because blur
   itself does not bubble.

   This handler ONLY finalises the
   specific quantity input.

   It cannot remove or rerender items.
*/

orderItemsContainer.addEventListener(
    "blur",
    event => {

        if(
            !event.target.classList.contains(
                "quantity-input"
            )
        ){

            return;

        }


        finaliseQuantity(
            event.target
        );

    },
    true
);


/*
   KEYBOARD
*/

orderItemsContainer.addEventListener(
    "keydown",
    event => {

        if(
            !event.target.classList.contains(
                "quantity-input"
            )
        ){

            return;

        }


        if(
            event.key === "e" ||
            event.key === "E" ||
            event.key === "+" ||
            event.key === "-" ||
            event.key === "."
        ){

            event.preventDefault();

            return;

        }


        if(
            event.key === "Enter"
        ){

            event.preventDefault();


            finaliseQuantity(
                event.target
            );


            event.target.blur();

        }

    }
);


/*
   BUTTON CLICKS
*/

orderItemsContainer.addEventListener(
    "click",
    event => {

        const minus =
            event.target.closest(
                ".quantity-minus"
            );


        if(minus){

            changeQuantity(
                Number(
                    minus.dataset.index
                ),
                -1
            );


            return;

        }


        const plus =
            event.target.closest(
                ".quantity-plus"
            );


        if(plus){

            changeQuantity(
                Number(
                    plus.dataset.index
                ),
                1
            );


            return;

        }


        const remove =
            event.target.closest(
                ".remove-button"
            );


        if(remove){

            removeItem(
                Number(
                    remove.dataset.index
                )
            );

        }

    }
);


/* ========================================
   SUMMARY
======================================== */

function renderSummary(){

    if(order.length === 0){

        document.getElementById(
            "orderSummary"
        ).innerHTML = "";


        return;

    }


    const quantity =
        getTotalQuantity();


    const lines =
        order.length;


    document.getElementById(
        "orderSummary"
    ).innerHTML = `

        <div class="order-summary">

            <div class="summary-row">

                <span>
                    Selection Summary
                </span>


                <strong id="totalQuantity">

                    ${quantity}
                    ${
                        quantity === 1
                        ? "item"
                        : "items"
                    }

                </strong>

            </div>


            <div class="summary-note">

                ${lines}
                ${
                    lines === 1
                    ? "selection"
                    : "selections"
                }
                in your request.

                This is an order request,
                not a confirmed order.

                Pricing and availability
                will be confirmed by Cambridge.

            </div>

        </div>


        <div class="order-actions">

            <div class="order-actions-left">

                <a
                    href="index.html"
                    class="continue-button"
                >
                    ← Continue Browsing
                </a>


                <button
                    type="button"
                    class="clear-order-button"
                    id="clearSelection"
                >
                    Clear Selection
                </button>

            </div>


            <button
                type="button"
                class="checkout-button"
                id="continueRequest"
            >
                Continue to Request →
            </button>

        </div>

    `;

}


/* ========================================
   UPDATE TOTAL ONLY
======================================== */

function updateSummary(){

    const total =
        document.getElementById(
            "totalQuantity"
        );


    if(!total){

        return;

    }


    const quantity =
        getTotalQuantity();


    total.textContent =
        quantity +
        (
            quantity === 1
            ? " item"
            : " items"
        );

}


/* ========================================
   SUMMARY BUTTON EVENTS
======================================== */

document
    .getElementById(
        "orderSummary"
    )
    .addEventListener(
        "click",
        event => {

            if(
                event.target.closest(
                    "#clearSelection"
                )
            ){

                clearSelection();

                return;

            }


            if(
                event.target.closest(
                    "#continueRequest"
                )
            ){

                continueToRequest();

            }

        }
    );


/* ========================================
   CLEAR ALL
======================================== */

function clearSelection(){

    const confirmed =
        confirm(
            "Clear your entire selection?\n\n" +
            "This cannot be undone."
        );


    if(!confirmed){

        return;

    }


    order = [];


    try{

        localStorage.removeItem(
            ORDER_KEY
        );


        localStorage.removeItem(
            ORDER_UPDATED_KEY
        );

    }catch(error){

        console.error(
            "Unable to clear selection.",
            error
        );

    }


    renderOrder();

}


/* ========================================
   CONTINUE TO REQUEST
======================================== */

function continueToRequest(){

    if(
        order.length === 0
    ){

        return;

    }


    /*
       Final defensive check.
    */

    const valid =
        order.every(
            item => {

                const quantity =
                    Number(
                        item.quantity
                    );


                return (
                    Number.isInteger(
                        quantity
                    ) &&
                    quantity >=
                    MIN_QUANTITY &&
                    quantity <=
                    MAX_QUANTITY
                );

            }
        );


    if(!valid){

        alert(
            "Please check the quantities before continuing."
        );


        return;

    }


    saveOrder();


    window.location.href =
        "request-details.html";

}


/* ========================================
   START
======================================== */

loadOrder();

renderOrder();

</script>
