<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Selection | Cambridge Digital Catalogue</title>
<link rel="stylesheet" href="css/catalogue.css">
<style>
.order-hero{padding:45px 6% 30px;background:#fff}.order-wrap,.order-section{max-width:1050px;margin:auto}
.back-link{display:inline-block;margin-bottom:20px;color:var(--navy);text-decoration:none;font-size:12px;font-weight:700}
.order-hero h1{margin:0;font-size:clamp(34px,5vw,50px);letter-spacing:-1.5px}.order-intro{margin:10px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
.order-section{padding:30px 6% 60px}.order-card{margin-bottom:14px;padding:22px;background:#fff;border:1px solid var(--border);border-radius:12px}
.order-main{display:grid;grid-template-columns:1fr auto auto;gap:25px;align-items:center}.item-label{margin-bottom:5px;color:var(--muted);font-size:10px;font-weight:750;letter-spacing:.8px;text-transform:uppercase}
.item-title{margin:0;font-size:17px}.item-meta{margin-top:6px;color:var(--muted);font-size:11px}
.quantity-area{display:flex;flex-direction:column;align-items:center}.quantity{display:flex;align-items:center;gap:8px}
.quantity button{width:36px;height:36px;padding:0;border:1px solid var(--border);border-radius:7px;background:#fff;cursor:pointer;font-size:17px;touch-action:manipulation}
.quantity-input{width:80px;height:36px;box-sizing:border-box;border:1px solid var(--border);border-radius:7px;background:#fff;text-align:center;font-size:14px;font-weight:750;outline:none}
.quantity-input:focus{border-color:var(--navy)}.quantity-input.invalid{border-color:#b84646;background:#fff8f8}
.quantity-error{min-height:15px;margin-top:5px;color:#a33b3b;font-size:10px;font-weight:650;text-align:center;white-space:nowrap}
.remove-button{justify-self:end;padding:8px 10px;border:0;border-radius:6px;background:transparent;color:#8b3b3b;cursor:pointer;font-size:11px;font-weight:700}
.view-books{margin-top:15px;padding:0;border:0;background:transparent;color:var(--navy);cursor:pointer;font-size:11px;font-weight:750}
.kit-books{display:none;margin-top:16px;padding:16px 18px;background:#f7f8fa;border-radius:8px}.kit-books.visible{display:block}
.kit-books ol{margin:0;padding-left:20px}.kit-books li{margin:6px 0;color:#555f6b;font-size:11px}
.empty-order{padding:60px 20px;text-align:center;background:#fff;border:1px solid var(--border);border-radius:12px}.empty-order h2{margin:0 0 8px}.empty-order p{margin:0 0 25px;color:var(--muted);font-size:13px}
.order-summary{margin-top:25px;padding:22px;background:var(--navy);color:#fff;border-radius:12px}.summary-row{display:flex;justify-content:space-between;gap:20px}.summary-row strong{font-size:18px}.summary-note{margin-top:7px;color:rgba(255,255,255,.65);font-size:11px;line-height:1.5}
.order-actions{margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.order-actions-left{display:flex;gap:10px;flex-wrap:wrap}
.continue-button,.clear-order-button,.checkout-button{padding:13px 20px;border-radius:8px;font-size:12px;font-weight:750;text-align:center}.continue-button{border:1px solid var(--border);background:#fff;color:var(--navy);text-decoration:none}.clear-order-button{border:1px solid #d8bcbc;background:#fff;color:#8b3b3b;cursor:pointer}.checkout-button{border:0;background:var(--navy);color:#fff;cursor:pointer}
@media(max-width:650px){.order-hero{padding:35px 18px 25px}.order-section{padding:25px 18px 45px}.order-card{padding:17px}.order-main{grid-template-columns:1fr;gap:15px}.quantity-area{align-items:flex-start}.quantity-error{text-align:left;white-space:normal}.remove-button{justify-self:start}.order-actions{flex-direction:column;align-items:stretch}.order-actions-left{display:grid;grid-template-columns:1fr 1fr}.continue-button,.clear-order-button,.checkout-button{width:100%;box-sizing:border-box}}
</style>
</head>
<body>
<header class="catalogue-header"><div class="brand"><div class="brand-name">CAMBRIDGE</div><div class="brand-company">PUBLISHING COMPANY PVT. LTD.</div></div><div class="catalogue-year">DIGITAL CATALOGUE · 2026–27</div></header>
<section class="order-hero"><div class="order-wrap"><a href="index.html" class="back-link">← Continue browsing catalogue</a><p class="eyebrow">YOUR SELECTION</p><h1>Your Selection</h1><p class="order-intro">Review the books and kits you have selected before sending an order request.</p></div></section>
<main class="order-section"><div id="orderItems"></div><div id="orderSummary"></div></main>
<script>
const ORDER_KEY="cambridgeOrder",ORDER_UPDATED_KEY="cambridgeOrderUpdatedAt",MIN_QUANTITY=1,MAX_QUANTITY=10000;
let order=[];
function loadOrder(){try{const s=JSON.parse(localStorage.getItem(ORDER_KEY)||"[]");order=Array.isArray(s)?s.filter(x=>x&&typeof x==="object"):[]}catch(e){order=[]}order.forEach(x=>{const q=Number(x.quantity);if(!Number.isInteger(q)||q<1||q>MAX_QUANTITY)x.quantity=1})}
function saveOrder(){try{localStorage.setItem(ORDER_KEY,JSON.stringify(order));localStorage.setItem(ORDER_UPDATED_KEY,String(Date.now()));return true}catch(e){return false}}
function escapeHTML(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function totalQty(){return order.reduce((a,x)=>a+(Number.isInteger(Number(x.quantity))?Number(x.quantity):0),0)}
function showError(i,msg){const inp=document.querySelector(`.quantity-input[data-index="${i}"]`),e=document.getElementById("quantityError"+i);if(inp)inp.classList.add("invalid");if(e)e.textContent=msg}
function clearError(i){const inp=document.querySelector(`.quantity-input[data-index="${i}"]`),e=document.getElementById("quantityError"+i);if(inp)inp.classList.remove("invalid");if(e)e.textContent=""}
function removeItem(i,confirmFirst=false){if(!order[i])return;if(confirmFirst&&!confirm("Remove this item from your selection?"))return;order.splice(i,1);saveOrder();renderOrder()}
function handleInput(inp){const i=Number(inp.dataset.index);if(!order[i])return;let v=String(inp.value).replace(/\D/g,"");inp.value=v;if(v===""){showError(i,"Enter a quantity from 0 to 10,000.");return}const q=Number(v);if(v.length>5||!Number.isSafeInteger(q)||q>MAX_QUANTITY){inp.value=String(order[i].quantity);showError(i,"Maximum quantity is 10,000.");return}if(q===0){clearError(i);return}order[i].quantity=q;clearError(i);saveOrder();renderSummary()}
function finaliseInput(inp){const i=Number(inp.dataset.index);if(!order[i])return;const v=String(inp.value).replace(/\D/g,"");if(v===""){inp.value=String(order[i].quantity);showError(i,"Enter a quantity from 0 to 10,000.");return}const q=Number(v);if(!Number.isSafeInteger(q)||q>MAX_QUANTITY){inp.value=String(order[i].quantity);showError(i,q>MAX_QUANTITY?"Maximum quantity is 10,000.":"Enter a quantity from 0 to 10,000.");return}if(q===0){removeItem(i,false);return}order[i].quantity=q;inp.value=String(q);clearError(i);saveOrder();renderSummary()}
function changeQty(i,d){if(!order[i])return;const q=Number(order[i].quantity)||1,n=q+d;if(n>MAX_QUANTITY){showError(i,"Maximum quantity is 10,000.");return}if(n<1){removeItem(i,false);return}order[i].quantity=n;saveOrder();renderOrder()}
function renderOrder(){const c=document.getElementById("orderItems"),s=document.getElementById("orderSummary");c.innerHTML="";s.innerHTML="";if(!order.length){c.innerHTML='<div class="empty-order"><h2>Your selection is empty.</h2><p>Browse the catalogue and add books or kits to start your selection.</p><a href="index.html" class="continue-button">Browse Catalogue →</a></div>';return}
order.forEach((item,i)=>{const card=document.createElement("article");card.className="order-card";const title=item.title||(item.levelName?item.levelName+" Custom Kit":"Selected Item");let meta="";if(item.type==="custom-kit"){const n=Array.isArray(item.books)?item.books.length:Number(item.bookCount)||0;meta=n+(n===1?" book in this kit":" books in this kit")}else if(item.levelName)meta=item.levelName;
card.innerHTML=`<div class="order-main"><div><div class="item-label">${item.type==="custom-kit"?"Custom Kit":"Book"}</div><h2 class="item-title">${escapeHTML(title)}</h2><div class="item-meta">${escapeHTML(meta)}</div></div><div class="quantity-area"><div class="quantity"><button type="button" class="quantity-minus" data-index="${i}">−</button><input type="text" class="quantity-input" data-index="${i}" value="${item.quantity}" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="done" aria-label="Quantity"><button type="button" class="quantity-plus" data-index="${i}">+</button></div><div class="quantity-error" id="quantityError${i}" aria-live="polite"></div></div><button type="button" class="remove-button" data-index="${i}">Remove</button></div>`;
if(item.type==="custom-kit"&&Array.isArray(item.books)&&item.books.length){const vb=document.createElement("button");vb.type="button";vb.className="view-books";vb.textContent="View books ↓";const box=document.createElement("div");box.className="kit-books";const ol=document.createElement("ol");item.books.forEach(b=>{const li=document.createElement("li");li.textContent=b.title||"Untitled Book";ol.appendChild(li)});box.appendChild(ol);vb.onclick=()=>{const open=box.classList.toggle("visible");vb.textContent=open?"Hide books ↑":"View books ↓"};card.append(vb,box)}c.appendChild(card)});renderSummary()}
function renderSummary(){const s=document.getElementById("orderSummary");if(!order.length){s.innerHTML="";return}s.innerHTML=`<div class="order-summary"><div class="summary-row"><span>${order.length===1?"1 selected item":order.length+" selected items"}</span><strong>${totalQty()} total copies/sets</strong></div><div class="summary-note">Quantities can be adjusted before sending your request.</div></div><div class="order-actions"><div class="order-actions-left"><a href="index.html" class="continue-button">Continue Browsing</a><button type="button" class="clear-order-button" id="clearOrder">Clear Selection</button></div><button type="button" class="checkout-button" id="requestButton">Continue Request →</button></div>`;document.getElementById("clearOrder").onclick=()=>{if(confirm("Clear your entire selection?")){order=[];saveOrder();renderOrder()}};document.getElementById("requestButton").onclick=()=>{alert("Request submission will be connected in the next stage.")}}
document.getElementById("orderItems").addEventListener("input",e=>{if(e.target.classList.contains("quantity-input"))handleInput(e.target)});
document.getElementById("orderItems").addEventListener("focusout",e=>{if(e.target.classList.contains("quantity-input"))finaliseInput(e.target)});
document.getElementById("orderItems").addEventListener("keydown",e=>{if(e.target.classList.contains("quantity-input")&&e.key==="Enter"){e.preventDefault();e.target.blur()}});
document.getElementById("orderItems").addEventListener("click",e=>{const i=Number(e.target.dataset.index);if(e.target.classList.contains("quantity-minus"))changeQty(i,-1);else if(e.target.classList.contains("quantity-plus"))changeQty(i,1);else if(e.target.classList.contains("remove-button"))removeItem(i,true)});
window.addEventListener("storage",e=>{if(e.key===ORDER_KEY){loadOrder();renderOrder()}});
loadOrder();renderOrder();
</script>
</body>
</html>
