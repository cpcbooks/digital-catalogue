<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Your Order | Cambridge Digital Catalogue</title>

<link rel="stylesheet" href="css/catalogue.css">

<style>

.order-hero{
    padding:45px 6% 30px;
    background:#fff;
}

.order-wrap{
    max-width:1050px;
    margin:auto;
}

.back-link{
    display:inline-block;
    margin-bottom:20px;
    color:var(--navy);
    text-decoration:none;
    font-size:12px;
    font-weight:700;
}

.order-hero h1{
    margin:0;
    font-size:clamp(34px,5vw,50px);
    letter-spacing:-1.5px;
}

.order-intro{
    margin:10px 0 0;
    color:var(--muted);
    font-size:13px;
}


/* ORDER AREA */

.order-section{
    max-width:1050px;
    margin:auto;
    padding:30px 6% 60px;
}

.order-card{
    margin-bottom:14px;
    padding:22px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:12px;
}

.order-main{
    display:grid;
    grid-template-columns:1fr auto auto;
    gap:25px;
    align-items:center;
}

.item-label{
    margin-bottom:5px;
    color:var(--muted);
    font-size:10px;
    font-weight:750;
    letter-spacing:.8px;
    text-transform:uppercase;
}

.item-title{
    margin:0;
    font-size:17px;
}

.item-meta{
    margin-top:6px;
    color:var(--muted);
    font-size:11px;
}


/* QUANTITY */

.quantity{
    display:flex;
    align-items:center;
    gap:8px;
}

.quantity button{
    width:34px;
    height:34px;
    border:1px solid var(--border);
    border-radius:7px;
    background:#fff;
    cursor:pointer;
    font-size:17px;
}

.quantity button:hover{
    background:#f7f8fa;
}

.quantity-input{
    width:70px;
    height:34px;
    box-sizing:border-box;
    border:1px solid var(--border);
    border-radius:7px;
    background:#fff;
    text-align:center;
    font-size:14px;
    font-weight:750;
    outline:none;
}

.quantity-input:focus{
    border-color:var(--navy);
}

.quantity-input.invalid{
    border-color:#b84646;
    background:#fff7f7;
}


/* ACTIONS */

.remove-button{
    padding:8px 10px;
    border:0;
    background:transparent;
    color:#8b3b3b;
    cursor:pointer;
    font-size:11px;
    font-weight:700;
}

.clear-order-button{
    padding:13px 18px;
    border:1px solid #d8bcbc;
    border-radius:8px;
    background:#fff;
    color:#8b3b3b;
    cursor:pointer;
    font-size:12px;
    font-weight:750;
}

.clear-order-button:hover{
    background:#fff7f7;
}


/* KIT DETAILS */

.view-books{
    margin-top:15px;
    padding:0;
    border:0;
    background:transparent;
    color:var(--navy);
    cursor:pointer;
    font-size:11px;
    font-weight:750;
}

.kit-books{
    display:none;
    margin-top:16px;
    padding:16px 18px;
    background:#f7f8fa;
    border-radius:8px;
}

.kit-books.visible{
    display:block;
}

.kit-books ol{
    margin:0;
    padding-left:20px;
}

.kit-books li{
    margin:6px 0;
    color:#555f6b;
    font-size:11px;
}


/* EMPTY ORDER */

.empty-order{
    padding:60px 20px;
    text-align:center;
    background:#fff;
    border:1px solid var(--border);
    border-radius:12px;
}

.empty-order h2{
    margin:0 0 8px;
}

.empty-order p{
    margin:0 0 25px;
    color:var(--muted);
    font-size:13px;
}


/* SUMMARY */

.order-summary{
    margin-top:25px;
    padding:22px;
    background:var(--navy);
    color:#fff;
    border-radius:12px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    gap:20px;
}

.summary-row strong{
    font-size:18px;
}

.summary-note{
    margin-top:7px;
    color:rgba(255,255,255,.65);
    font-size:11px;
}


/* FOOT ACTIONS */

.order-actions{
    margin-top:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
}

.order-actions-left{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.continue-button,
.checkout-button{
    padding:13px 20px;
    border-radius:8px;
    text-decoration:none;
    font-size:12px;
    font-weight:750;
    text-align:center;
}

.continue-button{
    border:1px solid var(--border);
    background:#fff;
    color:var(--navy);
}

.checkout-button{
    border:0;
    background:var(--navy);
    color:#fff;
    cursor:pointer;
}

.checkout-button:disabled{
    opacity:.45;
    cursor:not-allowed;
}


/* MOBILE */

@media(max-width:650px){

    .order-hero{
        padding:35px 18px 25px;
    }

    .order-section{
        padding:25px 18px 45px;
    }

    .order-card{
        padding:17px;
    }

    .order-main{
        grid-template-columns:1fr;
        gap:15px;
    }

    .quantity{
        justify-content:flex-start;
    }

    .quantity-input{
        width:78px;
    }

    .remove-button{
        padding-left:0;
        text-align:left;
    }

    .order-actions{
        flex-direction:column;
        align-items:stretch;
    }

    .order-actions-left{
        display:grid;
        grid-template-columns:1fr 1fr;
    }

    .continue-button,
    .clear-order-button,
    .checkout-button{
        width:100%;
        box-sizing:border-box;
    }

}

</style>
</head>


<body>


<header class="catalogue-header">

    <div class="brand">

        <div class="brand-name">
            CAMBRIDGE
        </div>

        <div class="brand-company">
            PUBLISHING COMPANY PVT. LTD.
        </div>

    </div>

    <div class="catalogue-year">
        DIGITAL CATALOGUE · 2026–27
    </div>

</header>


<section class="order-hero">

    <div class="order-wrap">

        <a href="index.html" class="back-link">
            ← Continue browsing catalogue
        </a>

        <p class="eyebrow">
            ORDER LIST
        </p>

        <h1>Your Order</h1>

        <p class="order-intro">
            Review the books and kits you have selected before proceeding.
        </p>

    </div>

</section>


<main class="order-section">

    <div id="orderItems"></div>

    <div id="orderSummary"></div>

</main>


<script>

/* ========================================
   SETTINGS
======================================== */

const MIN_ORDER_QUANTITY = 1;
const MAX_ORDER_QUANTITY = 10000;


/* ========================================
   LOAD ORDER SAFELY
======================================== */

let order = [];

try{

    const storedOrder =
        JSON.parse(
            localStorage.getItem(
                "cambridgeOrder"
            ) || "[]"
        );

    order =
        Array.isArray(storedOrder)
        ? storedOrder
        : [];

}catch(error){

    console.error(
        "Could not load order:",
        error
    );

    order = [];
}


/* ========================================
   NORMALISE ORDER DATA
======================================== */

order = order.map(item => {

    let quantity =
        Number(item.quantity);

    if(
        !Number.isInteger(quantity) ||
        quantity < MIN_ORDER_QUANTITY ||
        quantity > MAX_ORDER_QUANTITY
    ){
        quantity = 1;
    }

    return {
        ...item,
        quantity:quantity
    };

});


/* ========================================
   SAVE ORDER
======================================== */

function saveOrder(){

    localStorage.setItem(
        "cambridgeOrder",
        JSON.stringify(order)
    );

}


/* ========================================
   RENDER ORDER
======================================== */

function renderOrder(){

    const itemsContainer =
        document.getElementById(
            "orderItems"
        );

    const summaryContainer =
        document.getElementById(
            "orderSummary"
        );


    itemsContainer.innerHTML = "";
    summaryContainer.innerHTML = "";


    /* EMPTY ORDER */

    if(order.length === 0){

        itemsContainer.innerHTML = `

            <div class="empty-order">

                <h2>
                    Your order is empty.
                </h2>

                <p>
                    Browse the catalogue and add books
                    or kits to start your order.
                </p>

                <a
                    href="index.html"
                    class="continue-button"
                >
                    Browse Catalogue →
                </a>

            </div>

        `;

        return;

    }


    /* ORDER ITEMS */

    order.forEach((item,index) => {

        const card =
            document.createElement(
                "article"
            );

        card.className =
            "order-card";


        const title =
            item.title ||
            (
                item.levelName
                ? item.levelName +
                  " Custom Kit"
                : "Selected Item"
            );


        let meta = "";


        if(item.type === "custom-kit"){

            const bookCount =
                Array.isArray(item.books)
                ? item.books.length
                : Number(item.bookCount) || 0;

            meta =
                bookCount +
                (
                    bookCount === 1
                    ? " book in this kit"
                    : " books in this kit"
                );

        }else if(item.levelName){

            meta =
                item.levelName;

        }


        card.innerHTML = `

            <div class="order-main">

                <div>

                    <div class="item-label">
                        ${
                            item.type ===
                            "custom-kit"
                            ? "Custom Kit"
                            : "Book"
                        }
                    </div>

                    <h2 class="item-title">
                        ${escapeHTML(title)}
                    </h2>

                    <div class="item-meta">
                        ${escapeHTML(meta)}
                    </div>

                </div>


                <div class="quantity">

                    <button
                        type="button"
                        onclick="changeQuantity(
                            ${index},
                            -1
                        )"
                        aria-label="Decrease quantity"
                    >
                        −
                    </button>


                    <input
                        type="number"
                        class="quantity-input"
                        id="quantity-${index}"
                        value="${item.quantity}"
                        min="${MIN_ORDER_QUANTITY}"
                        max="${MAX_ORDER_QUANTITY}"
                        step="1"
                        inputmode="numeric"
                        aria-label="Quantity"
                        oninput="handleQuantityInput(
                            ${index},
                            this
                        )"
                        onkeydown="handleQuantityKeydown(
                            event,
                            ${index},
                            this
                        )"
                    >


                    <button
                        type="button"
                        onclick="changeQuantity(
                            ${index},
                            1
                        )"
                        aria-label="Increase quantity"
                    >
                        +
                    </button>

                </div>


                <button
                    type="button"
                    class="remove-button"
                    onclick="removeItem(${index})"
                >
                    Remove
                </button>

            </div>

        `;


        /* CUSTOM KIT CONTENTS */

        if(
            item.type === "custom-kit" &&
            Array.isArray(item.books) &&
            item.books.length > 0
        ){

            const viewButton =
                document.createElement(
                    "button"
                );

            viewButton.type =
                "button";

            viewButton.className =
                "view-books";

            viewButton.textContent =
                "View books ↓";


            const booksBox =
                document.createElement(
                    "div"
                );

            booksBox.className =
                "kit-books";


            const list =
                document.createElement(
                    "ol"
                );


            item.books.forEach(book => {

                const li =
                    document.createElement(
                        "li"
                    );

                li.textContent =
                    book.title ||
                    "Untitled Book";

                list.appendChild(li);

            });


            booksBox.appendChild(list);


            viewButton.addEventListener(
                "click",
                function(){

                    const isOpen =
                        booksBox.classList
                        .toggle("visible");

                    this.textContent =
                        isOpen
                        ? "Hide books ↑"
                        : "View books ↓";

                }
            );


            card.appendChild(
                viewButton
            );

            card.appendChild(
                booksBox
            );

        }


        itemsContainer.appendChild(
            card
        );

    });


    renderSummary();

}


/* ========================================
   MANUAL QUANTITY ENTRY
======================================== */

function handleQuantityInput(index,input){

    /*
       Empty input is temporarily allowed
       while the customer is typing.
    */

    if(input.value === ""){
        input.classList.remove(
            "invalid"
        );
        return;
    }


    const rawValue =
        input.value;


    const quantity =
        Number(rawValue);


    /*
       Reject decimals and invalid numbers.
    */

    if(
        !Number.isInteger(quantity) ||
        quantity < MIN_ORDER_QUANTITY
    ){

        showQuantityWarning(
            "Please enter a whole number between 1 and 10,000."
        );

        restoreQuantity(
            index,
            input
        );

        return;

    }


    /*
       Hard maximum.
       Reject instead of changing it to 10,000.
    */

    if(quantity > MAX_ORDER_QUANTITY){

        showQuantityWarning(
            "Maximum quantity allowed per item is 10,000."
        );

        restoreQuantity(
            index,
            input
        );

        return;

    }


    /*
       Valid quantity:
       save immediately.
    */

    input.classList.remove(
        "invalid"
    );

    order[index].quantity =
        quantity;

    saveOrder();

    updateSummaryOnly();

}


/* ========================================
   QUANTITY KEYBOARD HANDLING
======================================== */

function handleQuantityKeydown(
    event,
    index,
    input
){

    /*
       Prevent characters that do not
       belong in a positive whole number.
    */

    if(
        event.key === "-" ||
        event.key === "+" ||
        event.key === "." ||
        event.key === "e" ||
        event.key === "E"
    ){

        event.preventDefault();

        return;

    }


    /*
       Enter confirms the value and
       removes the mobile keyboard focus.
    */

    if(event.key === "Enter"){

        input.blur();

    }

}


/* ========================================
   RESTORE LAST VALID QUANTITY
======================================== */

function restoreQuantity(index,input){

    input.classList.add(
        "invalid"
    );


    const previousQuantity =
        Number(
            order[index].quantity
        ) || 1;


    input.value =
        previousQuantity;


    setTimeout(
        () => {

            input.classList.remove(
                "invalid"
            );

            input.focus();

            input.select();

        },
        50
    );

}


/* ========================================
   QUANTITY WARNING
======================================== */

let quantityWarningOpen = false;


function showQuantityWarning(message){

    /*
       Prevent multiple alerts firing
       from one mobile input action.
    */

    if(quantityWarningOpen){
        return;
    }


    quantityWarningOpen = true;


    alert(message);


    quantityWarningOpen = false;

}


/* ========================================
   PLUS / MINUS
======================================== */

function changeQuantity(index,change){

    const item =
        order[index];


    if(!item){
        return;
    }


    const currentQuantity =
        Number(item.quantity) || 1;


    const newQuantity =
        currentQuantity + change;


    if(
        newQuantity >
        MAX_ORDER_QUANTITY
    ){

        showQuantityWarning(
            "Maximum quantity allowed per item is 10,000."
        );

        return;

    }


    if(
        newQuantity <
        MIN_ORDER_QUANTITY
    ){

        showQuantityWarning(
            "Minimum quantity is 1. Use Remove if you don't want this item."
        );

        return;

    }


    item.quantity =
        newQuantity;


    saveOrder();

    renderOrder();

}


/* ========================================
   REMOVE ITEM
======================================== */

function removeItem(index){

    if(
        index < 0 ||
        index >= order.length
    ){
        return;
    }


    order.splice(
        index,
        1
    );


    saveOrder();

    renderOrder();

}


/* ========================================
   CLEAR ORDER
======================================== */

function clearOrder(){

    const confirmed =
        confirm(
            "Clear all items from this order?\n\n" +
            "This cannot be undone."
        );


    if(!confirmed){
        return;
    }


    order = [];


    saveOrder();

    renderOrder();

}


/* ========================================
   ORDER SUMMARY
======================================== */

function getTotalQuantity(){

    return order.reduce(
        (sum,item) => {

            const quantity =
                Number(item.quantity) || 1;

            return sum + quantity;

        },
        0
    );

}


function renderSummary(){

    const container =
        document.getElementById(
            "orderSummary"
        );


    const totalLines =
        order.length;


    const totalQuantity =
        getTotalQuantity();


    container.innerHTML = `

        <div class="order-summary">

            <div class="summary-row">

                <span>
                    Order Summary
                </span>

                <strong id="totalQuantity">
                    ${totalQuantity}
                    ${
                        totalQuantity === 1
                        ? "item"
                        : "items"
                    }
                </strong>

            </div>


            <div class="summary-note">

                <span id="selectionCount">
                    ${totalLines}
                    ${
                        totalLines === 1
                        ? "selection"
                        : "selections"
                    }
                </span>

                in your order.
                Pricing will be confirmed
                before the order is finalised.

            </div>

        </div>


        <div class="order-actions">

            <div class="order-actions-left">

                <a
                    href="index.html"
                    class="continue-button"
                >
                    ← Continue Browsing
                </a>


                <button
                    type="button"
                    class="clear-order-button"
                    onclick="clearOrder()"
                >
                    Clear Order
                </button>

            </div>


            <button
                type="button"
                class="checkout-button"
                onclick="proceedToOrder()"
            >
                Proceed to Order →
            </button>

        </div>

    `;

}


/* ========================================
   UPDATE SUMMARY WITHOUT REBUILDING CART
======================================== */

function updateSummaryOnly(){

    const totalElement =
        document.getElementById(
            "totalQuantity"
        );


    if(!totalElement){
        return;
    }


    const totalQuantity =
        getTotalQuantity();


    totalElement.textContent =
        totalQuantity +
        (
            totalQuantity === 1
            ? " item"
            : " items"
        );

}


/* ========================================
   PROCEED
======================================== */

function proceedToOrder(){

    if(order.length === 0){

        alert(
            "Your order is empty."
        );

        return;

    }


    alert(
        "Next we will add the customer and institution details page."
    );

}


/* ========================================
   BASIC HTML SAFETY
======================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* ========================================
   START
======================================== */

saveOrder();

renderOrder();

</script>

</body>
</html>
