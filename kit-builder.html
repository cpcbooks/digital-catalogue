<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Build Your Own Kit | Cambridge Digital Catalogue</title><link rel="stylesheet" href="css/catalogue.css"><link rel="stylesheet" href="css/publication-browser.css"><style>
.kit-hero{padding:45px 6% 32px;background:#fff}.kit-wrap,.kit-content{max-width:1180px;margin:auto}.kit-hero h1{margin:0;font-size:clamp(34px,5vw,52px);letter-spacing:-1.5px}.kit-intro{max-width:650px;margin:12px 0 0;color:var(--muted)}.minimum-box{margin-top:24px;padding:15px 18px;background:#f6f8fa;border:1px solid var(--border);border-radius:10px;font-size:13px}.minimum-box strong{color:var(--navy)}.kit-name{display:block;max-width:360px;margin-top:14px;color:var(--navy);font-size:12px;font-weight:700}.kit-name input{display:block;width:100%;box-sizing:border-box;margin-top:6px;padding:10px;border:1px solid var(--border);border-radius:7px;font:inherit;font-weight:400}.kit-content{padding:35px 6% 130px}.category{margin-bottom:42px}.category h2{margin:0 0 5px;font-size:22px}.category-subtitle{margin:0 0 17px;color:var(--muted);font-size:12px}.book-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.book-card{position:relative;min-height:125px;padding:17px;background:#fff;border:1px solid var(--border);border-radius:11px;cursor:pointer;transition:.18s ease}.book-card:hover{transform:translateY(-2px)}.book-card:has(.book-selector:focus-visible){outline:3px solid rgba(18,35,63,.45);outline-offset:3px}.book-selector{position:absolute;inset:0;opacity:0;cursor:pointer}.book-card.selected{border:2px solid var(--navy);background:#f4f7fb}.book-card h3{margin:26px 0 5px;font-size:14px;line-height:1.35}.book-card p{margin:0;color:var(--muted);font-size:10px}.check{position:absolute;top:14px;right:14px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border:1px solid #c9d0d8;border-radius:50%;font-size:12px;color:transparent}.book-card.selected .check{color:#fff;background:var(--navy);border-color:var(--navy)}.data-message{padding:32px 24px;border:1px solid var(--border);border-radius:11px;background:#fff;text-align:center}.data-message h2{margin:0 0 8px;font-size:20px}.data-message p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}.kit-summary{position:fixed;left:0;right:0;bottom:0;z-index:100;padding:14px 6%;background:rgba(255,255,255,.97);border-top:1px solid var(--border);box-shadow:0 -8px 25px rgba(0,0,0,.05)}.summary-inner{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}.summary-title{font-weight:750;font-size:15px}.summary-message{margin-top:3px;color:var(--muted);font-size:11px}.progress{width:240px;height:5px;margin-top:8px;background:#e6e9ed;border-radius:999px;overflow:hidden}.progress-fill{width:0;height:100%;background:var(--navy);transition:.2s ease}.review-button{min-width:190px;padding:13px 18px;border:0;border-radius:8px;background:var(--navy);color:#fff;font-weight:750;cursor:pointer}.review-button:disabled{background:#b9c0c9;cursor:not-allowed}@media(max-width:850px){.book-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.kit-hero{padding:35px 18px 26px}.kit-content{padding:28px 18px 155px}.book-grid{grid-template-columns:repeat(2,1fr);gap:9px}.book-card{min-height:115px;padding:14px}.book-card h3{font-size:13px}.kit-summary{padding:12px 14px}.summary-inner{flex-direction:column;align-items:stretch;gap:10px}.progress{width:100%}.review-button{width:100%}}</style></head>
<body><header class="catalogue-header"><div class="brand"><div class="brand-name">CAMBRIDGE</div><div class="brand-company">PUBLISHING COMPANY PVT. LTD.</div></div><div class="catalogue-year">DIGITAL CATALOGUE · 2026–27</div></header><section class="kit-hero"><div class="kit-wrap"><nav class="context-nav" aria-label="Catalogue navigation"><a href="index.html">⌂ Home</a><span class="nav-divider" aria-hidden="true"></span><a href="early-learning.html" id="kitBack">← Early Learning</a></nav><p class="eyebrow">BUILD YOUR OWN KIT</p><h1 id="pageTitle">Build Your Kit</h1><p class="kit-intro">Choose books from our Early Learning range and create a combination that suits your requirement.</p><div class="minimum-box"><strong id="minimumText"></strong>You can add more books after reaching the minimum.</div><label class="kit-name">Kit name <input id="kitName" maxlength="80" autocomplete="off" placeholder="Optional, e.g. My Nursery Kit"></label></div></section><main class="kit-content" id="catalogue"></main><div class="kit-summary"><div class="summary-inner"><div><div class="summary-title" id="countText">Your Kit · 0 books</div><div class="summary-message" id="message"></div><div class="progress"><div class="progress-fill" id="progress"></div></div></div><button class="review-button" id="reviewButton" disabled>Review Kit</button></div></div>
<script src="js/catalogue-data.js?v=20260816-4"></script><script src="js/catalogue-query.js?v=20260816-4"></script><script src="js/catalogue-pilot-config.js"></script><script src="js/catalogue-supabase-adapter.js"></script><script src="js/catalogue-bootstrap.js"></script><script src="js/catalogue-source-links.js"></script><script src="js/catalogue-selection.js?v=20260816-5"></script><script src="js/custom-kit-state.js?v=20261005-1"></script><script src="js/early-learning-kit-config.js?v=20261005-1"></script><script>(async function(){"use strict";const Bootstrap=window.CambridgeCatalogueBootstrap;if(!Bootstrap)throw new Error("Catalogue source bootstrap failed to load.");try{await Bootstrap.ready()}catch(e){document.getElementById("catalogue").innerHTML="<div class=\"data-message\"><h2>Catalogue unavailable</h2><p>The Supabase pilot catalogue could not be loaded. Please try again.</p></div>";return}const DRAFT_KEY="cambridgeCustomKitDraft",Query=window.CambridgeCatalogueQuery,KitState=window.CambridgeCustomKitState,KitConfig=window.CambridgeEarlyLearningKitConfig;if(!Query||!KitState||!KitConfig)throw new Error("Catalogue modules failed to load.");const el={pageTitle:document.getElementById("pageTitle"),minimumText:document.getElementById("minimumText"),catalogue:document.getElementById("catalogue"),countText:document.getElementById("countText"),message:document.getElementById("message"),progress:document.getElementById("progress"),reviewButton:document.getElementById("reviewButton"),kitBack:document.getElementById("kitBack"),kitName:document.getElementById("kitName")},categories={"English":"Readers, writing and activity books.","Mathematics":"Numbers, counting and early mathematics.","Kannada":"Reading, alphabet and writing books.","Hindi":"Reading, alphabet and activity books.","Creative Learning":"Drawing, colouring, art, rhymes and patterns."},params=new URLSearchParams(location.search);let level=(params.get("level")||"lkg").toLowerCase();if(!KitConfig.getStageConfig(level))level="lkg";const config=KitConfig.getStageConfig(level),kitState=KitState.create({minimum:config.minimumDistinctTitles,completionEnabled:config.completionEnabled,isEligible:book=>KitConfig.isEligible(book,config.displayName)}),levelUrl=Bootstrap.withSource("early-learning-level.html?level="+encodeURIComponent(level));let books=[];el.pageTitle.textContent="Build Your "+config.displayName+" Kit";el.minimumText.textContent=config.completionEnabled?"Choose a minimum of "+config.minimumDistinctTitles+" books. ":"Custom Kit completion is not configured for this stage. ";el.kitBack.href=levelUrl;el.kitBack.textContent="← "+config.displayName;function getEarlyLearningBooks(){return Query.byCategoryAndClass("early-learning",config.displayName).filter(book=>KitConfig.isEligible(book,config.displayName))}function restoreDraft(){try{const draft=JSON.parse(sessionStorage.getItem(DRAFT_KEY)||"null");if(draft&&draft.level===level&&(draft.source||"static")===Bootstrap.requestedSource){kitState.setName(draft.name);el.kitName.value=kitState.getName();if(Array.isArray(draft.bookIds))draft.bookIds.forEach(id=>{const book=books.find(item=>String(item.id)===String(id));if(book)kitState.add(book)})}}catch(e){}}function showDataMessage(heading,text){el.catalogue.innerHTML="";const box=document.createElement("div"),h=document.createElement("h2"),p=document.createElement("p");box.className="data-message";h.textContent=heading;p.textContent=text;box.append(h,p);el.catalogue.appendChild(box)}function createBookCard(book){const card=document.createElement("label"),input=document.createElement("input"),check=document.createElement("div"),h=document.createElement("h3"),p=document.createElement("p");card.className="book-card"+(kitState.contains(book)?" selected":"");input.className="book-selector";input.type="checkbox";input.checked=kitState.contains(book);check.className="check";check.setAttribute("aria-hidden","true");check.textContent="✓";h.textContent=book.title||"Untitled Book";p.textContent=book.type||"Book";card.append(input,check,h,p);input.addEventListener("change",()=>toggleBook(book,card,input));return card}function renderCatalogue(){el.catalogue.innerHTML="";if(!books.length){showDataMessage("Books are not available yet","No eligible Early Learning books are currently available for this class.");return}KitConfig.groupBooksForDisplay(books,categories).forEach(group=>{const section=document.createElement("section"),h=document.createElement("h2"),sub=document.createElement("p"),grid=document.createElement("div");section.className="category";h.textContent=group.title;sub.className="category-subtitle";sub.textContent=group.description;grid.className="book-grid";group.books.forEach(book=>grid.appendChild(createBookCard(book)));section.append(h,sub,grid);el.catalogue.appendChild(section)})}function toggleBook(book,card,input){if(kitState.contains(book)){kitState.remove(book);card.classList.remove("selected");input.checked=false}else if(kitState.add(book)){card.classList.add("selected");input.checked=true}else input.checked=false;updateSummary()}function updateSummary(){const count=kitState.count(),remaining=kitState.remaining();el.countText.textContent="Your "+config.displayName+" Kit · "+count+(count===1?" book":" books");el.progress.style.width=config.completionEnabled?Math.min(count/config.minimumDistinctTitles*100,100)+"%":"0%";if(!books.length){el.message.textContent="Catalogue data is unavailable for this class.";el.reviewButton.disabled=true;el.reviewButton.textContent="Books unavailable";return}if(kitState.isComplete())el.message.textContent="✓ Minimum requirement reached. Your Kit can be completed after review.";else if(!config.completionEnabled)el.message.textContent="Review your selected titles. Completion is not configured for this stage.";else el.message.textContent="Select "+remaining+" more "+(remaining===1?"book":"books")+" to complete this Kit. You can review it now.";el.reviewButton.disabled=!kitState.canReview();el.reviewButton.textContent=kitState.canReview()?"Review Kit →":"Select books"}function reviewKit(){if(!kitState.canReview())return;try{sessionStorage.setItem(DRAFT_KEY,JSON.stringify({level,source:Bootstrap.requestedSource,name:kitState.getName(),bookIds:kitState.selectedIds()}));location.href=Bootstrap.withSource("kit-review.html?level="+encodeURIComponent(level))}catch(e){alert("Your Kit could not be prepared for review on this device. Please try again.")}}function init(){books=getEarlyLearningBooks();restoreDraft();renderCatalogue();updateSummary()}el.kitName.addEventListener("input",()=>{el.kitName.value=kitState.setName(el.kitName.value)});el.reviewButton.addEventListener("click",reviewKit);init()})();</script></body></html>
