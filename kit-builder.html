<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build Your Own Kit | Cambridge Digital Catalogue</title>
<link rel="stylesheet" href="css/catalogue.css">
<style>
.kit-hero{padding:45px 6% 32px;background:#fff}.kit-wrap,.kit-content{max-width:1180px;margin:auto}.kit-back{display:inline-block;margin-bottom:20px;color:var(--navy);text-decoration:none;font-size:12px;font-weight:700}.kit-hero h1{margin:0;font-size:clamp(34px,5vw,52px);letter-spacing:-1.5px}.kit-intro{max-width:650px;margin:12px 0 0;color:var(--muted)}.minimum-box{margin-top:24px;padding:15px 18px;background:#f6f8fa;border:1px solid var(--border);border-radius:10px;font-size:13px}.minimum-box strong{color:var(--navy)}.kit-content{padding:35px 6% 130px}.category{margin-bottom:42px}.category h2{margin:0 0 5px;font-size:22px}.category-subtitle{margin:0 0 17px;color:var(--muted);font-size:12px}.book-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.book-card{position:relative;min-height:125px;padding:17px;background:#fff;border:1px solid var(--border);border-radius:11px;cursor:pointer;transition:.18s ease}.book-card:hover{transform:translateY(-2px)}.book-card.selected{border:2px solid var(--navy);background:#f4f7fb}.book-card h3{margin:26px 0 5px;font-size:14px;line-height:1.35}.book-card p{margin:0;color:var(--muted);font-size:10px}.check{position:absolute;top:14px;right:14px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border:1px solid #c9d0d8;border-radius:50%;font-size:12px;color:transparent}.book-card.selected .check{color:#fff;background:var(--navy);border-color:var(--navy)}.data-message{padding:32px 24px;border:1px solid var(--border);border-radius:11px;background:#fff;text-align:center}.data-message h2{margin:0 0 8px;font-size:20px}.data-message p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}.kit-summary{position:fixed;left:0;right:0;bottom:0;z-index:100;padding:14px 6%;background:rgba(255,255,255,.97);border-top:1px solid var(--border);box-shadow:0 -8px 25px rgba(0,0,0,.05)}.summary-inner{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}.summary-title{font-weight:750;font-size:15px}.summary-message{margin-top:3px;color:var(--muted);font-size:11px}.progress{width:240px;height:5px;margin-top:8px;background:#e6e9ed;border-radius:999px;overflow:hidden}.progress-fill{width:0;height:100%;background:var(--navy);transition:.2s ease}.add-button{min-width:190px;padding:13px 18px;border:0;border-radius:8px;background:var(--navy);color:#fff;font-weight:750;cursor:pointer}.add-button:disabled{background:#b9c0c9;cursor:not-allowed}@media(max-width:850px){.book-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.kit-hero{padding:35px 18px 26px}.kit-content{padding:28px 18px 155px}.book-grid{grid-template-columns:repeat(2,1fr);gap:9px}.book-card{min-height:115px;padding:14px}.book-card h3{font-size:13px}.kit-summary{padding:12px 14px}.summary-inner{flex-direction:column;align-items:stretch;gap:10px}.progress{width:100%}.add-button{width:100%}}
</style>
</head>
<body>
<header class="catalogue-header"><div class="brand"><div class="brand-name">CAMBRIDGE</div><div class="brand-company">PUBLISHING COMPANY PVT. LTD.</div></div><div class="catalogue-year">DIGITAL CATALOGUE · 2026–27</div></header>
<section class="kit-hero"><div class="kit-wrap"><a href="early-learning.html" class="kit-back">← Early Learning</a><p class="eyebrow">BUILD YOUR OWN KIT</p><h1 id="pageTitle">Build Your Kit</h1><p class="kit-intro">Choose books from our Early Learning range and create a combination that suits your requirement.</p><div class="minimum-box"><strong id="minimumText"></strong>You can add more books after reaching the minimum.</div></div></section>
<main class="kit-content" id="catalogue"></main>
<div class="kit-summary"><div class="summary-inner"><div><div class="summary-title" id="countText">Your Kit · 0 books</div><div class="summary-message" id="message"></div><div class="progress"><div class="progress-fill" id="progress"></div></div></div><button class="add-button" id="addButton" disabled>Select books</button></div></div>
<script src="js/catalogue-data.js?v=20260816-3"></script>
<script src="js/catalogue-query.js?v=20260816-3"></script>
<script>
const ORDER_KEY="cambridgeOrder",Query=window.CambridgeCatalogueQuery;
if(!Query)throw new Error("Catalogue query module failed to load.");
const kitConfig={nursery:{name:"Nursery",minimum:8},lkg:{name:"LKG",minimum:8},ukg:{name:"UKG",minimum:8}};
const categories={"English":"Readers, writing and activity books.","Mathematics":"Numbers, counting and early mathematics.","Kannada":"Reading, alphabet and writing books.","Hindi":"Reading, alphabet and activity books.","Creative Learning":"Drawing, colouring, art, rhymes and patterns."};
const params=new URLSearchParams(location.search);let level=params.get("level")||"lkg";if(!kitConfig[level])level="lkg";const config=kitConfig[level],selectedBookIds=new Set();let books=[];
pageTitle.textContent="Build Your "+config.name+" Kit";minimumText.textContent="Choose a minimum of "+config.minimum+" books. ";
function getEarlyLearningBooks(){return Query.byCategoryAndClass("early-learning",config.name)}
function showDataMessage(heading,text){catalogue.innerHTML="";const box=document.createElement("div");box.className="data-message";const h=document.createElement("h2");h.textContent=heading;const p=document.createElement("p");p.textContent=text;box.append(h,p);catalogue.appendChild(box)}
function createBookCard(book){const card=document.createElement("div");card.className="book-card"+(selectedBookIds.has(book.id)?" selected":"");const check=document.createElement("div");check.className="check";check.textContent="✓";const h=document.createElement("h3");h.textContent=book.title||"Untitled Book";const p=document.createElement("p");p.textContent=book.type||"Book";card.append(check,h,p);card.addEventListener("click",()=>toggleBook(book,card));return card}
function renderCatalogue(){catalogue.innerHTML="";if(!books.length){showDataMessage("Books are not available yet","No Early Learning books are currently available for this class.");return}Object.keys(categories).forEach(category=>{const categoryBooks=books.filter(book=>book.subject===category);if(!categoryBooks.length)return;const section=document.createElement("section");section.className="category";const h=document.createElement("h2");h.textContent=category;const sub=document.createElement("p");sub.className="category-subtitle";sub.textContent=categories[category];const grid=document.createElement("div");grid.className="book-grid";categoryBooks.forEach(book=>grid.appendChild(createBookCard(book)));section.append(h,sub,grid);catalogue.appendChild(section)})}
function toggleBook(book,card){if(selectedBookIds.has(book.id)){selectedBookIds.delete(book.id);card.classList.remove("selected")}else{selectedBookIds.add(book.id);card.classList.add("selected")}updateSummary()}
function updateSummary(){const count=selectedBookIds.size,remaining=Math.max(config.minimum-count,0);countText.textContent="Your "+config.name+" Kit · "+count+(count===1?" book":" books");progress.style.width=Math.min(count/config.minimum*100,100)+"%";if(!books.length){message.textContent="Catalogue data is unavailable for this class.";addButton.disabled=true;addButton.textContent="Books unavailable";return}if(count>=config.minimum){message.textContent="✓ Minimum requirement reached. You can continue adding books.";addButton.disabled=false;addButton.textContent="Add Kit to Selection →"}else{message.textContent="Select "+remaining+" more "+(remaining===1?"book":"books")+" to create your kit.";addButton.disabled=true;addButton.textContent="Select "+remaining+" more"}}
function getStoredOrder(){try{const value=JSON.parse(localStorage.getItem(ORDER_KEY)||"[]");return Array.isArray(value)?value:[]}catch(e){return[]}}
function saveOrder(order){try{localStorage.setItem(ORDER_KEY,JSON.stringify(order));return true}catch(e){alert("Your selection could not be saved on this device. Please try again.");return false}}
function addKit(){if(selectedBookIds.size<config.minimum)return;const selected=books.filter(book=>selectedBookIds.has(book.id));const kit={id:"KIT-"+Date.now(),type:"custom-kit",title:config.name+" Custom Kit",class:[config.name],level,levelName:config.name,quantity:1,books:selected,bookCount:selected.length};const order=getStoredOrder();order.push(kit);if(saveOrder(order))location.href="order.html"}
addButton.addEventListener("click",addKit);
document.addEventListener("DOMContentLoaded",()=>{books=getEarlyLearningBooks();renderCatalogue();updateSummary()});
</script>
</body>
</html>
