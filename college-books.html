<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>College and University Books | Cambridge Digital Catalogue</title><link rel="stylesheet" href="css/catalogue.css"><style>
.page-hero{padding:44px 6% 32px;background:#fff}.page-wrap,.content{max-width:1180px;margin:auto}.back-link{display:inline-block;margin-bottom:22px;color:var(--navy);text-decoration:none;font-size:12px;font-weight:700}.page-hero h1{margin:0;font-size:clamp(34px,5vw,50px);letter-spacing:-1.3px}.intro{margin:11px 0 0;color:var(--muted);font-size:13px}.stage-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:23px}.stage-tabs a{padding:8px 13px;border:1px solid var(--border);border-radius:999px;background:#fff;color:#5d6876;text-decoration:none;font-size:10px;font-weight:700}.stage-tabs a.active{background:var(--navy);border-color:var(--navy);color:#fff}.content{padding:34px 6% 90px}.toolbar{display:grid;grid-template-columns:1fr 180px;gap:12px;margin-bottom:28px}.toolbar input,.toolbar select{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid var(--border);border-radius:9px;background:#fff;font:inherit;font-size:11px}.empty{padding:52px 25px;border:1px solid var(--border);border-radius:13px;background:#fff;text-align:center}.empty h2{margin:0 0 8px;font-size:21px}.empty p{max-width:600px;margin:auto;color:var(--muted);font-size:12px;line-height:1.7}.books{display:grid;gap:12px}.book-row{display:grid;grid-template-columns:85px 1fr auto;gap:18px;align-items:center;padding:16px;border:1px solid var(--border);border-radius:11px;background:#fff}.cover{width:85px;aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;background:#f0f3f6;border-radius:7px;color:#8d98a8;font-size:8px;font-weight:750}.book-row h3{margin:0 0 5px;font-size:15px}.book-row p{margin:0;color:var(--muted);font-size:10px}.view{padding:10px 14px;border-radius:7px;background:var(--navy);color:#fff;text-decoration:none;font-size:10px;font-weight:750}@media(max-width:650px){.page-hero{padding:34px 18px 27px}.content{padding:26px 18px 80px}.toolbar{grid-template-columns:1fr}.book-row{grid-template-columns:65px 1fr}.cover{width:65px}.view{grid-column:1/-1;text-align:center}}
</style></head><body><header class="catalogue-header"><div class="brand"><div class="brand-name">CAMBRIDGE</div><div class="brand-company">PUBLISHING COMPANY PVT. LTD.</div></div><div class="catalogue-year">DIGITAL CATALOGUE · 2026–27</div></header><main><section class="page-hero"><div class="page-wrap"><a class="back-link" href="college-university.html">← College and University</a><p class="eyebrow">COLLEGE AND UNIVERSITY</p><h1 id="title">College Books</h1><p class="intro" id="intro"></p><div class="stage-tabs"><a data-stage="1st-puc" href="?stage=1st-puc">1st PUC</a><a data-stage="2nd-puc" href="?stage=2nd-puc">2nd PUC</a><a data-stage="degree" href="?stage=degree">Degree</a></div></div></section><section class="content"><div class="toolbar"><input id="search" type="search" placeholder="Search books, subjects or series..." autocomplete="off"><select id="subject"><option value="">All Subjects</option></select></div><div id="results"></div></section></main><footer><div><strong>Cambridge Publishing Company Pvt. Ltd.</strong><p>Bengaluru, Karnataka</p></div><p class="footer-note">Digital Catalogue · 2026–27</p></footer><script src="js/catalogue-data.js?v=20260816-3"></script><script src="js/catalogue-query.js?v=20260816-3"></script><script>
const Query=window.CambridgeCatalogueQuery;const stages={"1st-puc":{label:"1st PUC",values:["1st PUC","1 PUC","PUC 1"]},"2nd-puc":{label:"2nd PUC",values:["2nd PUC","2 PUC","PUC 2"]},degree:{label:"Degree",values:["Degree"]}};const params=new URLSearchParams(location.search);let stage=params.get("stage")||"1st-puc";if(!stages[stage])stage="1st-puc";const config=stages[stage];document.getElementById("title").textContent=config.label+" Publications";document.getElementById("intro").textContent="Browse Cambridge publications for "+config.label+".";document.querySelector('[data-stage="'+stage+'"]').classList.add("active");
function collegeBooks(){if(!Query)return[];return Query.active().filter(b=>{const category=String(b.category||"").toLowerCase();const stageValue=String(b.stage||b.level||"").trim().toLowerCase();const classes=Array.isArray(b.class)?b.class.map(String):[];const wanted=config.values.map(x=>x.toLowerCase());return (category==="college"||category==="higher-education"||category==="college-university")&&(wanted.includes(stageValue)||classes.some(x=>wanted.includes(x.toLowerCase())))})}
let books=collegeBooks();const subject=document.getElementById("subject"),search=document.getElementById("search"),results=document.getElementById("results");[...new Set(books.map(b=>b.displaySubject||b.subject).filter(Boolean))].sort().forEach(x=>{const o=document.createElement("option");o.value=x;o.textContent=x;subject.appendChild(o)});
function render(){const q=search.value.trim().toLowerCase(),s=subject.value;const list=books.filter(b=>(!s||(b.displaySubject||b.subject)===s)&&(!q||[b.title,b.series,b.family,b.subject,b.displaySubject,b.type].filter(Boolean).join(" ").toLowerCase().includes(q)));results.innerHTML="";if(!list.length){const box=document.createElement("div");box.className="empty";box.innerHTML=books.length?'<h2>No matching publications</h2><p>Try another search term or subject filter.</p>':'<h2>Titles will be added here</h2><p>The '+config.label+' catalogue structure is ready. We have not inserted placeholder products because no verified '+config.label+' title data is currently present in the repository.</p>';results.appendChild(box);return}const grid=document.createElement("div");grid.className="books";list.forEach(b=>{const row=document.createElement("article");row.className="book-row";const cover=document.createElement("div");cover.className="cover";cover.textContent="BOOK COVER";const info=document.createElement("div");const h=document.createElement("h3");h.textContent=b.title||"Untitled Book";const p=document.createElement("p");p.textContent=[b.series||b.family,b.displaySubject||b.subject,b.medium?b.medium+" Medium":""].filter(Boolean).join(" · ");info.append(h,p);const a=document.createElement("a");a.className="view";a.href="book-details.html?id="+encodeURIComponent(b.id);a.textContent="View Book →";row.append(cover,info,a);grid.appendChild(row)});results.appendChild(grid)}search.addEventListener("input",render);subject.addEventListener("change",render);render();
</script><script src="js/catalogue-selection.js?v=20260816-4"></script></body></html>
