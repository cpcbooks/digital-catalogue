<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Cambridge Standard Kit | Cambridge Digital Catalogue</title><link rel="stylesheet" href="css/catalogue.css"><link rel="stylesheet" href="css/publication-browser.css"><style>.kit-hero{padding:45px 6% 30px;background:#fff}.kit-wrap,.kit-content{max-width:900px;margin:auto}.kit-hero h1{margin:0;font-size:clamp(34px,5vw,50px);letter-spacing:-1.5px}.kit-intro,.kit-status{margin:10px 0 0;color:var(--muted);font-size:13px;line-height:1.55}.kit-content{padding:30px 6% 60px}.kit-card,.kit-empty{padding:24px;background:#fff;border:1px solid var(--border);border-radius:12px}.kit-card h2,.kit-empty h2{margin:0 0 8px;font-size:20px}.kit-meta{margin:16px 0;color:var(--muted);font-size:12px}.kit-list{display:grid;gap:10px;margin-top:20px}.kit-book{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:center;padding:10px;border:1px solid var(--border);border-radius:8px}.kit-book .book-cover{height:76px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#f4f6f8;color:#8b95a5;font-size:8px}.kit-book .book-cover img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}.kit-book h3{margin:0;font-size:14px}.kit-book p{margin:5px 0 0;color:var(--muted);font-size:11px}.kit-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.kit-actions a,.kit-actions button{padding:13px 18px;border-radius:8px;font:inherit;font-size:12px;font-weight:750;text-decoration:none;cursor:pointer}.kit-actions a{border:1px solid var(--border);color:var(--navy);background:#fff}.kit-actions button{border:0;background:var(--navy);color:#fff}.kit-empty{text-align:center}.kit-empty p{margin:0 0 20px;color:var(--muted);font-size:12px;line-height:1.6}@media(max-width:600px){.kit-hero{padding:35px 18px 25px}.kit-content{padding:25px 18px 45px}.kit-card,.kit-empty{padding:18px}.kit-actions{display:grid;grid-template-columns:1fr}.kit-actions a,.kit-actions button{text-align:center}}</style></head><body><header class="catalogue-header"><div class="brand"><div class="brand-name">CAMBRIDGE</div><div class="brand-company">PUBLISHING COMPANY PVT. LTD.</div></div><div class="catalogue-year">DIGITAL CATALOGUE · 2026–27</div></header><section class="kit-hero"><div class="kit-wrap"><nav class="context-nav" aria-label="Catalogue navigation"><a href="index.html">⌂ Home</a><span class="nav-divider" aria-hidden="true"></span><a id="back" href="early-learning.html">← Early Learning</a></nav><p class="eyebrow">CAMBRIDGE STANDARD KIT</p><h1 id="title">Cambridge Standard Kit</h1><p class="kit-intro">A CPC-defined recommended set of publications for this stage.</p></div></section><main class="kit-content" id="content"><div class="kit-empty"><p>Loading catalogue…</p></div></main><script src="js/catalogue-data.js"></script><script src="js/catalogue-query.js"></script><script src="js/catalogue-pilot-config.js"></script><script src="js/catalogue-supabase-adapter.js"></script><script src="js/catalogue-bootstrap.js"></script><script src="js/catalogue-source-links.js"></script><script src="js/catalogue-selection.js"></script><script src="js/standard-kit-config.js"></script><script>(async function(){const Bootstrap=window.CambridgeCatalogueBootstrap,Query=window.CambridgeCatalogueQuery,Config=window.CambridgeStandardKitConfig,Selection=window.CambridgeSelection,content=document.getElementById("content"),level=(new URLSearchParams(location.search).get("level")||"").toLowerCase(),stages={playgroup:"Playgroup",nursery:"Nursery",lkg:"LKG",ukg:"UKG"};function href(path){return Bootstrap.withSource(path)}function empty(heading,text){content.innerHTML='<section class="kit-empty"><h2>'+heading+'</h2><p>'+text+'</p><a class="kit-actions" href="'+href("kit-builder.html?level="+encodeURIComponent(level))+'">Build Your Own Kit</a></section>'}if(!Bootstrap||!Query||!Config||!Selection||!stages[level]){empty("Standard Kit unavailable","Choose an Early Learning stage to view its Cambridge Standard Kit.");return}document.getElementById("back").href=href("early-learning-level.html?level="+encodeURIComponent(level));document.getElementById("title").textContent="Cambridge "+stages[level]+" Standard Kit";try{await Bootstrap.ready()}catch(e){empty("Catalogue unavailable","The Supabase pilot catalogue could not be loaded. Reload the page to try again.");return}const definition=Config.get(level),resolved=Config.resolve(definition,Query.active());if(!resolved.available){empty("Standard Kit not configured","Cambridge Standard Kit is not configured for this stage yet.");return}const name=definition.displayName||"Cambridge "+stages[level]+" Standard Kit",total=Config.mrpTotal(resolved.books),card=document.createElement("section"),heading=document.createElement("h2"),status=document.createElement("p"),meta=document.createElement("p"),list=document.createElement("div"),actions=document.createElement("div");card.className="kit-card";heading.textContent=name;status.className="kit-status";status.textContent="This CPC-defined Kit has "+resolved.books.length+" titles. To choose different books, build your own Kit.";meta.className="kit-meta";meta.textContent=stages[level]+" · "+resolved.books.length+" titles"+(total===null?" · MRP unavailable for one or more titles":" · Total MRP ₹"+total);list.className="kit-list";resolved.books.forEach(book=>{const row=document.createElement("article"),cover=Selection.coverNode(book),info=document.createElement("div"),bookTitle=document.createElement("h3"),bookMeta=document.createElement("p");row.className="kit-book";bookTitle.textContent=book.title||"Untitled Book";bookMeta.textContent=[book.series,book.subject,book.type,Number.isFinite(Number(book.mrp))&&Number(book.mrp)>0?"MRP ₹"+book.mrp:"MRP unavailable"].filter(Boolean).join(" · ");info.append(bookTitle,bookMeta);row.append(cover,info);list.appendChild(row)});actions.className="kit-actions";const custom=document.createElement("a"),add=document.createElement("button");custom.href=href("kit-builder.html?level="+encodeURIComponent(level));custom.textContent="Build Your Own Kit";add.type="button";add.textContent="Add Standard Kit to My Selection →";add.onclick=()=>{const kit={id:"STANDARD-"+definition.stageCode,type:"standard-kit",title:name,standardKitName:name,class:[stages[level]],level,levelName:stages[level],quantity:1,books:resolved.books,bookCount:resolved.books.length};try{const current=JSON.parse(localStorage.getItem("cambridgeOrder")||"[]");localStorage.setItem("cambridgeOrder",JSON.stringify((Array.isArray(current)?current:[]).concat(kit)));location.href=href("order.html")}catch(e){alert("Your selection could not be saved on this device. Please try again.")}};actions.append(custom,add);card.append(heading,status,meta,list,actions);content.replaceChildren(card)})();</script></body></html>
